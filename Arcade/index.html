<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <!-- Orbitron: the same font as Tron/CrazyTanks, so the brand stays cohesive. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
  <title>Arcade</title>
  <style>
    * { box-sizing: border-box; }
    /* @property + an animation on :root → the WHOLE app shares one --accent that moves through
       the logo's same 6 stops (pink→yellow→mint→cyan→violet). Anything that uses
       var(--accent) (ribbons, glows, captions) changes as a block, perfectly in phase. */
    @property --accent {
      syntax: '<color>';
      inherits: true;
      initial-value: #67e8f9;
    }
    :root {
      --accent: #67e8f9;
      animation: accentCycle 11s linear infinite;
    }
    @keyframes accentCycle {
      0%   { --accent: #ff5a8a; }
      20%  { --accent: #ffd23f; }
      40%  { --accent: #6ee7b7; }
      60%  { --accent: #67e8f9; }
      80%  { --accent: #c084fc; }
      100% { --accent: #ff5a8a; }
    }
    /* While a game is running (a full-screen iframe on top), we FREEZE the menu's infinite
       animations and hide the background DOM. Otherwise the browser keeps interpolating
       --accent (which through var() invalidates the styles of EVERYTHING referencing it) and
       that costs FPS inside the game, even though nothing is visible. */
    html.gameOpen,
    html.gameOpen h1,
    html.gameOpen .barAccent,
    html.gameOpen #enter .et,
    html.gameOpen #enter .es {
      animation-play-state: paused;
    }
    html.gameOpen header,
    html.gameOpen main,
    html.gameOpen footer,
    html.gameOpen #enter { visibility: hidden; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      /* Atmosphere: 3 subtle colour blooms in the corners + a very dark base. It gives depth without
         covering anything (all at a low alpha). */
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%,   rgba(80,120,220,0.22) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 0% 100%,  rgba(220,70,120,0.16) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 100% 100%,rgba(70,200,180,0.14) 0%, transparent 65%),
        #08090f;
      color: #e6e9ef;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
    }
    header {
      padding: 32px 20px 14px;
      text-align: center;
    }
    /* "ARCADE" title: a SOLID colour = var(--accent), which is the same colour EVERY tile has at
       this very instant (the cycle lives in :root and they all inherit it). A double glow on the
       accent so it pulses with body. The title used to have a rainbow of its own that went its own
       way and
       clashed visually with the grid. */
    h1 {
      margin: 0;
      font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
      font-size: 40px; font-weight: 900; letter-spacing: 0.28em;
      /* letter-spacing adds that same space AFTER the last letter, so with text-align: center the
         block ends up visually shifted left. A text-indent of the same value pushes it right and
         compensates: the word ends up optically centred. */
      text-indent: 0.28em;
      color: var(--accent);
      text-shadow:
        0 0 2px color-mix(in srgb, var(--accent) 90%, white),
        0 0 18px color-mix(in srgb, var(--accent) 60%, transparent),
        0 0 38px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    /* A thin line under the title — the same accent as the title and the tiles. */
    h1 + .barAccent {
      width: 64px; height: 2px; margin: 10px auto 0;
      background: var(--accent);
      box-shadow: 0 0 16px var(--accent);
      border-radius: 999px;
      opacity: 0.85;
    }
    .subtitle {
      margin-top: 12px;
      font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
      font-size: 11px; font-weight: 600; letter-spacing: 0.34em;
      text-indent: 0.34em;   /* the same fix: it compensates for letter-spacing's trailing space */
      color: #7d8493;
    }
    main {
      flex: 1; overflow-y: auto; padding: 16px 16px 4px;
      -webkit-overflow-scrolling: touch;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px 14px;                       /* a little more air between rows because the name sits under the tile */
      max-width: 720px; margin: 0 auto;
    }
    /* Cell: the grid item. It holds the .tile (a square with the image) and the label below.
       The entry animation (the stagger) lives on the cell so everything moves together.
       We do NOT set --accent here: it INHERITS it from :root (animated as one block). */
    .cell {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      animation: tileIn 0.45s cubic-bezier(0.16,1,0.3,1) both;
      animation-delay: calc(var(--i, 0) * 35ms);
    }
    @keyframes tileIn { from { opacity: 0; transform: translateY(14px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* Tile: the square CARD showing the game's image. ALWAYS 1:1 → they are all the same.
       A double inset shadow (a highlight on top + a shadow below) gives it a subtle "bezel". */
    .tile {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      background: linear-gradient(160deg, #1c1f2a, #11131b);
      border: 1px solid #262a36;
      display: block;
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s cubic-bezier(0.16,1,0.3,1), border-color 0.25s, box-shadow 0.25s;
      position: relative;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),    /* the top lip */
        inset 0 -1px 0 rgba(0,0,0,0.35),         /* the bottom shadow (relief) */
        0 8px 22px rgba(0,0,0,0.32);
    }
    /* The image fills the card without distorting: cover = the aspect ratio is kept and the excess
       is cropped. Filter: a uniform colour grade so thumbnails with uneven saturation/contrast end
       up with the same general "tone". On hover it does a gentle zoom-in (1.06×). */
    .tile img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      -webkit-user-drag: none;             /* there is no standard way; only WebKit's prefix */
      pointer-events: none;
      filter: saturate(1.15) contrast(1.06) brightness(1.02);
      transition: transform 0.55s cubic-bezier(0.16,1,0.3,1), filter 0.35s ease;
      transform-origin: center;
    }
    .cell:hover .tile img {
      transform: scale(1.06);
      filter: saturate(1.28) contrast(1.10) brightness(1.06);
    }
    /* A colour ribbon on top (each game's visual signature) — z-index 3 so it stays above
       the sheen/vignette overlay. */
    .tile::before {
      content: ''; position: absolute; top: 0; left: 18%; right: 18%; height: 2px; z-index: 3;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
      opacity: 0.8;
      border-radius: 0 0 999px 999px;
    }
    /* An overlay on the image: a soft vignette (edges slightly darkened → the eye goes to the
       centre) + a diagonal glass-like sheen at the top left → a premium-card feel. */
    .tile::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 38%),
        radial-gradient(ellipse 110% 110% at 50% 50%, transparent 50%, rgba(0,0,0,0.42) 100%);
      mix-blend-mode: normal;
    }
    .cell:hover .tile { transform: translateY(-2px); }
    .cell:hover .tile {
      border-color: color-mix(in srgb, var(--accent) 45%, #262a36);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.06) inset,
        0 14px 36px rgba(0,0,0,0.5),
        0 0 30px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .cell:active .tile {
      transform: scale(0.95);
      border-color: var(--accent);
    }
    /* The game's name: a caption BELOW the card. Orbitron + a double glow in the global accent
       (which is cycling with the logo). Position: a subtly outlined chip with a plate behind. */
    .tile-name {
      font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
      font-size: 13.5px; font-weight: 700; letter-spacing: 0.16em;
      color: #ffffff; text-align: center;
      text-transform: uppercase;
      padding: 4px 2px;
      /* Double glow: a wide soft halo + a thin accent hugging the letters → it stands out without smearing */
      text-shadow:
        0 0 1px color-mix(in srgb, var(--accent) 80%, white),
        0 0 14px color-mix(in srgb, var(--accent) 55%, transparent),
        0 0 28px color-mix(in srgb, var(--accent) 30%, transparent);
      transition: text-shadow 0.2s;
    }
    .cell:hover .tile-name {
      text-shadow:
        0 0 1px color-mix(in srgb, var(--accent) 90%, white),
        0 0 18px color-mix(in srgb, var(--accent) 70%, transparent),
        0 0 34px color-mix(in srgb, var(--accent) 45%, transparent);
    }
    .tile-tag {
      font-size: 10px; color: #6a7185; margin-top: 4px; letter-spacing: 0.12em;
    }
    .tile.soon {
      opacity: 0.35;
      pointer-events: none;
      filter: grayscale(0.6);
    }
    .tile.soon .tile-name { color: #5a6273; }
    .empty-note {
      text-align: center;
      color: #4a525f;
      font-size: 12px;
      letter-spacing: 0.1em;
      padding: 24px 0;
    }
    footer {
      padding: 14px 20px 18px; text-align: center;
    }
    /* Version + copyright: Orbitron uppercase, thin, low colour. A single line; showLockErr
       overwrites it if there is an orientation failure on mobile. */
    footer #footerVer {
      font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
      font-size: 10px; font-weight: 600; letter-spacing: 0.22em;
      color: #5b6276; text-transform: uppercase;
    }
    footer a { color: #6a7185; text-decoration: none; }
    #installBtn {
      display: none;
      margin: 16px auto 0;
      padding: 11px 24px;
      border: 1px solid rgba(255,217,90,0.45);
      border-radius: 999px;
      background: linear-gradient(160deg, rgba(255,217,90,0.12), rgba(255,217,90,0.04));
      color: #ffd95a;
      font-size: 12px; font-weight: 800; letter-spacing: 0.18em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 0 26px rgba(255,217,90,0.18), 0 6px 18px rgba(0,0,0,0.35);
      transition: transform 0.08s ease, border-color 0.2s, box-shadow 0.2s;
    }
    #installBtn:hover  { box-shadow: 0 0 32px rgba(255,217,90,0.28), 0 6px 22px rgba(0,0,0,0.4); border-color: rgba(255,217,90,0.75); }
    #installBtn:active { transform: scale(0.96); border-color: #ffd95a; }
    #installBtn.show { display: inline-block; }

    /* Player (shell): the game runs in a full-screen iframe WITHOUT navigating, so the
       Fullscreen API requested on the tile's tap lasts the whole session (it takes the notch
       and hides the status bar). It covers everything, with no safe area, for full bleed. */
    #player { position: fixed; inset: 0; z-index: 1000; display: none; background: #000; }
    #player.show { display: block; }
    #frame { width: 100%; height: 100%; border: 0; display: block; }
    /* A landscape game WITHOUT rotating the device: the phone stays in portrait (it does not
       rotate → zero flashes) and we rotate the iframe 90° in CSS, giving it a landscape size. You
       hold the phone sideways. The game inside sees a landscape viewport; the touches map
       themselves through the transform. (translateX(100vw)+rotate(90deg) with origin 0,0 makes it
       line up exactly with the screen.) */
    @media (orientation: portrait) {
      #frame.landscape {
        position: absolute; top: 0; left: 0;
        width: 100vh; height: 100vw;
        transform-origin: 0 0;
        transform: translateX(100vw) rotate(90deg);
      }
    }

    /* The "quit the app" button (it closes the PWA). Only visible in an INSTALLED PWA
       (display-mode: standalone/minimal-ui). We do NOT include display-mode: fullscreen — the shell
       the Arcade goes fullscreen when launching a game and that lit the button up even in an
       ordinary tab. In a browser tab window.close() is blocked by Chrome, so the button would do
       nothing — it is hidden to avoid confusion. iOS Safari home-screen
       (navigator.standalone === true) switches it on via body.pwa-ios further down. */
    #exitApp {
      position: fixed; z-index: 50;
      top: calc(env(safe-area-inset-top) + 10px);
      right: calc(env(safe-area-inset-right) + 12px);
      width: 36px; height: 36px; border-radius: 50%; padding: 0;
      border: 1px solid #3a4154; background: rgba(20,22,30,0.82); color: #9aa3b6;
      display: none; align-items: center; justify-content: center; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s, border-color 0.15s, color 0.15s;
    }
    @media (display-mode: standalone), (display-mode: minimal-ui) {
      #exitApp { display: flex; }
    }
    body.pwa-ios #exitApp { display: flex; }
    #exitApp:active { transform: scale(0.92); border-color: #ff8a8e; color: #ff8a8e; }
    #exitApp svg { width: 18px; height: 18px; display: block; }

    /* The Arcade's ⛶ button: ONLY in a browser tab (when you are NOT a PWA). In an installed PWA
       the redundant button would be "quit the app" (#exitApp), so there it is hidden. It lets the
       user who came in through the browser leave the fullscreen the shell requested when launching
       a game, or ENTER fullscreen manually from the menu. */
    #fsApp {
      position: fixed; z-index: 50;
      top: calc(env(safe-area-inset-top) + 10px);
      right: calc(env(safe-area-inset-right) + 12px);
      width: 36px; height: 36px; border-radius: 50%; padding: 0;
      border: 1px solid #3a4154; background: rgba(20,22,30,0.82); color: #9aa3b6;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s, border-color 0.15s, color 0.15s;
    }
    /* In an installed PWA (standalone / minimal-ui / iOS home-screen) it is hidden — #exitApp is already there. */
    @media (display-mode: standalone), (display-mode: minimal-ui) { #fsApp { display: none; } }
    body.pwa-ios #fsApp { display: none; }
    #fsApp:hover  { border-color: #6ee7b7; color: #6ee7b7; }
    #fsApp:active { transform: scale(0.92); border-color: #6ee7b7; color: #6ee7b7; }
    #fsApp svg { width: 18px; height: 18px; display: block; }
    /* Toggles the enter/exit icon according to body.fs-on (we set it in fullscreenchange). */
    #fsApp .ic-exit { display: none; }
    body.fs-on #fsApp .ic-enter { display: none; }
    body.fs-on #fsApp .ic-exit  { display: block; }

    /* Entry screen: the touch here is the gesture that activates fullscreen on opening the app
       (a gesture CANNOT be simulated in code — isTrusted/activation prevent it). */
    #enter {
      position: fixed; inset: 0; z-index: 500; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background:
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(80,120,220,0.18) 0%, transparent 60%),
        #08090f;
      color: #e6e9ef; text-align: center; padding: 24px;
    }
    #enter.hide { display: none; }
    /* The same arcade gradient as the header (in sync) */
    /* The same treatment as the menu's h1: colour = the global var(--accent). When the splash goes
       away and the menu appears, both ARCADEs are at EXACTLY the same colour (zero jump). */
    #enter .et {
      font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
      font-size: 40px; font-weight: 900; letter-spacing: 0.28em;
      text-indent: 0.28em;
      color: var(--accent);
      text-shadow:
        0 0 2px color-mix(in srgb, var(--accent) 90%, white),
        0 0 22px color-mix(in srgb, var(--accent) 65%, transparent),
        0 0 44px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    /* "TAP TO ENTER" as a chip — more button-like, it still flashes gently */
    #enter .es {
      font-size: 12px; letter-spacing: 0.28em; color: #cbd5e1;
      padding: 10px 20px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      box-shadow: 0 0 24px rgba(120,200,255,0.10) inset, 0 6px 18px rgba(0,0,0,0.4);
      animation: chipPulse 1.8s ease-in-out infinite;
    }
    @keyframes chipPulse { 0%, 100% { box-shadow: 0 0 24px rgba(120,200,255,0.10) inset, 0 6px 18px rgba(0,0,0,0.4); opacity: 1; } 50% { box-shadow: 0 0 36px rgba(120,200,255,0.22) inset, 0 6px 22px rgba(0,0,0,0.4); opacity: 0.92; } }
    #enter .ev { margin-top: 22px; font-size: 11px; letter-spacing: 0.22em; color: #4a525f; }
    @keyframes blink { 50% { opacity: 0.25; } }
  </style>
</head>
<body>
  <!-- Entry screen (the initial gesture → fullscreen when the app opens) -->
  <div id="enter">
    <div class="et">ARCADE</div>
    <div class="es">▶ TAP TO ENTER</div>
    <div class="ev" id="splashVer"></div>
  </div>

  <button id="exitApp" aria-label="close the app" title="Close the app">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>
  </button>
  <!-- The Arcade's ⛶ button — browser only (not the PWA). It toggles fullscreen at shell level. -->
  <button id="fsApp" aria-label="fullscreen" title="Fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><g class="ic-enter"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></g><g class="ic-exit"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></g></svg>
  </button>

  <header>
    <h1>ARCADE</h1>
    <div class="barAccent"></div>
    <div class="subtitle">PROTOTIPOS</div>
    <button id="installBtn">⬇ INSTALAR APP</button>
  </header>

  <main>
    <div class="grid" id="grid"><!-- tiles generated by JS (see GAMES) --></div>
  </main>

  <footer>
    <div id="footerVer"></div>
  </footer>

  <!-- The player: the game lives in here (an iframe created by JS), with no navigation -->
  <div id="player"></div>

  <script>
    // Visible version (splash + footer). BUMP this number on every update → it lets you confirm
    // at a glance whether the PWA picked up the latest deploy (Android caches hard).
    const VERSION = 'v2.0.2';
    { const sv = document.getElementById('splashVer'); if (sv) sv.textContent = VERSION;
      const fv = document.getElementById('footerVer'); if (fv) fv.textContent = VERSION + ' · © 2026 Franco Laboranti'; }

    // iOS Safari "Add to Home Screen": on old versions it does not match (display-mode: standalone),
    // so we detect it via navigator.standalone and add body.pwa-ios → #exitApp's CSS switches it on.
    if (window.navigator.standalone === true) document.body.classList.add('pwa-ios');

    // Game catalogue: [thumb (a file in thumbnails/), name, path, orientation].
    // 'landscape' rotates the iframe in CSS (you hold the phone sideways); 'portrait' = normal.
    // Each card's colour is NO LONGER set per game: it inherits the GLOBAL --accent, which cycles
    // in sync with the logo's shine (see @property + @keyframes accentCycle at the top of the CSS).
    // The 5th field (hue) is left as a historical note, the factory ignores it.
    const GAMES = [
      ['Loop.webp',          'Loop',            'Loop/LoopWeb/',                     'landscape', '#7df9ff'],
      ['Snake.webp',         'Snake',           'Snake/SnakeWeb/',                   'portrait',  '#84cc16'],
      ['TankWars.webp',      'Tank Wars',       'TankWARS/TankWARSWeb/',             'landscape', '#f59e0b'],
      ['CrazyTanks.webp',    'Crazy Tanks',     'CrazyTanks/CrazyTanksWeb/',         'landscape', '#fb923c'],
      ['Pong.webp',          'Sleepy Pong',     'Pong/PongWeb/',                     'landscape', '#6ee7b7'],
      ['Balls.webp',         'Marbles',         'Balls/BallsWeb/',                   'portrait',  '#c084fc'],
      ['MiniBalls.webp',     'Mini Marbles',    'MiniBalls/MiniBallsWeb/',           'portrait',  '#67e8f9'],
      ['Fireworks.webp',     'Fireworks',       'Fireworks/FireworksWeb/',           'portrait',  '#f472b6'],
      ['FireworksV2.webp',   'Fireworks V2',    'FireworksV2/FireworksV2Web/',       'landscape', '#22d3ee'],
      ['Tron.webp',          'Tron',            'Tron/TronWeb/',                     'portrait',  '#38bdf8'],
      ['TronV2.webp',        'Tron V2',         'TronV2/TronV2Web/',                 'landscape', '#fb7185'],
      ['DonkeyKong.webp',    'Donkey Kong',     'DonkeyKong/DonkeyKongWeb/',         'portrait',  '#e83b2a'],
      ['Pacman.webp',        'Pac-Man',         'Pacman/PacmanWeb/',                 'portrait',  '#ffe300'],
      ['StickFight.webp',    'Stick Fight',     'StickFight/StickFightWeb/',         'landscape', '#35d6ff'],
      ['Chess.webp',         'Chess',           'Chess/ChessWeb/',                   'portrait',  '#fbbf24'],
      ['Clock.webp',         'Clock',           'Clock/ClockWeb/',                   'portrait',  '#94a3b8'],
      ['MineSweeper.webp',   'Minesweeper',     'MineSweeperGPT/MineSweeperWeb/',    'portrait',  '#ef4444'],
      ['Hangman.webp',       'Hangman',         'Hangman/HangmanWeb/',               'portrait',  '#a3e635'],
      ['NewtonsCradle.webp', "Newton's Cradle", "Newton's Cradle/NewtonsCradleWeb/", 'landscape', '#5eead4'],
      ['Poker.webp',         'Poker',           'Poker/PokerWeb/',                   'landscape', '#dc2626'],
      ['Simon.webp',         'Simon',           'SimonSays/SimonSaysWeb/',           'portrait',  '#e879f9'],
      ['Tateti.webp',        'Tic-Tac-Toe',     'Tateti/TatetiWeb/',                 'portrait',  '#60a5fa'],
    ];
    {
      const grid = document.getElementById('grid');
      let idx = 0;
      for (const [thumb, name, path, orient] of GAMES) {
        const src = encodeURI('../' + path);   // it encodes the space in "Newton's Cradle"
        // cell = a grid item. It only carries the stagger; --accent is GLOBAL and cycles with the logo.
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.setProperty('--i', idx++);
        const a = document.createElement('a');
        a.className = 'tile';
        a.href = src;                            // fallback if it is opened standalone (without the shell)
        a.dataset.src = src;
        a.dataset.orient = orient;
        a.setAttribute('aria-label', name);
        // `lazy`: only the thumbnails in view are downloaded. With 22 cards all requesting at
        // once, on a phone half of them are not even on screen when they are requested.
        // `async`: decoding does not block the main thread while the cards come in.
        a.innerHTML = '<img src="thumbnails/' + thumb + '" alt="" loading="lazy" decoding="async">';
        const label = document.createElement('div');
        label.className = 'tile-name';
        label.textContent = name;
        cell.appendChild(a);
        cell.appendChild(label);
        grid.appendChild(cell);
      }
    }

    // Register the service worker (needed for the PWA to be "installable")
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    // Installation: Chrome no longer shows an automatic banner. We capture the event,
    // show a button of our own and fire the native prompt on tapping it.
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();            // avoids the mini-infobar; we control it ourselves
      deferredPrompt = e;
      installBtn.classList.add('show');
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.classList.remove('show');
    });
    // If it is already installed (or gets installed), hide the button.
    window.addEventListener('appinstalled', () => installBtn.classList.remove('show'));

    // Quit the app. window.close() closes the PWA AS LONG AS there is no navigation
    // history — which is why the games do NOT use pushState (see launch/closeGame), so the
    // history stays at 1 and this button can always close the app. The button is only
    // shown in an installed PWA (see the CSS @media display-mode above), so in a browser
    // tab you never get to click it.
    document.getElementById('exitApp').addEventListener('click', () => {
      try { window.close(); } catch (e) {}
    });

    // The Arcade's ⛶ button (browser only, not PWA): it toggles fullscreen at the shell level. The click IS
    // a user gesture, so requestFullscreen is not rejected for lack of activation.
    document.getElementById('fsApp').addEventListener('click', () => {
      const doc = document, root = doc.documentElement;
      if (doc.fullscreenElement || doc.webkitFullscreenElement) {
        try { (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc); } catch (e) {}
      } else {
        try {
          const req = root.requestFullscreen || root.webkitRequestFullscreen;
          const p = req && req.call(root);
          if (p && p.catch) p.catch(() => {});
        } catch (e) {}
      }
    });

    // ── ORIENTATION + PLAYER (shell) ─────────────────────────────────────
    const player = document.getElementById('player');
    const root   = document.documentElement;
    let frame = null;   // a new one is created per game and destroyed on exiting

    function lockOrient(o) {
      try {
        if (screen.orientation && screen.orientation.lock) {
          const p = screen.orientation.lock(o);
          if (p && p.catch) p.catch(() => {});
        }
      } catch (e) {}
    }
    // Portrait lock WITH RETRIES: on switching to fullscreen FROM landscape, on several Androids the
    // lock is rejected on the first attempt. We retry a few times; if it still fails, we show it
    // in the footer (for diagnosis). On success it does not touch the footer.
    function lockPortrait(tries) {
      tries = tries || 0;
      let p;
      try { p = (screen.orientation && screen.orientation.lock) ? screen.orientation.lock('portrait') : null; }
      catch (e) { showLockErr(e && e.name || e); return; }
      if (p && p.then) p.then(null, (e) => {
        if (tries < 5) setTimeout(() => lockPortrait(tries + 1), 180);
        else showLockErr((e && e.name) || e);
      });
    }
    function showLockErr(msg) {
      // ALL orientation-lock errors are false positives for the end user:
      //  · NotSupportedError → desktop with no API (Chrome/Firefox on a PC)
      //  · AbortError → the request was superseded or the activation was lost (common on desktop FS)
      //  · SecurityError → it needed a gesture that was not available
      // None of them is an Arcade bug — the lock simply does not apply in that context.
      // We keep the diagnostics in the console (in case something odd turns up on a new Android) but we do NOT
      // overwrite the copyright footer: the bottom line is the app's signature, not an error panel.
      try { console.warn('orientation.lock failed:', msg); } catch (e) {}
    }
    let entered = false;   // true after tapping "ENTER" (the app's initial gesture)

    // The entry screen (and the menu) are PORTRAIT. In the installed PWA, Android Chrome
    // allows fixing the orientation on load with no gesture; in a tab it fails silently. This goes
    // on load (not next to the tap's requestFullscreen), so it does not reintroduce the 2-tap bug.
    lockOrient('portrait');

    // Fullscreen API only (notch + status bar). The DEVICE's orientation does NOT change:
    // it stays locked portrait (the lock above). Landscape games are rotated in CSS (the
    // .landscape class on the iframe in launch), not by rotating the device → zero orientation flashes.
    function requestFs() {
      if (document.fullscreenElement || !root.requestFullscreen) return Promise.resolve();
      let p; try { p = root.requestFullscreen(); } catch (e) { return Promise.reject(e); }
      return (p && p.then) ? p : Promise.resolve();
    }
    // coming back from a game (bfcache included) re-asserts portrait (a no-op if it already is → no flash)
    window.addEventListener('pageshow', () => { if (entered && !player.classList.contains('show')) lockOrient('portrait'); });

    // Entry screen (the initial gesture, via 'click' = a complete gesture). If the fullscreen is
    // rejected, we show the reason on the splash and you can tap again to retry.
    const enterEl  = document.getElementById('enter');
    const enterMsg = enterEl.querySelector('.es');
    function enterApp() {
      // The splash ALWAYS closes on the first click — getting into the menu must not depend on
      // the browser accepting fullscreen (on desktop it often fails silently with no visible cause
      // for the user, and keeping them stuck on the splash is broken UX). Lock + FS are best-effort.
      entered = true;
      enterEl.classList.add('hide');
      requestFs().then(lockPortrait, (e) => {
        // Optional diagnostics in the footer (it does not block the user)
        const fv = document.getElementById('footerVer');
        if (fv && e) fv.textContent = VERSION + ' · FS✗ ' + ((e.name || e) + '');
      });
    }
    enterEl.addEventListener('click', enterApp);

    // Launching a game: the tile's TAP is a valid gesture → we request the real Fullscreen API
    // (it takes the notch + hides the status bar) and lock the game's orientation.
    // We create a NEW IFRAME per game (its initial load adds no history entry) and
    // do NOT use pushState: that way the history stays at 1 and the "quit the app" button can always
    // close the PWA. The trade-off chosen: the phone's back button inside a game
    // closes the app (to go back to the menu you use the game's ✕).
    function launch(src, orient) {
      requestFs().catch(() => {});   // fullscreen for the notch; the device does NOT rotate (locked portrait)
      // html.gameOpen → the CSS pauses all the menu's infinite animations and hides the background DOM.
      // Without this, --accent cycling on :root invalidated the parent document's styles every frame → FPS↓.
      document.documentElement.classList.add('gameOpen');
      frame = document.createElement('iframe');
      frame.id = 'frame';
      frame.allow = 'fullscreen; accelerometer; gyroscope; autoplay';
      frame.setAttribute('allowfullscreen', '');
      // A landscape game → rotation in CSS (the device is not rotated). Portrait → normal.
      if (orient === 'landscape') frame.classList.add('landscape');
      // cache-buster: the game always loads its latest version (it avoids a stale cache after a deploy).
      frame.src = src + (src.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
      player.appendChild(frame);
      player.classList.add('show');
    }
    function closeGame() {
      if (!player.classList.contains('show')) return;   // it avoids a double close
      player.classList.remove('show');
      document.documentElement.classList.remove('gameOpen');   // resumes the menu's animations
      if (frame) {
        // about:blank BEFORE remove(): it forces the renderer to THROW AWAY the game's document AT ONCE
        // (canvases, GPU buffers, AudioContext, Matter worlds, requestAnimationFrame loops).
        // A bare remove() leaves that memory "hanging" for a while on mobile —iOS Safari has a canvas
        // budget PER TAB, and every iframe shares it—. After several games the renderer
        // sat near the ceiling and the next one that allocated a lot on loading (Pong bakes a background +
        // brick sprites) failed: black, and then the "broken image" icon (a crashed subframe).
        // Navigating to blank unloads the document on the spot; only then do we remove it.
        try { frame.src = 'about:blank'; } catch (e) {}
        frame.remove(); frame = null;
      }
      lockOrient('portrait');                            // portrait menu
    }

    // Each tile with data-src launches its game (preventDefault on the <a>, which stays as a fallback
    // if the page is opened standalone without the shell).
    document.getElementById('grid').addEventListener('click', (e) => {
      const tile = e.target.closest('.tile[data-src]');
      if (!tile) return;
      e.preventDefault();
      launch(tile.dataset.src, tile.dataset.orient);
    });

    // Messages from the embedded game:
    //  • arcade:exit       → close the player (back to the menu)
    //  • arcade:fullscreen → toggle the real fullscreen (the shell handles it, not the iframe)
    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'arcade:exit') { closeGame(); return; }
      if (e.data.type === 'arcade:fullscreen') {
        if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (x) {} }
        else if (root.requestFullscreen) { try { const p = root.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (x) {} }
      }
    });
    // On (re)entering fullscreen, re-assert portrait (the lock only takes reliably in fullscreen,
    // and a toggle may have released it). We also tell the game the state so it can sync its icon.
    // body.fs-on drives #fsApp's ⛶↔⊞ toggle.
    document.addEventListener('fullscreenchange', () => {
      const on = !!document.fullscreenElement;
      document.body.classList.toggle('fs-on', on);
      if (on) lockPortrait();
      if (frame && frame.contentWindow) {
        try { frame.contentWindow.postMessage({ type: 'arcade:fs-state', on }, '*'); } catch (x) {}
      }
    });
  </script>
</body>
</html>
