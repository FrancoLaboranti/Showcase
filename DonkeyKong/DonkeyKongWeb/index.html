<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Donkey Kong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../Arcade/arcade-shell.css">
<style>
  :root { --bar-height: 122px; }   /* alto para los dos pulgares (D-pad grande) */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    font-family: 'Press Start 2P', 'Segoe UI', system-ui, sans-serif;
  }
  /* El canvas ocupa sólo el área SOBRE la barra. Tamaños seteados explícito desde JS en cada resize. */
  #c {
    display: block; position: absolute;
    top: 0; left: 0;
  }

  #hint {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    max-width: min(88vw, 480px);
    background: rgba(18,10,12,0.78); border: 1px solid rgba(255,255,255,0.10);
    padding: 12px 20px; border-radius: 14px;
    text-align: center; color: rgba(255,255,255,0.92);
    font-size: 11px; letter-spacing: 0.04em; line-height: 1.6;
    pointer-events: none; transition: opacity 0.8s; z-index: 2;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }

  /* Barra inferior a DOS PULGARES: cluster izquierdo ◄ ► (pulgar izq) · utilidades al centro · cluster
     derecho ▲ ▼ (pulgar der). Saltar = tocar la pantalla. Botones grandes, look moderno (gradiente + relieve). */
  #bar {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: calc(var(--bar-height) + env(safe-area-inset-bottom));
    padding: 8px 14px env(safe-area-inset-bottom);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, rgba(22,16,24,0.94), rgba(8,8,12,0.97));
    border-top: 1px solid rgba(255,93,146,0.28);
    box-shadow: 0 -6px 22px rgba(0,0,0,0.45);
    z-index: 3;
  }
  .pad { display: flex; gap: 16px; align-items: center; }
  .pad button {
    width: 66px; height: 66px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.16), rgba(255,255,255,0.04) 72%);
    color: #fff; display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: none; padding: 0;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.45), 0 3px 12px rgba(0,0,0,0.4);
    transition: background 0.08s, transform 0.06s, box-shadow 0.08s;
  }
  .pad button svg { display: block; width: 32px; height: 32px; pointer-events: none; }
  .pad button:active, .pad button.held {
    background: radial-gradient(circle at 50% 30%, rgba(255,120,150,0.62), rgba(255,60,95,0.32) 72%);
    border-color: rgba(255,120,150,0.7); transform: scale(0.93);
    box-shadow: inset 0 2px 12px rgba(0,0,0,0.5), 0 0 20px rgba(255,80,115,0.5);
  }
  /* utilidades (✕ ⛶ ⓘ) compactas y centradas; neutralizamos el align-self del arcade-shell */
  .util { display: flex; align-items: center; gap: 8px; }
  .util button { align-self: center !important; margin-bottom: 0 !important; }

  /* Botones ✕/⛶/ⓘ + overlay de salida vienen de arcade-shell.css. */
  /* HUD de FPS — formato Pong: panel monoespaciado arriba a la izquierda, sin border-radius. */
  #fpsOverlay {
    position: absolute;
    left: calc(8px + env(safe-area-inset-left));
    top: calc(8px + env(safe-area-inset-top));
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 18px;
    color: rgba(255,255,255,0.9);
    background: rgba(0,0,0,0.55);
    padding: 4px 6px;
    pointer-events: none;
    display: none;
    z-index: 9;
  }
</style>
</head>
<body>
  <!-- DEBUG temporal: muestra en pantalla cualquier error JS (para diagnosticar en mobile, donde no hay
       consola a mano). Registrado antes que el script principal, así caza también errores de parseo. -->
  <script>
  (function () {
    function show(msg) {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);' +
          'max-width:90vw;max-height:80vh;overflow:auto;z-index:99999;background:rgba(150,0,0,0.95);' +
          'border:1px solid rgba(255,255,255,0.4);border-radius:8px;' +
          'color:#fff;font:12px/1.4 monospace;padding:14px;white-space:pre-wrap;word-break:break-word;text-align:left;';
        (document.body || document.documentElement).appendChild(d);
      }
      d.textContent += msg + '\n';
    }
    window.addEventListener('error', function (e) {
      show((e.message || 'error') + '  @ ' + ((e.filename || '').split('/').pop()) + ':' + e.lineno + ':' + e.colno);
    });
    window.addEventListener('unhandledrejection', function (e) {
      show('promise: ' + (e.reason && (e.reason.message || e.reason)));
    });
  })();
  </script>
  <canvas id="c"></canvas>
  <div id="hint">◄ ► caminar · ▲ ▼ trepar escaleras<br>tocá la pantalla para SALTAR</div>
  <div id="bar">
    <!-- pulgar IZQUIERDO: caminar ◄ ► -->
    <div class="pad padL">
      <button id="btnLeft"  aria-label="caminar izquierda" title="Caminar izquierda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="btnRight" aria-label="caminar derecha" title="Caminar derecha">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <!-- utilidades centrales -->
    <div class="util">
      <button id="btnExit" aria-label="salir al menu" title="Salir al menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button id="btnFs" aria-label="pantalla completa" title="Pantalla completa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><g class="ic-enter"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></g><g class="ic-exit"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></g></svg>
      </button>
      <button id="btnInfo" aria-label="info" title="Info / FPS">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><circle cx="12" cy="8" r="0.9" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
    <!-- pulgar DERECHO: trepar ▲ ▼ -->
    <div class="pad padR">
      <button id="btnUp" aria-label="trepar arriba" title="Trepar arriba">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>
      </button>
      <button id="btnDown" aria-label="bajar" title="Bajar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>
      </button>
    </div>

  <script>
  // ════════════════════════════════════════════════════════════════════
  //  DONKEY KONG — homenaje web al arcade de 1981, con el shell mobile de
  //  TronWeb (v1) en PORTRAIT. Sin .py original: este es un juego nuevo.
  //
  //  · Nivel clásico de vigas inclinadas + escaleras (algunas rotas).
  //  · DK tira barriles que ruedan, caen por los bordes y a veces bajan
  //    por las escaleras. Saltarlos da puntos; tocarlos mata.
  //  · Martillos para romper barriles, bolas de fuego desde el tambor de
  //    aceite, BONUS que baja con el tiempo, vidas y récord (localStorage).
  //  · Todo el arte son sprites pixel-art definidos como strings y
  //    horneados en canvas offscreen (imageSmoothing off = look arcade).
  //  · TODA la geometría va en FRACCIONES del playfield (PF) — el análogo
  //    de xper/yper de los .py — así el resize en pleno juego no rompe nada.
  // ════════════════════════════════════════════════════════════════════
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ── TUNING ──
  const ASPECT      = 0.58;     // relación de aspecto del playfield (portrait, ~9:15.5)
  const WALK        = 0.158;    // velocidad MÁXIMA de Mario (PF.w / s)
  // ── movimiento moderno: acelera al apretar y conserva inercia al soltar (glide), no es on/off ──
  const RUN_ACCEL   = 1.9;      // aceleración al caminar (PF.w/s²) → llega al máx en ~0.08 s
  const RUN_DECEL   = 0.85;     // fricción al soltar → se desliza ~0.19 s antes de frenar (guarda velocidad)
  const AIR_ACCEL   = 0.9;      // control aéreo (menor que en piso, pero existe)
  const TURN_BOOST  = 2.4;      // × aceleración al cambiar de dirección (giro snappy, plataformero moderno)
  const CLIMB       = 0.085;    // velocidad trepando (PF.h / s)
  const GRAV        = 0.85;     // gravedad (PF.h / s²)
  const JUMP_V      = 0.26;     // impulso de salto (PF.h / s) → ápice ≈ 0.04 PF.h
  const FALL_DEATH  = 0.075;    // caída (desde el pico) mayor a esto = MUERTE (PF.h) — como el original: el salto
                                //   propio (ápice ~0.04) se sobrevive, pero CAERSE de una viga (~0.11+) te mata.
  const BARREL_SPD  = 0.19;     // velocidad base de barriles (PF.w / s)
  const BARREL_DESC = 0.16;     // barril bajando escalera (PF.h / s)
  const FIRE_SPD    = 0.055;    // bola de fuego (PF.w / s)
  const HAMMER_TIME = 8;        // s de martillo
  const HAMMER_HOVER= 0.082;    // a cuánto flota el martillo sobre la viga (PF.h) — sólo se agarra saltando
  const BONUS_TICK  = 2.0;      // s entre descuentos de bonus
  const MAX_BARRELS = 12;
  const MAX_PIES    = 3;        // #9 tope de tortas en pantalla
  const BELT_SPD    = 0.18;     // #9 deriva de la cinta como fracción de WALK (siempre out-walkable)

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, dpr = 1;
  let bgGrad = null, pfGrad = null, vigGrad = null;   // gradientes de fondo (se construyen una vez por resize)
  // Playfield: rect portrait centrado dentro del canvas (en desktop quedan bandas laterales tipo arcade).
  const PF = { x: 0, y: 0, w: 1, h: 1 };
  const ppx = f => PF.x + f * PF.w;     // fracción → px (los análogos de xper/yper)
  const ppy = f => PF.y + f * PF.h;

  const FONT = '"Press Start 2P", monospace';
  function ptext(txt, fx, fy, sizeF, color, align = 'center') {
    ctx.font = Math.max(7, Math.round(sizeF * PF.h)) + 'px ' + FONT;
    ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillText(txt, ppx(fx), ppy(fy));
  }
  const pad = (n, d) => String(Math.max(0, n | 0)).padStart(d, '0');
  // path de rectángulo redondeado (HUD / paneles) sobre cualquier contexto
  function roundRectPath(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  // sombra elíptica de contacto (barata, SIN shadowBlur por frame) para dar volumen a los sprites
  function shadowAt(px, syPx, halfW) {
    ctx.fillStyle = 'rgba(0,0,0,0.30)';
    ctx.beginPath(); ctx.ellipse(px, syPx, halfW, halfW * 0.32, 0, 0, TAU); ctx.fill();
  }

  // ════════════════ NIVEL (fracciones del playfield) ════════════════
  // Vigas: superficie lineal de (x0,yL) a (x1,yR). Los barriles ruedan hacia el extremo MÁS BAJO
  // (y mayor) y caen por el borde abierto. Índice 0 = viga de abajo; 6 = plataforma de Pauline.
  const GIRDERS = [
    { x0: 0.00, x1: 1.00, yL: 0.893, yR: 0.867 },   // 0 · piso: cae hacia el tambor de aceite (izq)
    { x0: 0.00, x1: 0.93, yL: 0.732, yR: 0.758 },   // 1 · baja a la derecha
    { x0: 0.07, x1: 1.00, yL: 0.623, yR: 0.597 },   // 2 · baja a la izquierda
    { x0: 0.00, x1: 0.93, yL: 0.462, yR: 0.488 },   // 3 · baja a la derecha
    { x0: 0.07, x1: 1.00, yL: 0.353, yR: 0.327 },   // 4 · baja a la izquierda
    { x0: 0.00, x1: 0.93, yL: 0.195, yR: 0.218 },   // 5 · viga de DK: los barriles arrancan acá
    { x0: 0.30, x1: 0.62, yL: 0.115, yR: 0.115 },   // 6 · plataforma de Pauline (llegar = ganar)
  ];
  const PAULINE_G = 6;
  function surfY(gi, fx) {
    const g = GIRDERS[gi];
    const t = clamp((fx - g.x0) / (g.x1 - g.x0), 0, 1);
    return g.yL + (g.yR - g.yL) * t;
  }
  function rollDir(gi) { const g = GIRDERS[gi]; return g.yR > g.yL ? 1 : -1; }   // rueda hacia el lado bajo

  // Escaleras: {x, lo, hi, broken}. Las rotas no las puede usar Mario (los barriles sí bajan).
  const LADDERS = [
    { x: 0.60, lo: 0, hi: 1, broken: false },
    { x: 0.84, lo: 0, hi: 1, broken: false },
    { x: 0.26, lo: 0, hi: 1, broken: true  },
    { x: 0.14, lo: 1, hi: 2, broken: false },
    { x: 0.50, lo: 1, hi: 2, broken: true  },
    { x: 0.74, lo: 1, hi: 2, broken: false },
    { x: 0.20, lo: 2, hi: 3, broken: false },
    { x: 0.36, lo: 2, hi: 3, broken: true  },
    { x: 0.82, lo: 2, hi: 3, broken: false },
    { x: 0.30, lo: 3, hi: 4, broken: false },
    { x: 0.64, lo: 3, hi: 4, broken: false },
    { x: 0.86, lo: 3, hi: 4, broken: true  },
    { x: 0.24, lo: 4, hi: 5, broken: true  },
    { x: 0.55, lo: 4, hi: 5, broken: false },
    { x: 0.86, lo: 4, hi: 5, broken: false },
    { x: 0.36, lo: 5, hi: 6, broken: false },
    { x: 0.56, lo: 5, hi: 6, broken: false },
  ];

  const OIL_X = 0.06;                                       // tambor de aceite (viga 0)
  const DK_X = 0.13;                                        // DK parado en la viga 5
  const PAULINE_X = 0.46;
  const MARIO_START = 0.18;
  const HAMMER_SPOTS = [ { g: 4, x: 0.40 }, { g: 1, x: 0.38 } ];

  // ════════════════ SEMILLA / VARIEDAD DE TABLERO (foundation) ════════════════
  // PRNG determinista (mulberry32): un mismo seed → misma secuencia. Lo usan el reroll de escaleras
  // rotas, el jitter de pendiente, la posición de martillos, los coleccionables y el modo Diario.
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // Snapshot del tablero hand-authored ANTES de cualquier mutación: fallback si un seed diera algo
  // inválido, y base sobre la que se aplica el jitter cada nivel (no se acumula).
  const GIRDERS_ORIG = GIRDERS.map(g => ({ yL: g.yL, yR: g.yR }));
  const LADDERS_ORIG_BROKEN = LADDERS.map(l => l.broken);
  // Índices de escaleras agrupados por tramo (lo) y cuántas rotas tiene cada tramo en el original.
  // Reproducir esa MISMA cuenta por tramo mantiene la dificultad: sólo cambia CUÁL escalera está rota.
  const TIERS = [];                                         // TIERS[lo] = [idx, idx, ...]
  LADDERS.forEach((l, i) => { (TIERS[l.lo] = TIERS[l.lo] || []).push(i); });
  const BROKEN_PER_TIER = TIERS.map(idxs => idxs.filter(i => LADDERS_ORIG_BROKEN[i]).length);
  const dailyKey = () => 'dk_daily_' + new Date().toISOString().slice(0, 10);
  function dateSeed() { const d = new Date(); return (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) >>> 0; }

  // ════════════════ SPRITES pixel-art ════════════════
  // makeSprite hornea un mapa de strings a un canvas offscreen 1px-por-celda; se dibuja escalado
  // con imageSmoothing apagado (pixeles duros = look arcade). '.' = transparente.
  function makeSprite(rows, pal) {
    const h = rows.length, w = Math.max(...rows.map(r => r.length));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const ch = row[x];
        if (ch !== '.' && pal[ch]) { c.fillStyle = pal[ch]; c.fillRect(x, y, 1, 1); }
      }
    });
    return { cv, w, h };
  }
  // dibuja centrado en (px,py) con alto ph (px); flip espeja horizontal; rot en radianes.
  function drawSpr(s, px, py, ph, flip = false, rot = 0, alpha = 1) {
    const pw = ph * s.w / s.h;
    ctx.save();
    ctx.translate(px, py);
    if (rot) ctx.rotate(rot);
    if (flip) ctx.scale(-1, 1);
    if (alpha < 1) ctx.globalAlpha = alpha;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(s.cv, -pw / 2, -ph / 2, pw, ph);
    ctx.restore();
  }

  const MPAL = { R:'#e83b2a', H:'#7a3b12', S:'#ffc69b', W:'#ffffff', B:'#2456e6', X:'#26140a' };
  // #7 filas factorizadas: las skins re-hornean estos mismos mapas con otra paleta (mismo tamaño/hitbox).
  const M_IDLE_ROWS = [
    '...RRRRR....', '..RRRRRRRRR.', '..HHHSSWS...', '.HSHHSSWSS..', '.HSHHSSSSS..',
    '.HHSSSSSS...', '...SSSSSS...', '..BBRRRRBB..', '.BBBRRRRBBB.', 'BBBBRRRRBBBB',
    'SS.BRRRRB.SS', '...RRRRRR...', '..RRR..RRR..', '..HHH..HHH..', '.HHHH..HHHH.',
  ];
  const M_RUN_ROWS = [
    '...RRRRR....', '..RRRRRRRRR.', '..HHHSSWS...', '.HSHHSSWSS..', '.HSHHSSSSS..',
    '.HHSSSSSS...', '...SSSSSS...', '..BBRRRRBB..', '.BBBRRRRBBS.', 'BBBBRRRRBBSS',
    'SSBBRRRRBB..', '...RRRRRR...', '..RRR.RRR...', '.HHH...HHH..', 'HHHH....HHH.',
  ];
  const M_JUMP_ROWS = [
    '...RRRRR....', '..RRRRRRRRR.', '..HHHSSWS...', '.HSHHSSWSS..', '.HSHHSSSSS..',
    '.HHSSSSSS...', '...SSSSSS...', 'S.BBRRRRBB.S', 'SSBBRRRRBBSS', '.BBBRRRRBBB.',
    '..BRRRRRRB..', '..RRRRRRRR..', '..HHH..HHH..', '.HHH....HHH.',
  ];
  const M_CLIMB_ROWS = [
    '...RRRRR....', '..RRRRRRRR..', '..HHHHHHH...', '.S.HHHHH....', '.S.BBBBBB...',
    '...BBRRBB.S.', '..BBBRRBBBS.', '..BBRRRRBB..', '..BRRRRRRB..', '...RRRRRR...',
    '...RRRRRR...', '...RRR.RR...', '..HHH..HH...', '..HHH..HHH..',
  ];
  const M_DEAD_ROWS = [
    '...RRRRR....', '..RRRRRRRR..', '..HHXSSXS...', '.HSHHSSSSS..', '.HHSSSSSS...',
    '...SSSSSS...', 'S.BBRRRRBB.S', 'SSBBRRRRBBSS', '.BBBRRRRBBB.', '..BRRRRRRB..',
    '..RRRRRRRR..', '..RRR..RRR..', '.HHHH..HHHH.',
  ];
  let M_IDLE, M_RUN, M_JUMP, M_CLIMB, M_DEAD;
  function bakeMario(pal) {
    M_IDLE = makeSprite(M_IDLE_ROWS, pal); M_RUN = makeSprite(M_RUN_ROWS, pal);
    M_JUMP = makeSprite(M_JUMP_ROWS, pal); M_CLIMB = makeSprite(M_CLIMB_ROWS, pal);
    M_DEAD = makeSprite(M_DEAD_ROWS, pal);
  }
  // #7 SKINS: recolores de MPAL desbloqueados por puntos de POR VIDA (dk_total). 100% cosmético —
  // no toca hitbox (MH / razón 12/15) ni físicas → imposible alterar el balance.
  const SKINS = [
    { id:'classic', name:'CLASICO', unlock:0,      pal: MPAL },
    { id:'verde',   name:'VERDE',   unlock:8000,   pal: { ...MPAL, R:'#2fb24a' } },
    { id:'cielo',   name:'CIELO',   unlock:25000,  pal: { ...MPAL, R:'#2a9df4', B:'#16407a' } },
    { id:'fuego',   name:'FUEGO',   unlock:60000,  pal: { ...MPAL, R:'#ff8c1a', B:'#b3232c' } },
    { id:'oro',     name:'ORO',     unlock:120000, pal: { ...MPAL, R:'#f6c945', H:'#8a5a2b', B:'#7a5a12' } },
  ];
  bakeMario(MPAL);                                   // default seguro; el init re-hornea con la skin guardada

      for (const it of items) {
        if (it.taken || it.g !== this.g) continue;
        if (Math.abs(this.fx - it.x) < 0.03) {
          it.taken = true; gh.itemsTaken[items.indexOf(it)] = true; addScore(it.kind.val, it.x, surfY(it.g, it.x) - 0.04, it.kind.c); sfx.score();
          if (items.every(q => q.taken)) addScore(2000, this.fx, surfY(this.g, this.fx) - 0.06, '#ffffff');
        }
      }

      // tocar a DK = muerte; llegar a Pauline = victoria
      if (this.g === 5 && Math.abs(this.fx - DK_X) < 0.085 && this.state !== 'climb') { die(); return; }
      if (this.g === PAULINE_G) { winLevel(); return; }
    },

    ladderFrom(dirn) {
      for (const l of LADDERS) {
        if (l.broken) continue;
        if (dirn === 'up'   && l.lo !== this.g) continue;
        if (dirn === 'down' && l.hi !== this.g) continue;
        if (Math.abs(this.fx - l.x) < 0.022) return l;
      }
      return null;
    },
    startClimb(l) {
      this.state = 'climb'; this.onLadder = l; this.fx = l.x;
      this.vx = 0; this.animT = 0;
    },

    // hitbox del martillo (px) — alterna arriba / al frente
    hammerBox() {
      if (this.hammerT <= 0) return null;
      const up = (Math.floor(this.hamSwing / 0.16) % 2) === 0;
      const mh = MH * PF.h;
      const mx = ppx(this.fx), my = ppy(this.fy) - mh / 2;
      return up
        ? { x: mx, y: my - mh * 1.05, r: mh * 0.52 }
        : { x: mx + this.dir * mh * 0.72, y: my - mh * 0.18, r: mh * 0.52 };
    },

    draw() {
      const mh = MH * PF.h;
      const px = ppx(this.fx), py = ppy(this.fy) - mh / 2;
      if (gh.phase !== 'dying' && this.state !== 'climb') shadowAt(px, ppy(surfY(this.g, this.fx)), mh * 0.36);
      if (gh.phase === 'dying') {
        // animación de muerte: congelado → giro → tendido
        if (this.deadT < 0.4) drawSpr(M_IDLE, px, py, mh, this.dir < 0);
        else if (this.deadT < 1.3) drawSpr(M_DEAD, px, py, mh, false, (this.deadT - 0.4) * 14);
        else drawSpr(M_DEAD, px, py + mh * 0.18, mh, false, Math.PI / 2);
        return;
      }
      let spr = M_IDLE, flip = this.dir < 0;
      if (this.state === 'climb') {
        spr = M_CLIMB; flip = (Math.floor(this.animT / 0.22) % 2) === 0;   // alterna manos espejando
      } else if (this.state === 'air') {
        spr = M_JUMP;
      } else if (this.animT > 0) {
        spr = (Math.floor(this.animT / 0.12) % 2) === 0 ? M_RUN : M_IDLE;
      }
      // parpadeo cuando el martillo está por terminar
      const flash = this.hammerT > 0 && this.hammerT < 2 && (Math.floor(this.hammerT / 0.12) % 2) === 0;
      drawSpr(spr, px, py, mh, flip, 0, flash ? 0.45 : 1);
      // martillo en mano
      if (this.hammerT > 0) {
        const up = (Math.floor(this.hamSwing / 0.16) % 2) === 0;
        const hh = HAMH * PF.h;
        if (up) drawSpr(HAMMER_SPR, px, py - mh * 1.0, hh, false, 0);
        else    drawSpr(HAMMER_SPR, px + this.dir * mh * 0.72, py - mh * 0.10, hh, false, this.dir * Math.PI / 2);
      }
    },
  };

  // colisión genérica Mario vs entidad (centros y semi-tamaños en px, con achique para perdonar)
  function hitsMario(efx, efy, eh, ewRatio) {
    const mh = MH * PF.h, mw = mh * (12 / 15);
    const eph = eh * PF.h, epw = eph * ewRatio;
    const dx = (efx - mario.fx) * PF.w;
    const dy = (ppy(efy) - eph / 2) - (ppy(mario.fy) - mh / 2);
    return Math.abs(dx) < (mw + epw) * 0.5 * 0.58 && Math.abs(dy) < (mh + eph) * 0.5 * 0.58;
  }

  // ════════════════ BARRILES ════════════════
  class Barrel {
    constructor(wild = false) {
      this.g = 5; this.fx = DK_X + 0.10; this.fy = surfY(5, this.fx);
      this.wild = wild;                                                      // #2 barril salvaje
      this.dir = rollDir(5);
      // velocidad: nivel × hazard, ×1.5 si salvaje, ×1.25 en furia — pero clampeada a 1.9× la base para que
      // el pico nunca sea inesquivable (gotcha de balance del review).
      this.spd = Math.min(BARREL_SPD * 1.9, BARREL_SPD * lvlSpeed() * (wild ? 1.5 : 1) * (gh.frenzy ? FRENZY_SPD : 1));
      this.state = 'roll';    // 'roll' | 'ladder' | 'air'
      this.vy = 0; this.vx = 0; this.rotT = 0; this.scored = false; this.dead = false;
      this.l = null;
    }
    process(dt) {
      if (this.state === 'roll') {
        const prevX = this.fx;
        this.fx += this.dir * this.spd * dt;
        this.rotT += dt;
        this.fy = surfY(this.g, this.fx);
        // ¿bajar por una escalera? (sólo al cruzarla; más probable si Mario está abajo). El SALVAJE nunca
        // baja escaleras: siempre rueda hasta el borde y cae viga por viga.
        curBarrelG = this.g;
        if (!this.wild) {
          for (const l of LADDERS) {
            if (l.hi !== this.g) continue;
            if ((prevX - l.x) * (this.fx - l.x) <= 0 && prevX !== this.fx) {
              if (Math.random() < descProb()) { this.state = 'ladder'; this.l = l; this.fx = l.x; }
              break;
            }
          }
        }
        if (this.state === 'roll') {
          const g = GIRDERS[this.g];
          if ((this.dir > 0 && this.fx > g.x1 + 0.004) || (this.dir < 0 && this.fx < g.x0 - 0.004)) {
            this.state = 'air'; this.vy = 0; this.vx = this.dir * 0.04;    // cae por el borde
          }
          // llegó al tambor de aceite → desaparece (y quizás sale una bola de fuego)
          if (this.g === 0 && this.fx < OIL_X + 0.025) {
            this.dead = true; oilLit = true;
            const maxFb = Math.min(3, (gh.level >= 3 ? 2 : 1) + (gh.hazard ? gh.hazard.fb : 0));   // #8 INFERNAL +1
            if (fireballs.length < maxFb && Math.random() < Math.min(0.6, 0.30 + 0.05 * gh.level)) {
              fireballs.push(new Fireball());
            }
          }
        }
      }
      else if (this.state === 'ladder') {
        this.fy += BARREL_DESC * dt;
        const foot = surfY(this.l.lo, this.l.x);
        if (this.fy >= foot) { this.fy = foot; this.g = this.l.lo; this.dir = rollDir(this.g); this.state = 'roll'; }
      }
      else { // air
        const prevY = this.fy;
        this.fy += this.vy * dt; this.vy += GRAV * dt;
        this.fx += this.vx * dt;
        for (let gi = this.g - 1; gi >= 0; gi--) {
          const g = GIRDERS[gi];
          if (this.fx < g.x0 || this.fx > g.x1) continue;
          const s = surfY(gi, this.fx);
          if (prevY <= s + 0.002 && this.fy >= s) {
            this.g = gi; this.fy = s; this.dir = rollDir(gi); this.state = 'roll';
            break;
          }
        }
        if (this.fy > 1.1) this.dead = true;
      }

      // puntos por saltarlo: Mario en el aire, bien arriba del barril. #1 combo: encadenar saltos de
      // barriles DISTINTOS dentro de la ventana sube el multiplicador (tope x5 / +500 pre-hazard).
      if (!this.scored && mario.state === 'air' &&
          Math.abs(mario.fx - this.fx) < 0.045 &&
          (this.fy - mario.fy) > 0.012 && (this.fy - mario.fy) < 0.11) {
        this.scored = true;
        gh.comboT = 0.85; gh.comboN = Math.min(5, gh.comboN + 1);
        const base = this.wild ? 150 : 100;                                 // #2 el salvaje vale más
        gpScore(Math.min(500, base * gh.comboN), this.fx, this.fy - 0.05, gh.comboN >= 3 ? '#ff8c1a' : '#ffd23f');
        if (gh.comboN >= 2) popups.push({ text: 'COMBO x' + gh.comboN, fx: this.fx, fy: this.fy - 0.10, t: 0, color: '#7fd4ff' });
        sfx.score();
      }
      // martillazo
      const hb = mario.hammerBox();
      if (hb) {
        const bx = ppx(this.fx), by = ppy(this.fy) - BH * PF.h / 2;
        if (Math.hypot(bx - hb.x, by - hb.y) < hb.r + BH * PF.h * 0.5) {
          this.dead = true; gpScore(300, this.fx, this.fy - 0.05); sfx.hammer();
          return;
        }
      }
      // atropellar a Mario
      if (hitsMario(this.fx, this.fy, BH, 12 / 9)) die();
    }
    draw() {
      const bh = BH * PF.h;
      const px = ppx(this.fx), py = ppy(this.fy) - bh / 2;
      if (this.state !== 'air') shadowAt(px, ppy(this.fy), bh * 0.45);
      if (this.state === 'air') drawSpr(this.wild ? BARREL_END_WILD : BARREL_END, px, py, bh * 1.15);
      else {
        const fr = Math.floor(this.rotT / 0.07) % 4;
        drawSpr((this.wild ? BARREL_FR_WILD : BARREL_FR)[this.dir > 0 ? fr : 3 - fr], px, py, bh);
      }
    }
  }

  // ════════════════ BOLA DE FUEGO ════════════════
  class Fireball {
    constructor() {
      this.g = 0; this.fx = OIL_X; this.fy = surfY(0, this.fx);
      this.dir = 1; this.state = 'walk';   // 'walk' | 'climb'
      this.decideT = 0; this.animT = 0; this.dead = false;
      this.l = null; this.climbDir = 0;
    }
    process(dt) {
      this.animT += dt;
      if (this.state === 'walk') {
        this.decideT -= dt;
        if (this.decideT <= 0) {
          this.decideT = rnd(1.2, 2.8);
          // sesgo hacia Mario (70%)
          this.dir = (Math.random() < 0.7 ? Math.sign(mario.fx - this.fx) || 1 : (Math.random() < 0.5 ? -1 : 1));
        }
        const prevX = this.fx;
        this.fx += this.dir * FIRE_SPD * dt;
        const g = GIRDERS[this.g];
        if (this.fx < g.x0 + 0.01 || this.fx > g.x1 - 0.01) { this.fx = clamp(this.fx, g.x0 + 0.01, g.x1 - 0.01); this.dir *= -1; }
        this.fy = surfY(this.g, this.fx);
        // trepar escaleras (también las rotas) buscando la viga de Mario
        for (const l of LADDERS) {
          const fromHere = (l.lo === this.g && mario.g > this.g) ? 'up' : (l.hi === this.g && mario.g < this.g) ? 'down' : null;
          if (!fromHere) continue;
          const lx = l.x;
          if ((prevX - lx) * (this.fx - lx) <= 0 && prevX !== this.fx && Math.random() < 0.45) {
            this.state = 'climb'; this.l = l; this.fx = lx;
            this.climbDir = fromHere === 'up' ? -1 : 1;
            break;
          }
        }
      } else { // climb
        this.fy += this.climbDir * FIRE_SPD * 1.4 * dt;
        const top = surfY(this.l.hi, this.l.x), foot = surfY(this.l.lo, this.l.x);
        if (this.climbDir < 0 && this.fy <= top)  { this.fy = top;  this.g = this.l.hi; this.state = 'walk'; }
        if (this.climbDir > 0 && this.fy >= foot) { this.fy = foot; this.g = this.l.lo; this.state = 'walk'; }
      }
      // martillazo
      const hb = mario.hammerBox();
      if (hb) {
        const fx = ppx(this.fx), fy = ppy(this.fy) - FBH * PF.h / 2;
        if (Math.hypot(fx - hb.x, fy - hb.y) < hb.r + FBH * PF.h * 0.5) {
          this.dead = true; gpScore(500, this.fx, this.fy - 0.05, '#ff8c1a'); sfx.hammer();
          return;
        }
      }
      if (hitsMario(this.fx, this.fy, FBH, 10 / 11)) die();
    }
    draw() {
      const fh = FBH * PF.h;
      const fr = (Math.floor(this.animT / 0.12) % 2) === 0 ? FIRE_1 : FIRE_2;
      drawSpr(fr, ppx(this.fx), ppy(this.fy) - fh / 2, fh, this.dir < 0);
    }
  }

  // ════════════════ #9 TORTA (rueda por la cinta-fábrica) ════════════════
  class Pie {
    constructor() {
      this.g = belt.g;
      const open = rollDir(this.g);                  // hacia el borde abierto (bajo)
      this.dir = open;
      const gg = GIRDERS[this.g];
      this.fx = open > 0 ? gg.x0 + 0.04 : gg.x1 - 0.04;   // arranca del extremo seguro
      this.fy = surfY(this.g, this.fx);
      this.spd = BARREL_SPD * 0.8 * lvlSpeed();
      this.rotT = 0; this.scored = false; this.dead = false;
    }
    process(dt) {
      this.fx += this.dir * this.spd * dt;
      this.rotT += dt;
      const gg = GIRDERS[this.g];
      this.fy = surfY(this.g, this.fx);
      if (this.fx < gg.x0 - 0.01 || this.fx > gg.x1 + 0.01) { this.dead = true; return; }   // se cae del borde → fin
      // saltarla = +100 (alimenta el combo) · martillazo = +300 (mismo score que un barril, sin tier nuevo)
      if (!this.scored && mario.state === 'air' && Math.abs(mario.fx - this.fx) < 0.045 &&
          (this.fy - mario.fy) > 0.012 && (this.fy - mario.fy) < 0.11) {
        this.scored = true;
        gh.comboT = 0.85; gh.comboN = Math.min(5, gh.comboN + 1);
        gpScore(Math.min(500, 100 * gh.comboN), this.fx, this.fy - 0.05, gh.comboN >= 3 ? '#ff8c1a' : '#ffd23f');
        if (gh.comboN >= 2) popups.push({ text: 'COMBO x' + gh.comboN, fx: this.fx, fy: this.fy - 0.10, t: 0, color: '#7fd4ff' });
        sfx.score();
      }
      const hb = mario.hammerBox();
      if (hb) {
        const bx = ppx(this.fx), by = ppy(this.fy) - BH * PF.h / 2;
        if (Math.hypot(bx - hb.x, by - hb.y) < hb.r + BH * PF.h * 0.5) {
          this.dead = true; gpScore(300, this.fx, this.fy - 0.05); sfx.hammer(); return;
        }
      }
      if (hitsMario(this.fx, this.fy, BH, 12 / 9)) die();
    }
    draw() {
      const bh = BH * PF.h;
      shadowAt(ppx(this.fx), ppy(this.fy), bh * 0.45);
      drawSpr(PIE_SPR, ppx(this.fx), ppy(this.fy) - bh / 2, bh * 1.1, this.dir < 0);
    }
  }
  // viga-cinta del nivel (sembrada por run, no parity predecible). Deriva hacia el extremo CLAMP-seguro
  // (-rollDir): en vigas 2/3 el extremo opuesto al de caída está protegido por el clamp → un Mario quieto
  // choca la pared, nunca se cae.
  function beltFor(level) {
    if (level < 2) return { g: -1, dir: 0 };
    const rng = mulberry32((gh.seed ^ Math.imul(level, 0x27D4EB2F)) >>> 0);
    const g = [2, 3][Math.floor(rng() * 2)];
    return { g, dir: -rollDir(g) };
  }
  function updatePies(dt) {
    if (belt.g < 0) return;
    pieT -= dt;
    if (pieT <= 0 && pies.length < MAX_PIES) { pies.push(new Pie()); pieT = rnd(2.6, 4.2); }
    for (const p of pies) { p.process(dt); if (gh.phase !== 'play') break; }
    pies = pies.filter(p => !p.dead);
  }
  function drawBelt() {
    if (belt.g < 0) return;
    const gg = GIRDERS[belt.g], span = gg.x1 - gg.x0, n = 8, move = perfT * 0.10 * belt.dir;
    ctx.save();
    ctx.strokeStyle = 'rgba(130,205,255,0.55)'; ctx.lineWidth = Math.max(1.5, PF.h * 0.0035);
    const d = belt.dir >= 0 ? 1 : -1, w = PF.w * 0.012, hh = PF.h * 0.006;
    for (let i = 0; i < n; i++) {
      let f = (i / n + move) % 1; if (f < 0) f += 1;
      const x = gg.x0 + 0.03 + f * (span - 0.06);
      const px = ppx(x), py = ppy(surfY(belt.g, x)) + PF.h * 0.007;
      ctx.beginPath();
      ctx.moveTo(px - d * w / 2, py - hh); ctx.lineTo(px + d * w / 2, py); ctx.lineTo(px - d * w / 2, py + hh);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ════════════════ DONKEY KONG (el que tira barriles) ════════════════
  const dk = {
    t: 0, phase: 'beat', nextThrow: 1.2, thrown: false,
    reset() { this.t = 0; this.phase = 'beat'; this.nextThrow = 1.2; this.thrown = false; },
    process(dt) {
      this.t += dt;
      if (this.phase === 'beat') {
        if (this.t >= this.nextThrow) { this.phase = 'grab'; this.t = 0; this.thrown = false; }
      } else if (this.phase === 'grab') {
        if (this.t >= 0.45) { this.phase = 'throw'; this.t = 0; }
      } else { // throw
        if (!this.thrown && this.t >= 0.18 && barrels.length < MAX_BARRELS) {
          const wild = gh.level >= 3 && Math.random() < Math.min(0.32, 0.08 * (gh.level - 2));   // #2 barril salvaje (spike tardío)
          barrels.push(new Barrel(wild)); this.thrown = true;
          (wild ? sfx.throwWild : sfx.throw_)();
        }
        if (this.t >= 0.4) { this.phase = 'beat'; this.t = 0; this.nextThrow = spawnGap(); }
      }
    },
    draw() {
      const h = DKH * PF.h;
      const px = ppx(DK_X), py = ppy(surfY(5, DK_X)) - h / 2;
      shadowAt(px, ppy(surfY(5, DK_X)), h * 0.30);
      if (this.phase === 'beat') {
        const fr = Math.floor(this.t / 0.32) % 2;
        drawSpr(fr === 0 ? DK_UP : DK_CHEST, px, py, h);
      } else if (this.phase === 'grab') {
        drawSpr(DK_CHEST, px, py, h);
        drawSpr(BARREL_FR[0], px + h * 0.42, py + h * 0.18, BH * PF.h);     // barril en las manos
      } else {
        drawSpr(DK_UP, px, py, h);
        drawSpr(BARREL_FR[1], px + h * 0.55, py - h * 0.05, BH * PF.h);
      }
    },
  };

  // ════════════════ PAULINE ════════════════
  const pauline = {
    t: 0,
    process(dt) { this.t += dt; },
    draw() {
      const h = PAUH * PF.h;
      const px = ppx(PAULINE_X), py = ppy(surfY(PAULINE_G, PAULINE_X)) - h / 2;
      const fr = (Math.floor(this.t / 0.55) % 2) === 0 ? PAU_1 : PAU_2;
      drawSpr(fr, px, py, h, mario.fx > PAULINE_X);
      // grito de auxilio intermitente
      if ((this.t % 4) < 1.4 && gh.phase === 'play') {
        ptext('¡AYUDA!', PAULINE_X, surfY(PAULINE_G, PAULINE_X) - PAUH - 0.022, 0.013, '#ffffff');
      }
    },
  };

  // ════════════════ FLUJO DE PARTIDA ════════════════
  function startGame(mode) {
    gh.mode = mode || 'classic';
    gh.daily = gh.mode === 'daily';
    gh.seed = (gh.daily ? dateSeed() : (Math.floor(Math.random() * 1e9) >>> 0)) || 1;
    gh.level = 1; gh.score = 0; gh.lives = 3; gh.newHi = false;
    gh.hi = parseInt(localStorage.getItem(gh.daily ? dailyKey() : 'dk_hiscore') || '0', 10) || 0;
    gh.screen = 'game';
    startLevel();
  }
  function startLevel() {
    barrels = []; fireballs = []; popups = []; pies = [];
    applyLevelLayout();                                      // #3 reroll escaleras/jitter/martillos sembrados + bakeLevel
    hammers = hammerSpots.map(s => ({ g: s.g, x: s.x, taken: false }));
    setupRivetsItems();                                     // #4 remaches / #6 coleccionables (según nivel)
    belt = beltFor(gh.level); pieT = 1.5;                   // #9 viga-cinta + delay inicial de torta
    oilLit = false; oilT = 0;
    dk.reset(); mario.reset();
    gh.bonus = Math.min(8000, 5000 + 500 * (gh.level - 1)); gh.bonusT = 0;
    gh.comboN = 0; gh.comboT = 0;                           // #1
    gh.frenzy = false; gh.frenzyWarn = false; gh.frenzyDone = false; gh.frenzyT = 0;   // #5
    gh.frenzyAt = Math.max(7, 15 - gh.level);
    gh.rivetWarp = rivets.length > 0 && rivets.every(r => r.popped);   // #4 (restaura el warp si ya barriste todo y reapareciste)
    gh.hazard = CALMA; gh.hazardChoices = pickHazardChoices();   // #8 (CALMA por defecto hasta elegir)
    gh.phase = 'intro'; gh.phaseT = 0;
    jumpBuf = 0;
  }
  function respawn() { startLevel(); }                       // como el arcade: el nivel se reinicia limpio
  function die() {
    if (gh.phase !== 'play') return;
    gh.phase = 'dying'; gh.phaseT = 0; mario.deadT = 0;
    gh.comboN = 0; gh.comboT = 0;                           // #1: el combo no sobrevive la muerte
    gh.frenzy = false; gh.frenzyWarn = false;              // #5: la furia no se dibuja sobre la animación de muerte
    sfx.death();
  }
  function winLevel() {
    if (gh.phase !== 'play') return;
    gh.phase = 'win'; gh.phaseT = 0;
    addScore(gh.bonus, PAULINE_X, surfY(PAULINE_G, PAULINE_X) - 0.10, '#7fd4ff');
    if (gh.rivetWarp) addScore(800, PAULINE_X, surfY(PAULINE_G, PAULINE_X) - 0.16, '#7fd4ff');   // #4 barrido completo
    sfx.win();
  }
  function backToMenu() {
    restoreOriginalLayout(); bakeLevel();                   // que el menú muestre el tablero canónico de fondo
    gh.screen = 'menu';
  }

  // ════════════════ #3 VARIEDAD DE TABLERO (sembrada) ════════════════
  function restoreOriginalLayout() {
    for (let i = 0; i < LADDERS.length; i++) LADDERS[i].broken = LADDERS_ORIG_BROKEN[i];
    for (let i = 0; i < GIRDERS.length; i++) { GIRDERS[i].yL = GIRDERS_ORIG[i].yL; GIRDERS[i].yR = GIRDERS_ORIG[i].yR; }
    hammerSpots = HAMMER_SPOTS.map(s => ({ g: s.g, x: s.x }));
  }
  // ¿existe una cadena de escaleras SANAS 0→6, cada una con x dentro de AMBAS vigas? (invariante de ganabilidad).
  function layoutWinnable() {
    const reach = new Set([0]);
    let changed = true;
    while (changed) {
      changed = false;
      for (const l of LADDERS) {
        if (l.broken || !reach.has(l.lo) || reach.has(l.hi)) continue;
        if (l.x >= GIRDERS[l.lo].x0 && l.x <= GIRDERS[l.lo].x1 &&
            l.x >= GIRDERS[l.hi].x0 && l.x <= GIRDERS[l.hi].x1) { reach.add(l.hi); changed = true; }
      }
    }
    return reach.has(6);
  }
  function applyLevelLayout() {
    restoreOriginalLayout();
    // Nivel 1 en classic = tablero hand-authored (intro estable). Daily + niveles 2+ = sembrado por nivel.
    if (gh.level === 1 && !gh.daily) { bakeLevel(); return; }
    const rng = mulberry32((gh.seed ^ Math.imul(gh.level, 0x9E3779B1)) >>> 0);
    const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
    // 1) Reroll de rotas: MISMA cuenta por tramo que el original → sólo cambia CUÁL está rota, no la dificultad.
    TIERS.forEach((idxs, lo) => {
      const order = shuffle(idxs.slice()), nB = BROKEN_PER_TIER[lo] || 0;
      order.forEach((idx, k) => { LADDERS[idx].broken = k < nB; });
    });
    // 2) Jitter sutil de pendiente en vigas 1..4 (no toca x-extents ni topología; nunca invierte la pendiente
    //    ni convierte una caída de 1 viga en una de 2 → FALL_DEATH intacto).
    for (let gi = 1; gi <= 4; gi++) {
      const o = GIRDERS_ORIG[gi], d = (rng() * 2 - 1) * 0.012;
      GIRDERS[gi].yL = o.yL + d; GIRDERS[gi].yR = o.yR - d * 0.6;
    }
    // 3) Re-sembrar 2 martillos en vigas 1..4 (excluye 0=aceite/fuego y 5=DK), con margen al borde para el salto.
    const hgs = shuffle([1, 2, 3, 4]).slice(0, 2);
    hammerSpots = hgs.map(g => ({ g, x: GIRDERS[g].x0 + 0.10 + rng() * (GIRDERS[g].x1 - GIRDERS[g].x0 - 0.20) }));
    // 4) Red de seguridad: si un seed diera algo no ganable (no debería, la cuenta por tramo lo garantiza),
    //    volver al tablero canónico.
    if (!layoutWinnable()) restoreOriginalLayout();
    bakeLevel();
  }

  // ════════════════ #4 REMACHES / #6 COLECCIONABLES ════════════════
  // Para no saturar el tablero, ALTERNAN por nivel: niveles de remache (cada 4) muestran 8 remaches a
  // barrer; el resto, 3 coleccionables de Pauline sembrados. Ambos son score puro y opcional.
  const ITEM_SPOTS = [
    { g:1, x:0.30 }, { g:1, x:0.66 }, { g:2, x:0.24 }, { g:2, x:0.80 },
    { g:3, x:0.34 }, { g:3, x:0.70 }, { g:4, x:0.28 }, { g:4, x:0.78 },
  ];
  const ITEM_KINDS = [
    { spr: HAT_SPR,   val: 300, c:'#ff7ad9' },
    { spr: PURSE_SPR, val: 500, c:'#ffd23f' },
    { spr: UMB_SPR,   val: 800, c:'#7fd4ff' },
  ];
  function setupRivetsItems() {
    rivets = []; items = [];
    // El estado tomado/popped persiste DENTRO de una vida: un respawn en el MISMO nivel no re-otorga score.
    // Se limpia sólo cuando el nivel realmente avanza (gh.level cambia).
    if (gh.pickupLevel !== gh.level) { gh.pickupLevel = gh.level; gh.rivetsPopped = []; gh.itemsTaken = []; }
    if (isRivetLevel()) {
      let ri = 0;
      for (const g of [1, 2, 3, 4]) {
        const a = GIRDERS[g].x0, b = GIRDERS[g].x1;
        rivets.push({ g, x: a + (b - a) * 0.28, popped: !!gh.rivetsPopped[ri++] });
        rivets.push({ g, x: a + (b - a) * 0.72, popped: !!gh.rivetsPopped[ri++] });
      }
    } else {
      const rng = mulberry32((gh.seed ^ Math.imul(gh.level, 0x85EBCA77) ^ 0x51) >>> 0);
      const pool = ITEM_SPOTS.slice();
      for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
      items = ITEM_KINDS.map((k, i) => ({ g: pool[i].g, x: pool[i].x, kind: k, taken: !!gh.itemsTaken[i] }));
    }
  }

  // ════════════════ #5 FURIA (pacing intra-nivel) ════════════════
  // Una vez por nivel: avisa 1.5 s antes (cartel + sonido), después 6 s de cadencia/velocidad spikeada
  // (clampeadas en spawnGap()/Barrel). La velocidad NO sube durante el aviso → telegrafía honesta.
  function updateFrenzy(dt) {
    if (gh.frenzyDone) return;
    gh.frenzyT += dt;
    const t = gh.frenzyT, wasWarn = gh.frenzyWarn;
    gh.frenzyWarn = (!gh.frenzy && t >= gh.frenzyAt - 1.5 && t < gh.frenzyAt);
    if (gh.frenzyWarn && !wasWarn) sfx.warn();
    if (!gh.frenzy && t >= gh.frenzyAt) gh.frenzy = true;
    if (gh.frenzy && t >= gh.frenzyAt + 6) { gh.frenzy = false; gh.frenzyDone = true; }
  }
  function drawFrenzy() {
    if (gh.frenzyWarn && Math.floor(gh.frenzyT * 6) % 2 === 0) ptext('¡FURIA!', 0.5, 0.42, 0.024, '#ff3b30');
    if (gh.frenzy) {
      const a = 0.35 + 0.3 * Math.sin(perfT * 10), lw = Math.max(2, PF.w * 0.012);
      ctx.save();
      ctx.strokeStyle = 'rgba(255,59,48,' + a.toFixed(3) + ')'; ctx.lineWidth = lw;
      ctx.strokeRect(PF.x + lw / 2, PF.y + lw / 2, PF.w - lw, PF.h - lw);
      ctx.restore();
    }
  }

  // ════════════════ #8 DRAFT DE HAZARD ════════════════
  const HAZ_PILL_Y = [0.56, 0.66];     // y (fracción) de los dos pills del draft (y zona de tap)
  function pickHazardChoices() {        // izq = CALMA (seguro x1), der = un hazard picante (más riesgo, más score)
    const spicy = HAZARDS.slice(1);
    const rng = mulberry32((gh.seed ^ Math.imul(gh.level, 0xC2B2AE35) ^ 0x9) >>> 0);
    return [CALMA, spicy[Math.floor(rng() * spicy.length)]];
  }
  function chooseHazard(i) {
    if (gh.phase !== 'intro') return;
    gh.hazard = (gh.hazardChoices && gh.hazardChoices[i]) || CALMA;
    gh.phase = 'play'; gh.phaseT = 0;
    jumpBuf = 0;                        // que el tap/tecla de elegir NO bufferee un salto al arrancar
    keys.ArrowUp = keys.ArrowDown = keys.ArrowLeft = keys.ArrowRight = false;   // ni mueva a Mario con la flecha de elegir
  }
  function drawHazardPill(hz, fy) {
    const fp = Math.round(0.016 * PF.h);
    ctx.font = fp + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const label = hz.mult > 1 ? (hz.name + '  x' + hz.mult) : (hz.name + '  x1');
    const tw = ctx.measureText(label).width, padX = fp * 0.9;
    const bw = Math.max(tw + padX * 2, PF.w * 0.62), bhh = fp + fp * 1.2;
    const bx = ppx(0.5) - bw / 2, by = ppy(fy) - bhh / 2, r = bhh / 2;
    const col = hz === CALMA ? '#7fd4ff' : '#ff8c1a';
    ctx.beginPath();
    ctx.moveTo(bx + r, by); ctx.arcTo(bx + bw, by, bx + bw, by + bhh, r); ctx.arcTo(bx + bw, by + bhh, bx, by + bhh, r);
    ctx.arcTo(bx, by + bhh, bx, by, r); ctx.arcTo(bx, by, bx + bw, by, r); ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillText(label, ppx(0.5), ppy(fy));
  }

  // ════════════════ HORNEADO DEL NIVEL (vigas + escaleras + tambor) ════════════════
  let levelCv = null, lctx = null;
  function bakeLevel() {
    levelCv = levelCv || document.createElement('canvas');
    levelCv.width = canvas.width; levelCv.height = canvas.height;
    lctx = levelCv.getContext('2d');
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lctx.clearRect(0, 0, W, H);

    // escaleras primero (las vigas tapan la unión). Horneado → el glow (shadowBlur) es gratis.
    for (const l of LADDERS) {
      const x = ppx(l.x);
      const top = ppy(surfY(l.hi, l.x)), foot = ppy(surfY(l.lo, l.x));
      const w = PF.w * 0.034, rail = Math.max(1.5, PF.w * 0.007);
      const gapTop = top + (foot - top) * 0.36, gapBot = top + (foot - top) * 0.66;
      const rails = (yA, yB) => {
        lctx.beginPath();
        lctx.moveTo(x - w / 2, yA); lctx.lineTo(x - w / 2, yB);
        lctx.moveTo(x + w / 2, yA); lctx.lineTo(x + w / 2, yB);
        lctx.stroke();
      };
      lctx.save();
      lctx.shadowColor = 'rgba(63,212,255,0.7)'; lctx.shadowBlur = Math.max(3, PF.h * 0.006);
      lctx.strokeStyle = '#6fe0ff'; lctx.lineWidth = rail; lctx.lineCap = 'round';
      if (l.broken) { rails(top, gapTop); rails(gapBot, foot); } else rails(top, foot);
      lctx.restore();
      lctx.strokeStyle = 'rgba(63,212,255,0.85)'; lctx.lineWidth = Math.max(1, PF.w * 0.0045); lctx.lineCap = 'butt';
      const step = PF.h * 0.016;
      for (let y = top + step * 0.7; y < foot; y += step) {
        if (l.broken && y > gapTop && y < gapBot) continue;
        lctx.beginPath(); lctx.moveTo(x - w / 2, y); lctx.lineTo(x + w / 2, y); lctx.stroke();
      }
    }

    // vigas estilo DK modernizadas: relleno con gradiente vertical (volumen) + entramado tenue + rim
    // superior brillante con glow horneado + remaches.
    const th = PF.h * 0.020;
    for (const g of GIRDERS) {
      const x0 = ppx(g.x0), x1 = ppx(g.x1), y0 = ppy(g.yL), y1 = ppy(g.yR);
      const gradTop = Math.min(y0, y1);
      const grd = lctx.createLinearGradient(0, gradTop, 0, gradTop + th);
      grd.addColorStop(0, '#9c1f4e'); grd.addColorStop(0.5, '#6a1233'); grd.addColorStop(1, '#3c0a20');
      lctx.beginPath();
      lctx.moveTo(x0, y0); lctx.lineTo(x1, y1); lctx.lineTo(x1, y1 + th); lctx.lineTo(x0, y0 + th);
      lctx.closePath();
      lctx.fillStyle = grd; lctx.fill();
      lctx.save(); lctx.clip();
      lctx.strokeStyle = 'rgba(255,120,170,0.22)'; lctx.lineWidth = Math.max(1, PF.w * 0.004);
      const step = PF.w * 0.030;
      for (let x = x0 - th; x < x1 + th; x += step) {
        const t = clamp((x - x0) / (x1 - x0 || 1), 0, 1);
        const yy = y0 + (y1 - y0) * t;
        lctx.beginPath(); lctx.moveTo(x, yy + th); lctx.lineTo(x + th, yy); lctx.stroke();
      }
      lctx.restore();
      // rim superior brillante con glow (horneado → shadowBlur gratis)
      lctx.save();
      lctx.shadowColor = 'rgba(255,93,146,0.9)'; lctx.shadowBlur = Math.max(4, PF.h * 0.010);
      lctx.strokeStyle = '#ff7da8'; lctx.lineWidth = Math.max(1.5, PF.h * 0.0045);
      lctx.beginPath(); lctx.moveTo(x0, y0); lctx.lineTo(x1, y1); lctx.stroke();
      lctx.restore();
      lctx.strokeStyle = 'rgba(120,20,55,0.9)'; lctx.lineWidth = 1;
      lctx.beginPath(); lctx.moveTo(x0, y0 + th); lctx.lineTo(x1, y1 + th); lctx.stroke();
      // remaches a lo largo del rim
      lctx.fillStyle = 'rgba(255,185,210,0.5)';
      const rstep = PF.w * 0.06, rr = Math.max(1, PF.w * 0.004);
      for (let x = x0 + rstep * 0.5; x < x1; x += rstep) {
        const t = clamp((x - x0) / (x1 - x0 || 1), 0, 1);
        const yy = y0 + (y1 - y0) * t + th * 0.5;
        lctx.beginPath(); lctx.arc(x, yy, rr, 0, TAU); lctx.fill();
      }
    }

    // tambor de aceite (cuerpo; la llama va animada encima)
    const oh = OILH * PF.h;
    const ox = ppx(OIL_X), oy = ppy(surfY(0, OIL_X)) - oh / 2;
    lctx.imageSmoothingEnabled = false;
    lctx.drawImage(OIL_SPR.cv, ox - (oh * OIL_SPR.w / OIL_SPR.h) / 2, oy - oh / 2, oh * OIL_SPR.w / OIL_SPR.h, oh);
  }

  // ════════════════ RESIZE ════════════════
  const barEl = document.getElementById('bar');
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const barH = barEl.offsetHeight;
    W = Math.max(1, Math.floor(window.innerWidth));
    H = Math.max(1, Math.floor(window.innerHeight - barH));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // playfield portrait centrado (bandas tipo gabinete en desktop)
    const pw = Math.min(W, H * ASPECT);
    PF.w = pw; PF.h = pw / ASPECT;
    PF.x = (W - PF.w) / 2; PF.y = (H - PF.h) / 2;
    // gradientes de fondo (screen-space, una sola vez por resize): gabinete + atmósfera del playfield +
    // viñeta para profundidad (patrón TankWARS/CrazyTanks; nada de shadowBlur por frame).
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#16131d'); bgGrad.addColorStop(1, '#070709');
    pfGrad = ctx.createLinearGradient(0, PF.y, 0, PF.y + PF.h);
    pfGrad.addColorStop(0, '#161029'); pfGrad.addColorStop(0.55, '#0a0713'); pfGrad.addColorStop(1, '#050407');
    vigGrad = ctx.createRadialGradient(PF.x + PF.w / 2, PF.y + PF.h * 0.42, PF.h * 0.22, PF.x + PF.w / 2, PF.y + PF.h * 0.5, PF.h * 0.72);
    vigGrad.addColorStop(0, 'rgba(0,0,0,0)'); vigGrad.addColorStop(1, 'rgba(0,0,0,0.55)');
    bakeLevel();
    // Las posiciones viven en fracciones del playfield → el juego sigue donde estaba, sin reset.
  }
  window.addEventListener('resize', resize);

  // ════════════════ DIBUJO ════════════════
  function drawBezel() {
    ctx.fillStyle = bgGrad || '#0a0b10';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = pfGrad || '#000';
    ctx.fillRect(PF.x, PF.y, PF.w, PF.h);
    if (vigGrad) { ctx.fillStyle = vigGrad; ctx.fillRect(PF.x, PF.y, PF.w, PF.h); }
    // marco neón: glow ancho translúcido + línea fina encima (glow barato, sin shadowBlur por frame)
    ctx.strokeStyle = 'rgba(255,93,146,0.12)'; ctx.lineWidth = 6;
    ctx.strokeRect(PF.x + 3, PF.y + 3, PF.w - 6, PF.h - 6);
    ctx.strokeStyle = 'rgba(255,93,146,0.5)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(PF.x + 1, PF.y + 1, PF.w - 2, PF.h - 2);
  }

  function drawHUD() {
    // panel translúcido detrás de la fila de score (legibilidad + look moderno)
    ctx.save();
    roundRectPath(ctx, PF.x + PF.w * 0.02, PF.y + PF.h * 0.006, PF.w * 0.96, PF.h * 0.064, PF.h * 0.012);
    ctx.fillStyle = 'rgba(8,6,14,0.55)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,93,146,0.25)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
    ptext('PUNTOS', 0.035, 0.022, 0.014, '#ff3b30', 'left');
    ptext(pad(gh.score, 6), 0.035, 0.047, 0.015, '#ffffff', 'left');
    ptext(gh.daily ? 'DIARIO' : 'RECORD', 0.5, 0.022, 0.014, '#ff3b30');   // #3 daily: récord aparte
    ptext(pad(gh.hi, 6), 0.5, 0.047, 0.015, gh.newHi ? '#ffd23f' : '#ffffff');
    ptext('NIVEL ' + pad(gh.level, 2), 0.965, 0.022, 0.014, '#7fd4ff', 'right');
    ptext('BONUS ' + pad(gh.bonus, 4), 0.965, 0.047, 0.013, '#ffd23f', 'right');
    // vidas en reserva (izq)
    const ih = 0.020 * PF.h;
    for (let i = 0; i < gh.lives - 1; i++) drawSpr(M_IDLE, ppx(0.045 + i * 0.05), ppy(0.078), ih);
    // tercera línea: combo (centro) · remaches (centro-bajo) · hazard activo (der)
    if (gh.comboN >= 2) ptext('COMBO x' + gh.comboN, 0.5, 0.072, 0.013, '#7fd4ff');           // #1
    if (rivets.length) ptext('REMACHES ' + rivets.filter(r => r.popped).length + '/8', 0.5, 0.095, 0.012, '#7fd4ff');  // #4
    if (gh.hazard && gh.hazard !== CALMA) ptext(gh.hazard.name, 0.965, 0.072, 0.011, '#ffb3c1', 'right');  // #8
  }

  function drawOilFlame() {
    if (!oilLit) return;
    const fh = 0.034 * PF.h;
    const fr = (Math.floor(oilT / 0.12) % 2) === 0 ? FLAME_1 : FLAME_2;
    drawSpr(fr, ppx(OIL_X), ppy(surfY(0, OIL_X)) - OILH * PF.h - fh / 2 + PF.h * 0.004, fh);
  }

  function drawHammers() {
    for (const hm of hammers) {
      if (hm.taken) continue;
      const hh = HAMH * PF.h;
      drawSpr(HAMMER_SPR, ppx(hm.x), ppy(surfY(hm.g, hm.x) - HAMMER_HOVER), hh);
    }
  }

  function drawRivets() {           // #4
    const rh = 0.020 * PF.h;
    for (const rv of rivets) {
      drawSpr(RIVET_SPR, ppx(rv.x), ppy(surfY(rv.g, rv.x)) - rh * 0.4, rh, false, 0, rv.popped ? 0.18 : 1);
    }
  }
  function drawItems() {            // #6
    for (const it of items) {
      if (it.taken) continue;
      const ih = 0.026 * PF.h;
      drawSpr(it.kind.spr, ppx(it.x), ppy(surfY(it.g, it.x)) - ih * 0.65, ih);
    }
  }

  function drawPopups(dt) {
    for (const p of popups) {
      p.t += dt; p.fy -= 0.035 * dt;
      ptext(p.text, p.fx, p.fy, 0.014, p.color);
    }
    popups = popups.filter(p => p.t < 0.9);
  }

  function drawGame(dt) {
    drawBezel();
    ctx.drawImage(levelCv, 0, 0, W, H);
    drawOilFlame();
    drawBelt();              // #9 chevrons animados de la cinta
    drawRivets();            // #4
    drawItems();             // #6
    drawHammers();
    pauline.draw();
    dk.draw();
    for (const b of barrels) b.draw();
    for (const p of pies) p.draw();    // #9
    for (const f of fireballs) f.draw();
    mario.draw();
    drawFrenzy();            // #5 borde pulsante + cartel ¡FURIA!
    drawPopups(dt);
    drawHUD();

    if (gh.phase === 'intro') {
      if (gh.hazardChoices && gh.level >= 2) {                 // #8 draft
        ptext('NIVEL ' + gh.level, 0.5, 0.40, 0.024, '#7fd4ff');
        ptext('ELEGÍ TU DESAFÍO', 0.5, 0.47, 0.014, '#ffffff');
        drawHazardPill(gh.hazardChoices[0], HAZ_PILL_Y[0]);
        drawHazardPill(gh.hazardChoices[1], HAZ_PILL_Y[1]);
      } else {
        ptext('NIVEL ' + gh.level, 0.5, 0.50, 0.026, '#7fd4ff');
        ptext('¿LISTO?', 0.5, 0.55, 0.018, '#ffffff');
      }
    } else if (gh.phase === 'win') {
      const hh = 0.030 * PF.h * (1 + 0.12 * Math.sin(gh.phaseT * 6));
      drawSpr(HEART_SPR, ppx((mario.fx + PAULINE_X) / 2), ppy(surfY(PAULINE_G, PAULINE_X) - PAUH - 0.045), hh);
      ptext('¡NIVEL SUPERADO!', 0.5, 0.50, 0.020, '#ffd23f');
    } else if (gh.phase === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,0.62)';
      ctx.fillRect(PF.x, PF.y, PF.w, PF.h);
      ptext(gh.daily ? 'FIN — DIARIO' : 'FIN DEL JUEGO', 0.5, 0.42, 0.024, '#ff3b30');
      ptext(pad(gh.score, 6) + ' PUNTOS', 0.5, 0.50, 0.016, '#ffffff');
      if (gh.newHi) ptext('¡NUEVO RECORD!', 0.5, 0.555, 0.015, '#ffd23f');
      const next = SKINS.find(s => gh.total < s.unlock);                    // #7 feedback "una run más"
      if (next) ptext('SIG. SKIN ' + next.name + ': ' + pad(Math.max(0, next.unlock - gh.total), 6), 0.5, 0.59, 0.0105, '#9aa3b2');
      if (gh.phaseT % 1 < 0.6) ptext('TOCA PARA SEGUIR', 0.5, 0.64, 0.013, '#7fd4ff');
    }
  }

  // ════════════════ MENÚ ════════════════
  const SKIN_CAR_Y = 0.55, MENU_PLAY_Y = 0.65, MENU_DAILY_Y = 0.745;
  let menuBarrelT = 0;
  // píldora pulsante reutilizable (JUGAR / DESAFÍO DIARIO). baseCol = "r,g,b".
  function drawPill(label, fy, baseCol) {
    const pulse = 0.6 + 0.4 * Math.sin(perfT * 4);
    const fp = Math.round(0.022 * PF.h);
    ctx.font = fp + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(label).width, padX = fp * 0.9, padY = fp * 0.6;
    const bw = tw + padX * 2, bhh = fp + padY * 2, bx = ppx(0.5) - bw / 2, by = ppy(fy) - bhh / 2, r = bhh / 2;
    ctx.beginPath();
    ctx.moveTo(bx + r, by); ctx.arcTo(bx + bw, by, bx + bw, by + bhh, r); ctx.arcTo(bx + bw, by + bhh, bx, by + bhh, r);
    ctx.arcTo(bx, by + bhh, bx, by, r); ctx.arcTo(bx, by, bx + bw, by, r); ctx.closePath();
    ctx.fillStyle = 'rgba(' + baseCol + ',' + (0.18 + 0.10 * pulse) + ')';
    ctx.strokeStyle = 'rgb(' + baseCol + ')'; ctx.lineWidth = 2; ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,' + (0.8 + 0.2 * pulse) + ')'; ctx.fillText(label, ppx(0.5), ppy(fy));
  }
  function skinSwatchX(i, n) { return 0.5 + (i - (n - 1) / 2) * 0.135; }
  function drawSkinCarousel() {       // #7
    const n = SKINS.length, sz = PF.h * 0.030;
    ptext('SKINS  (TOTAL ' + pad(gh.total, 6) + ')', 0.5, SKIN_CAR_Y - 0.045, 0.0095, 'rgba(200,205,215,0.7)');
    for (let i = 0; i < n; i++) {
      const s = SKINS[i], unlocked = gh.total >= s.unlock, sel = gh.skin === s.id;
      const px = ppx(skinSwatchX(i, n)), py = ppy(SKIN_CAR_Y);
      ctx.save();
      ctx.globalAlpha = unlocked ? 1 : 0.28;
      ctx.fillStyle = s.pal.R; ctx.fillRect(px - sz / 2, py - sz / 2, sz, sz);
      ctx.strokeStyle = sel ? '#ffffff' : 'rgba(255,255,255,0.3)'; ctx.lineWidth = sel ? 3 : 1;
      ctx.strokeRect(px - sz / 2, py - sz / 2, sz, sz);
      ctx.restore();
      if (!unlocked) ptext(Math.ceil((s.unlock - gh.total) / 1000) + 'k', skinSwatchX(i, n), SKIN_CAR_Y + 0.035, 0.0085, '#9aa3b2');
    }
  }
  function drawMenu(dt) {
    drawBezel();
    ctx.save(); ctx.globalAlpha = 0.14;
    ctx.drawImage(levelCv, 0, 0, W, H);             // el nivel de fondo, bien tenue
    ctx.restore();

    const t = perfT, ts = 0.050, shake = Math.sin(t * 1.8) * 0.002;
    for (const [line, fy] of [['DONKEY', 0.16], ['KONG', 0.23]]) {
      ctx.font = Math.round(ts * PF.h) + 'px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#7a0d0d'; ctx.fillText(line, ppx(0.5 + 0.006), ppy(fy + 0.006 + shake));
      ctx.fillStyle = '#ff2e1f'; ctx.fillText(line, ppx(0.5), ppy(fy + shake));
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = Math.max(1, PF.h * 0.0016);
      ctx.strokeText(line, ppx(0.5), ppy(fy + shake));
    }

    menuBarrelT += dt;
    drawSpr((Math.floor(t / 0.4) % 2) === 0 ? DK_UP : DK_CHEST, ppx(0.5), ppy(0.36), 0.115 * PF.h);
    const bx = (menuBarrelT * 0.12) % 1.3 - 0.15;
    drawSpr(BARREL_FR[Math.floor(menuBarrelT / 0.07) % 4], ppx(bx), ppy(0.435), 0.028 * PF.h);

    ptext('RECORD ' + pad(parseInt(localStorage.getItem('dk_hiscore') || '0', 10) || 0, 6), 0.5, 0.485, 0.013, '#7fd4ff');
    drawSkinCarousel();
    drawPill('> JUGAR <', MENU_PLAY_Y, '232,59,42');
    drawPill('DESAFIO DIARIO', MENU_DAILY_Y, '63,212,255');

    ptext('< > CAMINAR · ↑↓ TREPAR · TOCAR=SALTAR', 0.5, 0.83, 0.0092, 'rgba(200,205,215,0.7)');
    if (t % 1.2 < 0.7) ptext('INSERTE UNA MONEDA', 0.5, 0.91, 0.012, '#ffd23f');
  }
  function menuTap(lx, ly) {
    // #7 swatches de skin (X+Y, antes que los pills para no robarles el tap)
    if (Math.abs(ly - ppy(SKIN_CAR_Y)) < PF.h * 0.028) {
      const n = SKINS.length;
      for (let i = 0; i < n; i++) {
        if (Math.abs(lx - ppx(skinSwatchX(i, n))) < PF.w * 0.055) {
          const s = SKINS[i];
          if (gh.total >= s.unlock) { gh.skin = s.id; localStorage.setItem('dk_skin', s.id); bakeMario(s.pal); }
          return;
        }
      }
      return;
    }
    if (Math.abs(ly - ppy(MENU_PLAY_Y)) < PF.h * 0.045) { startGame('classic'); return; }
    if (Math.abs(ly - ppy(MENU_DAILY_Y)) < PF.h * 0.045) { startGame('daily'); return; }
  }

  // ════════════════ INPUT (listeners) ════════════════
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    const draftIntro = gh.screen === 'game' && gh.phase === 'intro' && gh.hazardChoices && gh.level >= 2;
    if (draftIntro) {                                          // #8: elegir hazard con teclado (no bufferea salto)
      if (e.code === 'ArrowUp' || e.code === 'ArrowLeft') chooseHazard(0);
      else if (e.code === 'ArrowDown' || e.code === 'ArrowRight') chooseHazard(1);
      else if (e.code === 'Enter' || e.code === 'Space') chooseHazard(0);
    } else {
      if (e.code === 'Space' || e.code === 'KeyX') jumpBuf = 0.12;
      if (e.code === 'Enter') {
        if (gh.screen === 'menu') startGame('classic');
        else if (gh.phase === 'over') backToMenu();
      }
    }
    if (e.code === 'Escape' && gh.screen === 'game') backToMenu();
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  // Soltar TODO el input al perder foco: si alt-tabeás (o llega una notificación / gesto del SO) con
  // una tecla apretada, el keyup nunca llega y Mario seguiría caminando solo al volver. NO se llama en
  // startLevel(): ahí borraría una tecla genuinamente sostenida en el respawn (los botones de la barra
  // ya se sueltan solos vía lostpointercapture; lo que no tenía red era el mapa `keys` del teclado).
  const clearInput = () => {
    for (const k in keys) keys[k] = false;
    vk.left = vk.right = vk.up = vk.down = false;
    document.querySelectorAll('.pad button.held').forEach(b => b.classList.remove('held'));
    jumpBuf = 0;
  };
  window.addEventListener('blur', clearInput);
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearInput(); });

  canvas.addEventListener('pointerdown', e => {
    ac();                                            // despierta el audio con el primer gesto
    const r = canvas.getBoundingClientRect();
    const lx = e.clientX - r.left, ly = e.clientY - r.top;
    if (gh.screen === 'menu') { menuTap(lx, ly); return; }
    if (gh.phase === 'over') { backToMenu(); return; }
    if (gh.phase === 'intro' && gh.hazardChoices && gh.level >= 2) {        // #8 elegir hazard tocando un pill
      for (let i = 0; i < 2; i++) if (Math.abs(ly - ppy(HAZ_PILL_Y[i])) < PF.h * 0.035) { chooseHazard(i); return; }
      return;
    }
    jumpBuf = 0.12;                                  // en juego: tocar la pantalla = saltar
  });

  // Botones de la barra con HOLD: pointer capture para no perder el release (gotcha de nipplejs:
  // los botones sueltos con capture aguantan multitouch sin colgarse).
  function holdable(el, prop) {
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      vk[prop] = true; el.classList.add('held');
      ac();
    });
    const off = () => { vk[prop] = false; el.classList.remove('held'); };
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('lostpointercapture', off);
  }
  holdable(document.getElementById('btnLeft'),  'left');
  holdable(document.getElementById('btnRight'), 'right');
  holdable(document.getElementById('btnUp'),    'up');
  holdable(document.getElementById('btnDown'),  'down');

  // ════════════════ LOOP ════════════════
  // OJO mobile: medir SIEMPRE contra el mismo reloj (el now de rAF) y clampear dt — en algunos
  // WebView performance.now() y el timestamp de rAF tienen épocas distintas (gotcha de TronWeb).
  let lastT = null;
  let perfT = 0;                                     // tiempo acumulado para pulsos de menú
  function loop(now) {
    if (typeof now !== 'number') now = performance.now();
    if (lastT === null) lastT = now;
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (!(dt >= 0) || dt > 0.05) dt = 0.01;
    perfT += dt;
    if (jumpBuf > 0) jumpBuf -= dt;

    if (gh.screen === 'menu') {
      drawMenu(dt);
    } else {
      if (gh.phase === 'intro') {
        gh.phaseT += dt;
        // #8 draft de hazard desde nivel 2: NO auto-avanza, espera que elijas un pill (con safety a los 8 s).
        const draft = gh.hazardChoices && gh.level >= 2;
        if (!draft) { if (gh.phaseT > 1.3) { gh.phase = 'play'; gh.phaseT = 0; jumpBuf = 0; } }
        else if (gh.phaseT > 8) chooseHazard(0);
      } else if (gh.phase === 'play') {
        updateFrenzy(dt);                                   // #5 furia (telegrafía + ventana)
        dk.process(dt);
        pauline.process(dt);
        oilT += dt;
        for (const b of barrels) { b.process(dt); if (gh.phase !== 'play') break; }
        barrels = barrels.filter(b => !b.dead);
        if (gh.phase === 'play') updatePies(dt);            // #9 cinta: spawn + proceso de tortas
        if (gh.phase === 'play') {
          for (const f of fireballs) { f.process(dt); if (gh.phase !== 'play') break; }
          fireballs = fireballs.filter(f => !f.dead);
        }
        if (gh.phase === 'play') mario.process(dt);
        if (gh.comboT > 0) { gh.comboT -= dt; if (gh.comboT <= 0) gh.comboN = 0; }   // #1 ventana del combo
        // bonus que baja — llegar a 0 mata (se acabó el tiempo)
        if (gh.phase === 'play') {
          gh.bonusT += dt;
          if (gh.bonusT >= BONUS_TICK) {
            gh.bonusT = 0; gh.bonus = Math.max(0, gh.bonus - 100);
            if (gh.bonus === 0) die();
          }
        }
      } else if (gh.phase === 'dying') {
        gh.phaseT += dt; mario.deadT += dt;
        if (gh.phaseT > 2.1) {
          gh.lives--;
          if (gh.lives > 0) respawn();
          else { gh.phase = 'over'; gh.phaseT = 0; }
        }
      } else if (gh.phase === 'win') {
        gh.phaseT += dt;
        pauline.process(dt);
        if (gh.phaseT > 2.8) { gh.level++; startLevel(); }
      } else if (gh.phase === 'over') {
        gh.phaseT += dt;
      }
      drawGame(dt);
    }
    requestAnimationFrame(loop);
  }

  // ── INIT ──
  if (document.fonts && document.fonts.load) document.fonts.load('12px "Press Start 2P"');
  // #7 resolver skin guardada (defensivo: si el id no existe o no está desbloqueada → classic; nunca crashea)
  {
    const saved = SKINS.find(s => s.id === (localStorage.getItem('dk_skin') || 'classic'));
    const sk = (saved && gh.total >= saved.unlock) ? saved : SKINS[0];
    gh.skin = sk.id; bakeMario(sk.pal);
  }
  resize();
  loop();

  const hint = document.getElementById('hint');
  setTimeout(() => hint.style.opacity = '0', 6000);
  canvas.addEventListener('pointerdown', () => hint.style.opacity = '0', { once: true });
  </script>

  <!-- Shell del Arcade (exit + fullscreen + lock de orientación). data-orient: landscape/portrait/any. -->
  <script src="../../Arcade/arcade-shell.js" data-orient="portrait"></script>

  <div id="fpsOverlay">FPS: --</div>
  <script>
    (function() {
      let frameCount = 0, lastT = performance.now();
      const overlay = document.getElementById('fpsOverlay');
      function loop() {
        frameCount++;
        const now = performance.now();
        if (now - lastT >= 500) {
          const fps = Math.round(frameCount * 1000 / (now - lastT));
          if (overlay.style.display !== 'none') overlay.textContent = 'FPS: ' + fps;
          frameCount = 0; lastT = now;
        }
        requestAnimationFrame(loop);
      }
      loop();
      const btn = document.getElementById('btnInfo');
      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        // El overlay arranca con display:none POR CSS — comparamos con === 'block' (estado visible
        // explícito) en vez de !== 'none' para no comerse el primer tap (gotcha de TronWeb).
        const showing = overlay.style.display === 'block';
        overlay.style.display = showing ? 'none' : 'block';
        btn.classList.toggle('on', !showing);
      });
    })();
  </script>

</body>
