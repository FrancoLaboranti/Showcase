<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TankWARS">
<title>TankWARS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    font-family: 'Bahnschrift', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  }
  /* Resolución LÓGICA fija 1280×720 (igual que el pygame original); el canvas se estira para llenar la
     pantalla (escala no-uniforme). El juego es horizontal → en celular apaisado el estiramiento es mínimo. */
  /* #stage envuelve TODO el juego. En vertical (celu con giro bloqueado) lo rotamos 90° por CSS para que el
     juego SIEMPRE se vea landscape, sin usar la API de orientación (que mostraba un flash). resize() le setea
     width/height/transform. Al tener transform, es el bloque contenedor de sus hijos position:fixed. */
  #stage { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 100vw; height: 100vh; overflow: hidden; }
  #c { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }

  #hint { display: none; }   /* cartelito de inicio oculto a propósito */

  /* ── Controles táctiles (joysticks hand-rolled + botones), al estilo CrazyTanks. En desktop se ocultan
     (teclado+mouse). Cada joystick es una ZONA grande invisible: tocás en cualquier punto de su mitad de
     pantalla y la palanca aparece centrada en el dedo (base + nub dibujados con DOM por createJoystick). ── */
  #jMove { position: fixed; left: 0;  bottom: 0; width: 50%; height: 82%; z-index: 3; touch-action: none; }
  #jAim  { position: fixed; right: 0; bottom: 0; width: 50%; height: 82%; z-index: 3; touch-action: none; }
  /* Botones de acción (abajo-derecha), por encima de las zonas. En COLUMNA: boost (acelerar) ARRIBA del misil. */
  #actBtns { position: fixed; right: calc(10px + env(safe-area-inset-right)); bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  /* Safety zone: rectángulo (abajo-derecha) que cubre boost+misil con margen. Está por ENCIMA de la zona de
     puntería (#jAim) y por DEBAJO de los botones → absorbe el toque para que la palanca der NO se active ahí,
     pero los botones siguen funcionando. */
  #aimSafe { position: fixed; right: 0; bottom: 0; width: calc(92px + env(safe-area-inset-right)); height: calc(205px + env(safe-area-inset-bottom)); z-index: 4; touch-action: none; }
  .btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.08);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: none; padding: 0;
    transition: background 0.08s, transform 0.06s, box-shadow 0.12s, border-color 0.12s;
  }
  /* Relleno NEUTRO como Pong: blanco tenue en reposo, blanco más fuerte al apretar (sin tinte celeste). El
     hover sólo en dispositivos con mouse → en touch no queda "pegado". */
  @media (hover: hover) { .btn:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.4); } }
  .btn:active, .btn.on { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.4); transform: scale(0.93); }
  .btn svg { display: block; width: 18px; height: 18px; pointer-events: none; }
  .btn.boost { background: rgba(255,210,60,0.16); border-color: rgba(255,210,60,0.5); }
  .btn.boost:active, .btn.boost.on { background: rgba(255,210,60,0.4); }
  .btn.missile { background: rgba(255,90,60,0.16); border-color: rgba(255,90,60,0.5); }
  .btn.missile:active, .btn.missile.on { background: rgba(255,90,60,0.42); }
  /* Indicador de tienda: puntito amarillo pulsante en el botón 🛒 cuando alcanza para ALGUNA mejora. */
  #btnShop { position: relative; }
  #btnShop.canBuy { border-color: rgba(255,210,60,0.7); }
  #btnShop.canBuy::after {
    content: ''; position: absolute; top: -1px; right: -1px; width: 11px; height: 11px; border-radius: 50%;
    background: #ffd23c; box-shadow: 0 0 8px rgba(255,210,60,0.95);
    animation: shopPing 1.1s ease-in-out infinite;
  }
  @keyframes shopPing { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.65; } }

  /* Estilizado del joystick de nipplejs: base hundida con glow + nub con relieve celeste. */
  .nipple .back {
    background: radial-gradient(circle at 50% 38%, rgba(255,255,255,0.10), rgba(255,255,255,0.03) 70%) !important;
    border: 1px solid rgba(120,200,255,0.35);
    box-shadow: inset 0 2px 14px rgba(0,0,0,0.5), 0 0 16px rgba(120,200,255,0.25);
    opacity: 1 !important;
  }
  .nipple .front {
    background: radial-gradient(circle at 50% 35%, rgba(160,220,255,0.95), rgba(120,200,255,0.55) 70%) !important;
    border: 1px solid rgba(180,228,255,0.8);
    box-shadow: 0 3px 10px rgba(0,0,0,0.5), 0 0 16px rgba(120,200,255,0.6);
    opacity: 1 !important;
  }
  /* Palanca de puntería/disparo (derecha): tinte rojo para diferenciarla de la de movimiento (azul). */
  #jAim .nipple .back { border-color: rgba(255,90,60,0.4); box-shadow: inset 0 2px 14px rgba(0,0,0,0.5), 0 0 16px rgba(255,90,60,0.25); }
  #jAim .nipple .front {
    background: radial-gradient(circle at 50% 35%, rgba(255,170,150,0.95), rgba(255,90,60,0.6) 70%) !important;
    border: 1px solid rgba(255,180,160,0.85);
    box-shadow: 0 3px 10px rgba(0,0,0,0.5), 0 0 16px rgba(255,90,60,0.6);
  }

  /* Placeholder TENUE de cada palanca: se ve la posición de descanso (prolija) al arrancar, antes del primer
     toque. Apenas tocás, el joystick real (modo semi) toma el control y queda él tenue en la última posición. */
  .joyRest {
    position: fixed; width: 90px; height: 90px; border-radius: 50%;
    transform: translate(-50%, 50%); z-index: 2; pointer-events: none; opacity: 0.4;
    background: radial-gradient(circle at 50% 38%, rgba(255,255,255,0.10), rgba(255,255,255,0.03) 70%);
    border: 1px solid rgba(120,200,255,0.35);
    box-shadow: inset 0 2px 14px rgba(0,0,0,0.5), 0 0 16px rgba(120,200,255,0.25);
  }
  .joyRest::after {
    content: ''; position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 50% 35%, rgba(160,220,255,0.95), rgba(120,200,255,0.55) 70%);
    border: 1px solid rgba(180,228,255,0.8);
  }
  /* Posición de descanso: cerca de los botones (esquinas inferiores). Izq cerca del exit, der cerca de boost/misil. */
  #jMoveRest { left: 25%; bottom: 13%; }
  #jAimRest  { left: 75%; bottom: 13%; border-color: rgba(255,90,60,0.35); box-shadow: inset 0 2px 14px rgba(0,0,0,0.5), 0 0 16px rgba(255,90,60,0.25); }
  #jAimRest::after { background: radial-gradient(circle at 50% 35%, rgba(255,170,150,0.95), rgba(255,90,60,0.6) 70%); border-color: rgba(255,180,160,0.85); }

  /* Botones de esquina sup-der: pantalla completa / reiniciar / debug */
  #padMenu { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); z-index: 18; display: flex; gap: 8px; }   /* por ENCIMA de menú(17)/shop(16): los botones de la esquina (salir, fullscreen, stats) quedan siempre usables */
  #padMenu .btn { width: 32px; height: 32px; }
  #padMenu .btn svg { width: 15px; height: 15px; }
  #padMenu .btn.on { background: rgba(120,200,255,0.30); }
  #btnFs .ic-exit { display: none; }
  body.fs-on #btnFs .ic-enter { display: none; }
  body.fs-on #btnFs .ic-exit  { display: block; }
  /* botón de pausa: barras cuando corre, triángulo (reanudar) cuando está en pausa */
  #btnPause .ic-play { display: none; }
  #btnPause.on .ic-pause { display: none; }
  #btnPause.on .ic-play  { display: block; }

  /* Aviso de orientación: el juego es horizontal. Se muestra (vía JS) cuando la pantalla está vertical. */
  #rotate {
    position: absolute; inset: 0; z-index: 20; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: #05060a; color: rgba(255,255,255,0.85);
    text-align: center; padding: 24px;
  }
  #rotate svg { width: 88px; height: 88px; color: #78c8ff; animation: rotatehint 2.2s ease-in-out infinite; }
  #rotate p { font-size: 19px; letter-spacing: 0.06em; line-height: 1.5; }
  @keyframes rotatehint { 0%, 55%, 100% { transform: rotate(0deg); } 25%, 40% { transform: rotate(90deg); } }
  /* Exit button — ahora vive en #padMenu (arriba-derecha) junto a los otros, con acento rojo. */
  #padMenu #btnExit:hover { background: rgba(240,90,95,0.18); border-color: rgba(240,90,95,0.6); box-shadow: 0 0 14px rgba(240,90,95,0.5); }
  #padMenu #btnExit:active { background: rgba(240,90,95,0.30); border-color: rgba(240,90,95,0.55); color: #fff; }

  /* Cajita de stats (FPS + wave + conteo explícito de sprites): overlay arriba-izquierda que togglea el botón
     circle-i (#btnInfo). NO pausa el juego (estilo Snake). pointer-events:none → no bloquea toques del juego. */
  #fpsBox { position: fixed; left: calc(10px + env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top)); z-index: 16; display: none; padding: 7px 11px; background: rgba(8,11,18,0.85); border: 1px solid rgba(120,200,255,0.3); border-radius: 8px; color: rgba(205,228,255,0.95); font: 600 13px ui-monospace, 'Consolas', Menlo, monospace; line-height: 1.5; letter-spacing: 0.03em; pointer-events: none; }
  #fpsBox.show { display: block; }

  /* ── TIENDA (mejoras). Overlay full-screen; pausa el juego. 8 ítems en grilla 2×4. ── */
  #shopPanel { position: absolute; inset: 0; z-index: 16; display: none; align-items: center; justify-content: center; background: rgba(5,6,10,0.86); padding: 16px; }
  #shopPanel.show { display: flex; }
  /* fuente "de oro": monoespaciada, para diferenciar TODO número de oro del resto de la UI */
  #shopPanel { --goldfont: 'Consolas','SFMono-Regular','Menlo','Courier New',monospace; }
  #shopPanel .shopCard { width: 96%; max-width: 1180px; background: linear-gradient(180deg, rgba(24,22,16,0.97), rgba(11,13,20,0.98)); border: 1px solid rgba(255,205,80,0.42); border-radius: 16px; padding: 16px 18px 14px; box-shadow: 0 0 42px rgba(255,195,60,0.2), inset 0 1px 0 rgba(255,255,255,0.07); }
  #shopPanel .shopTitle { text-align: center; color: #ffe08a; font-size: 12px; font-weight: 800; letter-spacing: 0.24em; text-indent: 0.24em; text-transform: uppercase; opacity: 0.8; }   /* text-indent compensa el espaciado final → centrado real */
  #shopPanel .shopHead { text-align: center; color: #ffd23c; font-size: 27px; font-weight: 800; margin: 3px 0 14px; font-family: var(--goldfont); text-shadow: 0 0 16px rgba(255,200,60,0.5); }
  /* TRES ÁRBOLES lado a lado, ocupando el ancho */
  #shopPanel .shopTrees { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; align-items: start; }
  #shopPanel .shopTree { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 13px; border: 1px solid rgba(var(--tc),0.32); background: linear-gradient(180deg, rgba(var(--tc),0.09), rgba(var(--tc),0.02)); box-shadow: inset 0 0 24px rgba(var(--tc),0.06); }
  #shopPanel .shopTree-offense { --tc: 255,96,72;  --tc2: 255,168,96; }   /* rojo/naranja */
  #shopPanel .shopTree-defense { --tc: 78,176,255;  --tc2: 130,236,255; }  /* celeste/azul */
  #shopPanel .shopTree-utility { --tc: 120,226,128; --tc2: 188,255,150; }  /* verde lima */
  #shopPanel .shopTreeHdr { text-align: center; text-transform: uppercase; font-weight: 800; font-size: 14px; letter-spacing: 0.16em; padding: 9px 6px; border-radius: 10px; color: rgb(var(--tc2)); background: rgba(var(--tc),0.16); border: 1px solid rgba(var(--tc),0.34); text-shadow: 0 0 14px rgba(var(--tc),0.55); }
  #shopPanel .shopTreeBody { display: flex; flex-direction: column; gap: 8px; }
  #shopPanel .shopItem {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    padding: 9px 12px; border-radius: 11px; cursor: pointer; touch-action: none;
    border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.035); color: #fff;
    text-align: left; transition: background 0.1s, transform 0.06s, border-color 0.12s, box-shadow 0.12s;
  }
  #shopPanel .shopItem:active { transform: scale(0.97); }
  #shopPanel .shopItem .si-label { font-size: 13.5px; font-weight: 700; letter-spacing: 0.02em; }
  #shopPanel .shopItem .si-row { display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: 13px; }
  #shopPanel .shopItem .si-lvl { color: rgba(255,255,255,0.5); font-size: 12px; }
  #shopPanel .shopItem .si-cost { font-weight: 800; font-family: var(--goldfont); letter-spacing: 0.02em; }
  /* asequible → se tiñe con el color del árbol (cada árbol único) */
  #shopPanel .shopTree .shopItem.afford { border-color: rgba(var(--tc),0.65); box-shadow: 0 0 14px rgba(var(--tc),0.28); }
  #shopPanel .shopTree .shopItem.afford .si-cost { color: rgb(var(--tc2)); }
  @media (hover: hover) { #shopPanel .shopTree .shopItem.afford:hover { background: rgba(var(--tc),0.14); } }
  #shopPanel .shopTree .shopItem.afford:active { background: rgba(var(--tc),0.22); }
  #shopPanel .shopItem.noafford { opacity: 0.5; }
  #shopPanel .shopItem.noafford .si-cost { color: #e0504f; }
  #shopPanel .shopItem.maxed { border-color: rgba(255,255,255,0.24); opacity: 0.82; }
  #shopPanel .shopItem.maxed .si-cost, #shopPanel .shopItem.maxed .si-lvl { color: rgba(255,255,255,0.62); font-family: var(--goldfont); }
  #shopPanel .shopFoot { margin-top: 14px; text-align: center; color: rgba(255,255,255,0.4); font-size: 12px; letter-spacing: 0.04em; }

  /* MENÚ PRINCIPAL: semitransparente para ver las explosiones de fondo. */
  #menuPanel { position: absolute; inset: 0; z-index: 17; display: none; align-items: center; justify-content: center; background: rgba(5,6,10,0.72); padding: 16px; }
  #menuPanel.show { display: flex; }
  #menuPanel .menuCard { position: relative; width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; background: rgba(16,20,30,0.94); border: 1px solid rgba(120,200,255,0.35); border-radius: 16px; padding: 14px 18px; box-shadow: 0 0 36px rgba(120,200,255,0.28); text-align: center; }
  /* Tooltip suave de arquetipos/mutadores: hover (desktop) o mantener tocado (mobile). Absoluto dentro de la tarjeta,
     centrado horizontal, justo debajo del chip. Fade + leve slide → "pop" suave. No bloquea toques. */
  #menuPanel .menuTip { position: absolute; left: 50%; z-index: 6; max-width: 230px; padding: 6px 11px; background: rgba(10,14,22,0.98); border: 1px solid rgba(120,200,255,0.5); border-radius: 9px; color: rgba(255,255,255,0.92); font-size: 11px; line-height: 1.4; text-align: center; box-shadow: 0 5px 18px rgba(0,0,0,0.55); pointer-events: none; opacity: 0; transform: translate(-50%, 5px); transition: opacity 0.15s ease, transform 0.15s ease; }
  #menuPanel .menuTip.show { opacity: 1; transform: translate(-50%, 0); }
  #menuPanel .menuTitle { color: #fff; font-size: 30px; font-weight: 800; letter-spacing: 0.08em; text-shadow: 0 0 18px rgba(120,200,255,0.55); }
  #menuPanel .menuSub { color: rgba(255,255,255,0.6); font-size: 11px; letter-spacing: 0.05em; margin: 10px 0 5px; text-transform: uppercase; }
  #menuPanel .menuColors { display: flex; flex-wrap: nowrap; justify-content: center; gap: 5px; margin-bottom: 4px; }
  #menuPanel .swatch { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; touch-action: none; border: 1.5px solid rgba(255,255,255,0.25); box-shadow: inset 0 2px 6px rgba(0,0,0,0.4); transition: transform 0.08s, border-color 0.12s, box-shadow 0.12s; }
  #menuPanel .swatch:active { transform: scale(0.92); }
  #menuPanel .swatch.sel { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.35), 0 0 12px rgba(120,200,255,0.6); transform: scale(1.12); }
  #menuPanel .swatch.locked { opacity: 0.28; filter: grayscale(0.7); cursor: not-allowed; }
  #menuPanel .swatch.locked::after { content: '🔒'; font-size: 10px; }
  #menuPanel .menuDiff { display: block; width: 100%; max-width: 280px; margin: 12px auto 0; padding: 9px 16px; border-radius: 10px; cursor: pointer; touch-action: none; font-size: 14px; font-weight: 700; letter-spacing: 0.03em; color: #fff; border: 1px solid rgba(120,200,255,0.5); background: rgba(120,200,255,0.12); transition: background 0.1s, transform 0.06s, border-color 0.12s, color 0.12s; }
  #menuPanel .menuDiff:active { transform: scale(0.97); }
  #menuPanel .menuDiff.hard { color: #ff9b3c; border-color: rgba(255,140,40,0.7); background: rgba(255,140,40,0.16); }
  #menuPanel .menuPlay { display: block; width: 100%; max-width: 280px; margin: 10px auto 0; padding: 11px 16px; border-radius: 11px; cursor: pointer; touch-action: none; font-size: 19px; font-weight: 800; letter-spacing: 0.05em; color: #06210f; border: none; background: linear-gradient(180deg,#7dffb0,#34c46a); box-shadow: 0 4px 18px rgba(52,196,106,0.4); transition: transform 0.06s, box-shadow 0.12s; }
  #menuPanel .menuPlay:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(52,196,106,0.4); }
  #menuPanel .menuHint { margin-top: 10px; color: rgba(255,255,255,0.45); font-size: 11px; line-height: 1.45; letter-spacing: 0.02em; }
  #menuPanel .menuChips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 3px; }
  #menuPanel .menuChip { padding: 6px 10px; border-radius: 8px; cursor: pointer; touch-action: none; font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.7); border: 1px solid rgba(120,200,255,0.35); background: rgba(120,200,255,0.08); transition: background 0.1s, transform 0.06s, border-color 0.12s, color 0.12s; }
  #menuPanel .menuChip:active { transform: scale(0.95); }
  #menuPanel .menuChip.sel { color: #fff; border-color: rgba(120,200,255,0.9); background: rgba(120,200,255,0.28); box-shadow: 0 0 12px rgba(120,200,255,0.4); }
  #menuPanel .menuChip.mut.sel { color: #ff9b3c; border-color: rgba(255,140,40,0.8); background: rgba(255,140,40,0.22); box-shadow: 0 0 12px rgba(255,140,40,0.4); }
  #menuPanel .menuBest { margin-top: 8px; color: rgba(255,210,90,0.85); font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
  /* Overlay de DRAFT de power-up: elegir 1 de hasta 3 mejoras (congela el juego). */
  #draftPanel { position: absolute; inset: 0; z-index: 18; display: none; align-items: center; justify-content: center; background: rgba(5,6,10,0.8); padding: 16px; }
  #draftPanel.show { display: flex; }
  #draftPanel .draftCard { width: 100%; max-width: 640px; background: rgba(16,20,30,0.96); border: 1px solid rgba(205,130,255,0.45); border-radius: 16px; padding: 22px 20px; box-shadow: 0 0 36px rgba(205,130,255,0.3); text-align: center; }
  #draftPanel .draftTitle { color: #e8c8ff; font-size: 21px; font-weight: 800; letter-spacing: 0.05em; margin-bottom: 16px; text-shadow: 0 0 16px rgba(205,130,255,0.55); }
  #draftPanel .draftRow { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  #draftPanel .draftOpt { flex: 1 1 160px; max-width: 200px; min-height: 118px; cursor: pointer; touch-action: none; border-radius: 12px; padding: 16px 12px; border: 1px solid rgba(205,130,255,0.5); background: rgba(205,130,255,0.12); transition: transform 0.06s, background 0.12s, border-color 0.12s; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  #draftPanel .draftOpt:active { transform: scale(0.96); background: rgba(205,130,255,0.3); border-color: rgba(205,130,255,0.9); }
  #draftPanel .dOptName { font-size: 16px; font-weight: 800; letter-spacing: 0.03em; color: #f0d8ff; }
  #draftPanel .dOptDesc { font-size: 12px; line-height: 1.4; color: rgba(255,255,255,0.7); }
  /* En el menú: ocultar palancas, botones de acción y el hint del juego. */
  body.inMenu #actBtns, body.inMenu #jMove, body.inMenu #jAim, body.inMenu #jMoveRest, body.inMenu #jAimRest, body.inMenu #aimSafe, body.inMenu #hint { display: none !important; }
</style>
</head>
<body>
  <!-- #stage envuelve TODO el juego para poder rotarlo a landscape por CSS (ver resize()). Las palancas
       hand-rolled (base/nub) se appendean a <body> (afuera de #stage) → quedan en coords de pantalla. -->
  <div id="stage">
  <canvas id="c"></canvas>
  <div id="hint">left stick moves · right stick aims &amp; fires · 🚀 missile · ⚡ boost</div>

  <!-- Zona de MOVIMIENTO: joystick semi (mitad izquierda). Tocás donde quieras y aparece ahí; queda tenue. -->
  <div id="jMove" aria-label="move"></div>
  <!-- Zona de PUNTERÍA/DISPARO: joystick semi (mitad derecha). Mueve la mira sobre el mapa y dispara. -->
  <div id="jAim" aria-label="aim and fire"></div>
  <!-- Placeholders tenues: posición de descanso prolija al arrancar (antes del primer toque). -->
  <div id="jMoveRest" class="joyRest"></div>
  <div id="jAimRest" class="joyRest"></div>

  <!-- Safety zone: absorbe toques sobre el rectángulo de boost/misil para no activar la palanca de puntería. -->
