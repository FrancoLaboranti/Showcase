  function waveTint(wave) {
    let r=0,g=0,b=0,n=0;
    for (let i=1;i<wave.length;i++) { const type=wave[i][0], count=wave[i][1], c=TYPE_TINT[type]||[140,140,150], w=(BOSS_TYPES.has(type)?count*4:count)||1; r+=c[0]*w; g+=c[1]*w; b+=c[2]*w; n+=w; }
    return n ? [r/n,g/n,b/n] : [140,140,150];
  }
  function waveBgColor(cur, nxt) {
    const a = waveTint(cur), b = waveTint(nxt);   // 45% lo que peleás ahora + 55% lo que se viene
    return modifyColorPerc([a[0]*0.45+b[0]*0.55, a[1]*0.45+b[1]*0.55, a[2]*0.45+b[2]*0.55], 0.22);
  }
  // ── EVENTOS DE OLEADA telegrafiados (fuera de peleas de jefe): picos de variedad con riesgo/recompensa neutro ──
  function fireEvent() {
    if (!player) return;
    const ev = ri(0, 2);
    if (ev === 0) {                                   // SUMINISTROS: racimo de lootboxes
      for (let i = 0; i < 3; i++) new LootBox();
      manager.banner = { text: 'SUPPLY DROP!', sub: 'loot crates', t: 0 };
    } else if (ev === 1) {                            // HORDA: enjambre extra de fodder (más oro)
      for (let i = 0; i < Math.round(ri(8, 12) * MOBILE_SPAWN); i++) { if (enemies.length >= MAX_ENEMIES) break; new SmallPink(); }
      for (let i = 0; i < Math.max(1, Math.round(ri(2, 4) * MOBILE_SPAWN));  i++) { if (enemies.length >= MAX_ENEMIES) break; new BasicRed(); }
      manager.banner = { text: 'HORDE!', sub: 'extra wave', t: 0 };
    } else {                                          // CACERÍA: un élite muy premiado
      if (enemies.length < MAX_ENEMIES) { const e = new (ri(0,1) ? Purple : BasicBlue)(); applyAffix(e); e.scoreValue = Math.round(e.scoreValue*1.4); e.dropCoins += 6; e.coinValue += 10; }
      manager.banner = { text: 'BOUNTY!', sub: 'rewarding elite', t: 0 };
    }
  }

  function grantPowerUp(p, id) { p.powerUps[id] = true; const u = POWER_UPS.find(x => x.id === id); if (u) u.apply(p); }
  const draftPanel = document.getElementById('draftPanel');
  function openDraft(opts) {     // congela el juego (manager.draftOpen) y muestra 1-de-3 cartas

  function pickDraft(id) {

  // ── MUTADORES (opt-in en el menú): trade-offs auto-balanceados que cambian toda la run. player()=ajusta stats
  // del tanque; mgr()=ajusta multiplicadores globales (cantidad de enemigos, oro, score, velocidad). ──
  const MUTATORS = [
    { id:'glass',  label:'Glass Cannon', desc:'+60% damage done and taken', player(p){ p.regAttack*=1.6; p.attack=p.regAttack; p.regDefense*=1.6; p.defense=p.regDefense; } },
    { id:'swarm',  label:'Swarm',        desc:'Fragile fast horde: +120% enemies, +50% gold, few elites', mgr(m){ m.enemyCountMul*=2.2; m.enemyHpMul*=0.55; m.enemySpeedMul*=1.2; m.coinMul*=1.5; m.scoreMul*=1.15; m.affixMul*=0.4; } },
    { id:'nopowerups',label:'No Power-ups', desc:'No upgrade drafts, +30% score, +25% gold', player(p){ p.noPowerups=true; }, mgr(m){ m.scoreMul*=1.3; m.coinMul*=1.25; } },
    { id:'frenzy', label:'Frenzy',       desc:'Everyone +30% speed, +15% score',   player(p){ p.regMoveSpeed*=1.3; p.moveSpeed=p.regMoveSpeed; }, mgr(m){ m.scoreMul*=1.15; m.enemySpeedMul*=1.3; } },
  ];
  function applyMutatorsToManager() {
    const m = manager;
    m.enemyCountMul = 1; m.coinMul = 1; m.scoreMul = 1; m.enemySpeedMul = 1; m.enemyHpMul = 1; m.affixMul = 1;
    MUTATORS.forEach(mu => { if (m.mutators[mu.id] && mu.mgr) mu.mgr(m); });
  }
  function applyMutatorsToPlayer(p) { MUTATORS.forEach(mu => { if (manager.mutators[mu.id] && mu.player) mu.player(p); }); }

  // ── ARQUETIPOS de tanque (elegís en el menú): MISMO presupuesto de poder, redistribuido → playstyles distintos,
  // balance neutro por construcción (ej: francotirador pega ×2.2 pero dispara ×2.2 más lento = mismo DPS). ──
  const ARCHETYPES = [
    { id:'estandar', label:'Standard', desc:'Balanced, no trade-offs', apply(p){} },
    { id:'sniper',   label:'Sniper',   desc:'Hard-hitting but slow-firing shots', apply(p){ p.regAttack*=2.2; p.attack=p.regAttack; p.regPrimaryShotAS*=2.2; p.primaryShotAS=p.regPrimaryShotAS; p.regSecondaryShotAS*=1.2; p.secondaryShotAS=p.regSecondaryShotAS;} },   // misil también: pega +fuerte pero recarga +lento (DPS neutro)
    { id:'gunner',   label:'Gunner',   desc:'Fast-firing but weaker shots', apply(p){ p.regAttack*=0.55; p.attack=p.regAttack; p.regPrimaryShotAS=Math.max(p.regPrimaryShotAS*0.55,0.03); p.primaryShotAS=p.regPrimaryShotAS; p.regSecondaryShotAS*=0.8; p.secondaryShotAS=p.regSecondaryShotAS;} },   // cañón: +rápido pero +débil (DPS neutro). El CDR del misil se movió al Commando
    { id:'bunker',   label:'Bunker',   desc:'Takes much less damage, slower movement', apply(p){ p.regDefense*=0.4; p.defense=p.regDefense; p.regMoveSpeed*=0.6; p.moveSpeed=p.regMoveSpeed; } },
    { id:'comando',  label:'Commando', desc:'Missile specialist: +2 missiles, faster reload, slightly weaker cannon', apply(p){ p.missileMax+=2; p.missileStack+=2; p.regSecondaryShotAS*=0.55; p.secondaryShotAS=p.regSecondaryShotAS; p.regAttack*=0.85; p.attack=p.regAttack; } },   // especialista en misiles: +2 en reserva + recarga +rápida (CDR movido del Gunner), cañón un toque +débil
  ];
  function applyArchetype(p) { const a = ARCHETYPES[manager.archetype] || ARCHETYPES[0]; a.apply(p); }

  // ════════════════ DISPAROS ════════════════
  class PrimaryShot {
    constructor(tank, angOffset = 0) {         // angOffset: alas del disparo TRIPLE (mejora power)
      this.color = modifyColor(tank.color,150);
      this.radius = tank.radius*0.17;
      this.ang = tank.turretAng + angOffset;
      if (tank.isPlayer) this.ang += rnd(-PLAYER_SPREAD/2, PLAYER_SPREAD/2);  // cono chico solo para el jugador
      this.x = tank.x + Math.cos(this.ang)*this.radius*7;
      this.y = tank.y + Math.sin(this.ang)*this.radius*7;
      this.preX = this.x; this.preY = this.y;
      this.vel = sper(SHOT_SPEED);
      this.missile = false;
      this.isPlayerShot = tank.isPlayer;
      this.attack = tank.attack;
      if (tank.isPlayer && tank.powerUps.pierce) { this.pierce = true; this.hit = new Set(); }   // mejora PERFORANTE: atraviesa enemigos
      shots.push(this);
    }
    process() {
      this.preX = this.x; this.preY = this.y;
      this.x += Math.cos(this.ang)*this.vel*dt;
      this.y += Math.sin(this.ang)*this.vel*dt;
      // muere al alejarse de la VISTA (margen = 1 pantalla). El margen tiene que superar el alcance máximo
      // de disparo enemigo (raycast 50×radius ≈ 1750px del FinalBoss − media vista) o el disparo nacería
      // "fuera" y se eliminaría en el mismo frame sin llegarte nunca.
      if (!inView(this.x, this.y, W)) toRemove.add(this);
    }
    draw() {
      const tx = Math.cos(this.ang), ty = Math.sin(this.ang), r = this.radius;
      glow(this.x, this.y, r*2, this.color, 0.42);                                     // halo (un toque más chico)
      line(this.x-tx*r*3.4, this.y-ty*r*3.4, this.x, this.y, this.color, r*0.7);       // estela más fina
      line(this.x-tx*r*1.2, this.y-ty*r*1.2, this.x, this.y, modifyColorPerc(this.color,1.7), r*0.34);
      circle(this.x, this.y, r*0.5, [255,255,235]);                                    // núcleo blanco-cálido
    }
  }
  class SecondaryShot {
    constructor(tank) {
      this.color = tank.color.slice(); this.baseColor = tank.color.slice();
      this.glowColor = modifyColorPerc(tank.color,2); this.colorTimer = 0;
      this.radius = tank.radius*0.36;          // misil un toque más grande
      this.ang = tank.turretAng;
      this.x = tank.x + Math.cos(this.ang)*this.radius*4;
      this.y = tank.y + Math.sin(this.ang)*this.radius*4;
      this.preX = this.x; this.preY = this.y;
      this.vel = sper(MISSILE_SPEED); this.angVel = sper(0.005);
      this.lifeSpan = ri(7,10); this.missile = true;
      this.isPlayerShot = tank.isPlayer; this.attack = tank.attack;
      this.areaMult = (tank.isPlayer && tank.powerUps && tank.powerUps.bigMissiles) ? 2 : 1;   // BIG MISSILES: ×2 el radio de detonación (daño + explosión)
      shots.push(this);
    }
    process() {
      this.preX = this.x; this.preY = this.y;
      this.lifeSpan -= dt; if (this.lifeSpan <= 0) this.detonate();   // se agota → estalla igual (daño en área si hay algo cerca)

      // Auto-apuntado por CONO: el misil busca, dentro de un cono MISSILE_CONE hacia adelante, el blanco de
      // MAYOR importancia (a igual importancia, el más cercano). Los del jugador priorizan POR CAPAS, estricto:
      //   ENEMIGOS (1e9 + score×vida)  >  LOOTBOXES (1e6)  >  CAJAS/CRATES (vida ~3-5).
      // NO apunta a: enemigos con ESCUDO activo (el misil lo absorbe sin daño) ni blancos TAPADOS por un muro
      // o caja que no atraviesa (lo consume antes de llegar). El chequeo de línea (clearPath) es caro, así que
      // sólo se evalúa cuando el candidato ya mejoraría al mejor actual. Sin blanco válido en el cono → derecho.
      let bx = 0, by = 0, bestImp = -Infinity, bestDist = Infinity, have = false;
      const consider = (tx, ty, imp, ignoreWall) => {
        if (!inView(tx, ty, sper(0.02))) return;               // SIN rango infinito: si no está en pantalla, no se considera
        let da = Math.atan2(ty-this.y, tx-this.x) - this.ang;
        da = mod(da + Math.PI, TAU) - Math.PI;                 // diferencia angular en [-PI, PI]
        if (Math.abs(da) > MISSILE_CONE) return;               // fuera del cono → ignorar
        const d = Math.hypot(tx-this.x, ty-this.y);
        if (!(imp > bestImp || (imp === bestImp && d < bestDist))) return;   // no mejora → ni evaluamos la línea
        if (!this.clearPath(tx, ty, ignoreWall)) return;       // tapado por un muro/caja → inalcanzable, descartar
        bx = tx; by = ty; bestImp = imp; bestDist = d; have = true;
      };
      if (this.isPlayerShot) {
        // saltear enemigos con escudo activo O DISPONIBLE (useShield + carga + sin cooldown): si pueden, lo levantan
        // reflejamente cuando el misil llega y lo absorben → apuntarles es al pedo. Sólo si NO pueden bloquear ahora.
        for (const e of enemies) { if (e.shielded || (e.useShield && e.shieldCharge > 0 && e.shieldCD === 0)) continue; consider(e.x, e.y, 1e9 + (e.scoreValue || 1) * Math.max(e.health, 0), null); }
        for (const b of lootBoxes) consider(b.x, b.y, 1e6, null);                                                                             // lootboxes: capa media (sobre cajas)
        for (const w of walls) if (w.breakable) consider(w.x + w.width/2, w.y + w.height/2, Math.max(w.health, 0), w);                        // cajas: capa baja (ignora la propia como tapón)
      } else if (player) {
        consider(player.x, player.y, 1, null);                 // el misil enemigo SIEMPRE te apunta (con escudo o sin él — para eso está el escudo: bloquearlo)
      }
      if (have) {                                              // hay blanco en el cono → girar hacia él
        const aim = getAngle2(this.ang, [this.x,this.y], [bx, by]);
        this.ang += (aim > this.ang ? this.angVel : -this.angVel) * dt;
      }
      this.x += Math.cos(this.ang)*this.vel*dt;
      this.y += Math.sin(this.ang)*this.vel*dt;
      this.ang = mod(this.ang, TAU);
      this.colorTimer += dt;
      if (this.colorTimer > 0.075) {
        this.color = (this.color === this.baseColor) ? this.glowColor : this.baseColor;
        this.colorTimer = 0;
      }
      // estela de humo (1 partícula cada ~30ms, solo si se ve)
      this.smokeCD = (this.smokeCD || 0) - dt;
      if (this.smokeCD <= 0 && inView(this.x, this.y, 60)) {
        spawnPart(this.x - Math.cos(this.ang)*this.radius*3, this.y - Math.sin(this.ang)*this.radius*3,
                  rnd(-sper(0.01), sper(0.01)), rnd(-sper(0.01), sper(0.01)),
                  rnd(0.3, 0.55), this.radius*0.8, [130,130,130], 0.94);
        this.smokeCD = 0.03;
      }
    }
    // ¿hay línea recta libre de muros desde el misil hasta (tx,ty)? Muestrea el segmento con paso < caja mínima
    // (para no saltear muros finos) e ignora ignoreWall (la caja-blanco, que no debe contar como tapón de sí misma).
    // Muros sólidos Y cajas consumen al misil (Wall.process / Crate.process lo borran al impactar) → ambos tapan
    // lo que haya detrás. Cap de 80 pasos: a blancos lejanos sólo chequea el tramo cercano (igual reevalúa cada
    // frame al acercarse, así que se autocorrige cuando un tapón lejano entra en rango).
    clearPath(tx, ty, ignoreWall) {
      const dx = tx - this.x, dy = ty - this.y, dist = Math.hypot(dx, dy);
      if (dist < 1) return true;
      const n = Math.min(Math.ceil(dist / sper(0.016)), 80);
      for (let i = 1; i < n; i++) {                            // sin el extremo: sólo lo que hay ANTES del blanco
        const f = i/n, px = this.x + dx*f, py = this.y + dy*f;
        const bkt = wallBucketAt(px, py);   // grilla: solo los muros de la celda del punto
        if (bkt) for (let bi = 0; bi < bkt.length; bi++) { const w = bkt[bi]; if (w === ignoreWall) continue; if (px >= w.x && px <= w.x+w.width && py >= w.y && py <= w.y+w.height) return false; }
      }
      return true;
    }
    // DETONACIÓN en ÁREA: aplica daño de misil (×10) a todos los tanques del bando contrario dentro del radio de
    // la explosión (mismo radio que el dibujo en purge). Los que tengan ESCUDO activo quedan INMUNES al área. La
    // explosión visual la genera purge() al removerlo. Idempotente (this.detonated) por si lo gatilla más de un
    // blanco/muro el mismo frame.
    detonate() {
      if (this.detonated) return;
      this.detonated = true;
      const R = Math.max(this.radius * 9, sper(0.04)) * 1.6 * this.areaMult;     // radio LETAL = ~el fogonazo visible (el núcleo dibujado se infla ~2.4× → sin el 1.6 el daño quedaba chico vs el dibujo). ×areaMult con BIG MISSILES
      for (const t of tanks) {
        if (t.isPlayer === this.isPlayerShot) continue;    // mismo bando → no
        if (t.shielded || t.covered > 0) continue;         // escudo activo (propio o domo del Shielder) → inmune al área
        if (getDistSq([t.x,t.y],[this.x,this.y]) > R*R) continue;
        const isP = player && this.isPlayerShot;
        const atk = isP ? player.attack : this.attack;
        const mdmg = MAXHP*0.05*atk*t.defense*10;   // misil en HP reales
        t.health = Math.max(t.health - mdmg, 0);   // ×10: golpe de misil
        t.hitCD = 0.03;
        if (isP) dmgNum(t.x, t.y - t.radius, Math.max(1, Math.round(mdmg)), false, true);   // número de daño del misil = HP reales, CELESTE

        if (this.isPlayerShot && player) {
          player.score += 250;
          if (player.powerModeActiveTime <= 0) player.rage = Math.min(player.rage + 0.032 * (player.powerUps.fastRage ? 1.6 : 1) * (player.rageGain||1), 1);
        }
        if (t.isPlayer) { addShake(sper(0.006)); if (t.powerModeActiveTime <= 0) t.rage = Math.min(t.rage + 0.013, 1); }
        if (inView(t.x, t.y, 60)) burst(t.x, t.y, modifyColorPerc(this.color, 1.3), 10, sper(0.22), 0.45);
      }
      toRemove.add(this);
    }
    draw() {
      const tx = Math.cos(this.ang), ty = Math.sin(this.ang), r = this.radius;
      glow(this.x-tx*r*2, this.y-ty*r*2, r*2.8, [255,180,50], 0.5);   // llama del propulsor
      glow(this.x, this.y, r*2.4, this.color, 0.45);
      line(this.x-tx*r*4, this.y-ty*r*4, this.x, this.y, modifyColorPerc(this.color,0.7), r*1.5);  // cuerpo
      line(this.x-tx*r*4, this.y-ty*r*4, this.x, this.y, this.color, r*0.85);
      circle(this.x, this.y, r*1.1, modifyColorPerc(this.color,1.7));  // ojiva
      circle(this.x, this.y, r*0.5, [255,255,235]);
    }
  }

  // ════════════════ MUROS ════════════════
  class Wall {
    constructor(color) {
      this.color = color;
      // tiers de tamaño para ~30-40 muros en el mundo grande: unos pocos BLOQUES enormes (landmarks),
      // varios medianos, y el resto chicos (mismo espíritu que el 2/5 del original en la arena chica)
      const sz = walls.length;
      this.width = rnd(sz<4?xper(0.2):sz<14?xper(0.1):xper(0.05), sz<4?xper(0.3):sz<14?xper(0.125):xper(0.075));
      this.height = rnd(sz<4?yper(0.35):sz<14?yper(0.175):yper(0.1), sz<4?yper(0.5):sz<14?yper(0.225):yper(0.15));
      let tries = 0, ok = false;
      while (!ok && tries++ < 60) {
        this.x = rnd(xper(0.025), WORLD_W - this.width - xper(0.025));
        this.y = rnd(yper(0.042), WORLD_H - this.height - yper(0.042));
        ok = true;
        for (const w of walls) if (rectCollision([w.x,w.y,w.width,w.height],[this.x,this.y,this.width,this.height])) { ok = false; break; }
        // no caer encima de NINGÚN tanque (margen grande para el player) ni de lootboxes vivas — la arena
        // regenerada cada 5 oleadas dejaba jefes embebidos en muros y cajas indestructibles adentro
        if (ok) for (const t of tanks) {
          const m = t.isPlayer ? t.radius*8 : t.radius*2.5;
          if (rectCollision([t.x-m,t.y-m,m*2,m*2],[this.x,this.y,this.width,this.height])) { ok = false; break; }
        }
        if (ok) for (const b of lootBoxes) {
          if (rectCollision([b.x-b.radius*2,b.y-b.radius*2,b.radius*4,b.radius*4],[this.x,this.y,this.width,this.height])) { ok = false; break; }
        }
      }
      if (!ok) return;   // sin lugar válido tras 60 intentos: mejor un muro menos que uno encima de algo
      // Cuerpo estático en matter (rect centrado). El bloqueo de tanques lo resuelve el solver.
      this.body = Bodies.rectangle(this.x+this.width/2, this.y+this.height/2, this.width, this.height, { isStatic: true });
      World.add(world, this.body);
      walls.push(this);
    }
    process() {
      // El bloqueo tanque↔muro lo hace matter; acá solo destruimos los disparos que pegan en el muro.
      // AABB inline con escalares (sin array literals por par muro×shot — O(walls×shots) por frame).
      const wx = this.x, wy = this.y, wr = this.x + this.width, wb = this.y + this.height;
      for (const shot of shots) {
        if (toRemove.has(shot)) continue;
        const e = shot.radius*0.75, sl = shot.x - e, st = shot.y - e, sz = shot.radius*1.5;
        if (sl+sz > wx && sl < wr && st+sz > wy && st < wb) {
          if (shot.missile) shot.detonate(); else toRemove.add(shot);   // el misil EXPLOTA contra el muro (daño en área); el cañón se consume
        }
      }
    }
    draw() {
      const c = this.color, x = this.x, y = this.y, w = this.width, h = this.height;
      // cara: gradiente vertical (claro arriba → oscuro abajo) → bloque con volumen.
      // CACHEADO en el objeto: el muro es estático (pos/color fijos hasta regenerar la arena) → no recrear por frame.
      if (!this.grad) {
        this.grad = ctx.createLinearGradient(x, y, x, y+h);
        this.grad.addColorStop(0, rgb(modifyColorPerc(c,1.2))); this.grad.addColorStop(1, rgb(modifyColorPerc(c,0.62)));
      }
      ctx.fillStyle = this.grad; ctx.fillRect(x, y, w, h);
      // bisel: luz arriba/izquierda, sombra abajo/derecha
      ctx.lineWidth = Math.max(2, Math.min(w,h)*0.05);
      ctx.strokeStyle = rgb(modifyColorPerc(c,1.7));
      ctx.beginPath(); ctx.moveTo(x, y+h); ctx.lineTo(x, y); ctx.lineTo(x+w, y); ctx.stroke();
      ctx.strokeStyle = rgb(modifyColorPerc(c,0.38));
      ctx.beginPath(); ctx.moveTo(x+w, y); ctx.lineTo(x+w, y+h); ctx.lineTo(x, y+h); ctx.stroke();
      // contorno fino oscuro para separarlo del piso
      rectFill(x+0.5, y+0.5, w-1, h-1, modifyColorPerc(c,0.28), 1.5);
    }
  }

  // ════════════════ CAJA DESTRUCTIBLE ════════════════
  // Bloquea el paso (cuerpo estático de matter, vive en `walls` → la IA la esquiva y frena disparos) pero el
  // jugador la rompe a tiros (el misil de un toque) para abrir camino y soltar monedas. Se distingue del muro
  // por su material de madera/metal con aspas en X.
  class Crate {
    constructor() {
      this.color = randColorInRange(120,165,80,115,40,70);   // madera/metal cálido (distinto de los muros)
      this.breakable = true; this.broken = false;
      this.maxHealth = ri(3,5); this.health = this.maxHealth; this.hitCD = 0;
      const s = rnd(xper(0.035), xper(0.06)); this.width = s; this.height = s;   // cuadradas
      // grietas pseudo-fijas (no parpadean): se revelan, quebradas, a medida que baja la vida.
      // cada una: [midX,midY, endX,endY] en fracciones de la caja (centro→quiebre→punta).
      this.cracks = [];
      for (let i = 0; i < 5; i++) {
        const a = rnd(0, TAU), len = rnd(0.3, 0.48);
        const ex = 0.5 + Math.cos(a)*len, ey = 0.5 + Math.sin(a)*len;
        const mx = 0.5 + (ex-0.5)*0.5 + rnd(-0.09,0.09), my = 0.5 + (ey-0.5)*0.5 + rnd(-0.09,0.09);
        this.cracks.push([mx, my, ex, ey]);
      }
      let tries = 0, ok = false;
      while (!ok && tries++ < 40) {
        this.x = rnd(xper(0.03), WORLD_W - this.width - xper(0.03));
        this.y = rnd(yper(0.05), WORLD_H - this.height - yper(0.05));
        ok = true;
        for (const w of walls) if (rectCollision([w.x,w.y,w.width,w.height],[this.x,this.y,this.width,this.height])) { ok = false; break; }
        if (ok && player) { const m = player.radius*7; if (rectCollision([player.x-m,player.y-m,m*2,m*2],[this.x,this.y,this.width,this.height])) ok = false; }
      }
      if (!ok) return;
      this.body = Bodies.rectangle(this.x+this.width/2, this.y+this.height/2, this.width, this.height, { isStatic: true });
      World.add(world, this.body);
      walls.push(this);   // entra al array de muros → la IA la esquiva, frena LOS de enemigos, sale en el radar
    }
    process() {
      this.hitCD = Math.max(this.hitCD - dt, 0);
      const wx = this.x, wy = this.y, wr = this.x + this.width, wb = this.y + this.height;   // AABB inline (sin array literals por shot)
      for (const shot of shots) {
        if (toRemove.has(shot)) continue;
        const e = shot.radius*0.75, sl = shot.x - e, st = shot.y - e, sz = shot.radius*1.5;
        if (sl+sz > wx && sl < wr && st+sz > wy && st < wb) {
          if (shot.isPlayerShot) {                          // sólo el jugador la rompe; al enemigo le frena el tiro
            this.health -= shot.missile ? this.health : 1;  // el misil la revienta de un toque
            this.hitCD = 0.06; if (player) player.score += 5;
          }
          if (shot.missile) shot.detonate(); else toRemove.add(shot);   // el misil revienta la caja Y estalla en área
          if (this.health <= 0) break;
        }
      }
      if (this.health <= 0 && !this.broken) {
        this.broken = true;
        const cx = this.x+this.width/2, cy = this.y+this.height/2, cw = this.width;
        for (let i = 0; i < ri(2,10); i++) new Coin(cx, cy, ri(15,30));   // cantidad de monedas más variable
        // rotura con cuerpo: tablas claras rápidas + astillas oscuras grandes + polvillo brillante + fogonazo
        burst(cx, cy, modifyColorPerc(this.color, 1.5),  16, sper(0.36), 0.6,  sper(0.008));
        burst(cx, cy, modifyColorPerc(this.color, 0.65), 13, sper(0.2),  0.9,  sper(0.011));
        burst(cx, cy, [255,236,180], 9, sper(0.46), 0.34, sper(0.004));
        spawnPart(cx, cy, 0, 0, 0.16, cw*0.72, [255,240,205], 0.55);   // fogonazo central breve (pop)
        addShake(sper(0.0065));
        if (player) { player.score += 50; popup(cx, cy, '+50', [255,235,160], sper(0.02)); }
        toRemove.add(this);
      }
    }
    draw() {
      const x=this.x, y=this.y, w=this.width, h=this.height;
      const base = this.hitCD > 0 ? modifyColor(this.color,120) : this.color;
      ctx.fillStyle = rgb(modifyColorPerc(base,0.8)); ctx.fillRect(x,y,w,h);
      ctx.fillStyle = rgb(modifyColorPerc(base,1.12)); ctx.fillRect(x+w*0.12,y+h*0.12,w*0.76,h*0.76);   // panel interior
      ctx.strokeStyle = rgb(modifyColorPerc(base,0.55)); ctx.lineWidth = Math.max(2, w*0.09);           // aspas en X
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w,y+h); ctx.moveTo(x+w,y); ctx.lineTo(x,y+h); ctx.stroke();
      ctx.strokeStyle = rgb(modifyColorPerc(base,1.5)); ctx.lineWidth = Math.max(2, w*0.08);             // marco
      ctx.strokeRect(x+1.5,y+1.5,w-3,h-3);
      const dmg = 1 - this.health/this.maxHealth;                                                        // grietas quebradas según daño
      const n = Math.round(dmg * this.cracks.length);
      ctx.strokeStyle = rgb(modifyColorPerc(base,0.3)); ctx.lineWidth = Math.max(1, w*0.055);
      for (let i = 0; i < n; i++) { const c = this.cracks[i];
        ctx.beginPath(); ctx.moveTo(x+w*0.5, y+h*0.5); ctx.lineTo(x+w*c[0], y+h*c[1]); ctx.lineTo(x+w*c[2], y+h*c[3]); ctx.stroke(); }
    }
  }

  // ════════════════ MINA TRAMPA ════════════════
  // Estática; cuando un tanque (cualquiera) entra al radio de gatillo enciende la mecha (parpadeo rápido) y
  // explota en área. Por defecto aparece LEJOS del player (trampa para toparte). Lastima a player y enemigos.
  class Mine {
    constructor(x, y) {
      this.radius = sper(0.008); this.ang = rnd(0, TAU);
      this.trigger = this.radius*5.5; this.blast = this.radius*6;
      this.armCD = 1.2; this.fuse = 0;
      if (x === undefined) {
        const cx0 = player ? player.x : WORLD_W/2, cy0 = player ? player.y : WORLD_H/2;
        let tries = 0, ok = false;
        do {   // posición CRUDA (sin clampear): si cae fuera del mundo se DESCARTA y se reintenta → no se apilan contra la pared
          const a = rnd(0, TAU), d = rnd(xper(0.25), xper(0.7));
          this.x = cx0 + Math.cos(a)*d; this.y = cy0 + Math.sin(a)*d;
          ok = this.x > xper(0.05) && this.x < WORLD_W - xper(0.05) && this.y > yper(0.05) && this.y < WORLD_H - yper(0.05)
            && !walls.some(w => rectCollision([this.x-this.radius*2,this.y-this.radius*2,this.radius*4,this.radius*4],[w.x,w.y,w.width,w.height]))
            && !tanks.some(t => getDistSq([this.x,this.y],[t.x,t.y]) < (this.trigger*1.3)**2);   // no nacer encima de un tanque (gift-detona)
        } while (++tries < 25 && !ok);
        if (!ok) { this.x = clampN(this.x, xper(0.06), WORLD_W-xper(0.06)); this.y = clampN(this.y, yper(0.06), WORLD_H-yper(0.06)); }   // último recurso tras 25 intentos (raro)
      } else { this.x = x; this.y = y; }
      mines.push(this);
    }
    process() {
      this.armCD = Math.max(this.armCD - dt, 0);
      if (this.armCD > 0) return;
      if (this.fuse === 0) {
        for (const t of tanks) if (getDistSq([this.x,this.y],[t.x,t.y]) < this.trigger*this.trigger) { this.fuse = 0.55; break; }
      } else {
        this.fuse -= dt;
        if (this.fuse <= 0) this.detonate();
      }
    }
    detonate() {
      // estallido GRANDE y llamativo (como el del misil): boom naranja ~ al área de daño + núcleo de fuego + doble lluvia de chispas + sacudón fuerte
      const R = this.blast;
      new Explosion(this.x, this.y, R, [255,140,40]);                          // boom teñido naranja, tamaño del área
      new Explosion(this.x, this.y, R*0.55);                                   // segundo núcleo de fuego blanco-naranja
      burst(this.x, this.y, [255,180,60], 32, sper(0.62), 0.75, sper(0.007));  // lluvia de chispas (más y más rápidas)
      burst(this.x, this.y, [255,240,180], 14, sper(0.72), 0.45, sper(0.005)); // chispas claras veloces (glint)
      addShake(sper(0.013));
      for (const t of tanks) {
        if (getDist([this.x,this.y],[t.x,t.y]) >= this.blast) continue;
        if (t.isPlayer) { if (t.powerModeActiveTime === 0) { t.health = Math.max(t.health - (t.shielded?120:400), 0); t.hitCD = 0.04; } }
        else { t.health = Math.max(t.health - 500, 0); t.hitCD = 0.04; }   // mina: también lastima enemigos (HP)
      }
      toRemove.add(this);
    }
    draw() {
      const r = this.radius;
      ctx.globalAlpha = 0.25; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(this.x, this.y+r*0.3, r*1.1, r*0.7, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
      const fusing = this.fuse > 0;
      const blink = fusing ? (Math.sin(T*30) > 0) : (Math.sin(T*3) > 0.6);
      const body = fusing ? [130,24,24] : [62,66,74];
      for (let i = 0; i < 8; i++) { const a = this.ang + TAU*i/8;
        line(this.x+Math.cos(a)*r*0.7, this.y+Math.sin(a)*r*0.7, this.x+Math.cos(a)*r*1.28, this.y+Math.sin(a)*r*1.28, modifyColorPerc(body,0.75), r*0.3); }
      circle(this.x, this.y, r, modifyColorPerc(body,0.7));
      circle(this.x, this.y, r*0.66, modifyColorPerc(body,1.1));
      if (this.armCD <= 0) {                                  // luz central que late (roja; rápida con mecha)
        const lit = fusing || blink;
        glow(this.x, this.y, r*0.95, fusing?[255,40,30]:[255,90,40], fusing?0.6:0.3);
        circle(this.x, this.y, r*0.3, lit?[255,190,90]:[150,40,30]);
      }
    }
  }

  // ════════════════ MONEDA / EXPLOSIÓN ════════════════
  // Cara de moneda CACHEADA (1 sprite, paleta fija): se rastriza una vez y se blittea escalada al radio de cada
  // moneda → evita ~6 fills por moneda por frame (clave en los reventones de cofre con decenas de monedas en pantalla).
  let _coinSpr = null;
  function coinSprite() {
    if (_coinSpr) return _coinSpr;
    const S = 64, cv = document.createElement('canvas'); cv.width = S; cv.height = S;
    const g = cv.getContext('2d'), c = S/2, r = S/2;
    const disc = (rr, col) => { g.fillStyle = 'rgb('+col[0]+','+col[1]+','+col[2]+')'; g.beginPath(); g.arc(c, c, rr, 0, TAU); g.fill(); };
    disc(r, [205,150,12]);                                   // disco/canto exterior
    g.strokeStyle = 'rgb(150,104,8)'; g.lineWidth = r*0.12; g.beginPath(); g.arc(c, c, r*0.86, 0, TAU); g.stroke();   // ranura (relieve de moneda)
    disc(r*0.7, [255,225,90]);                               // cuerpo dorado
    disc(r*0.38, [255,248,200]);                             // centro pálido
    g.globalAlpha = 0.95; g.fillStyle = 'rgb(255,251,230)'; g.beginPath(); g.arc(c - r*0.26, c - r*0.26, r*0.17, 0, TAU); g.fill();   // brillo
    _coinSpr = cv; return cv;
  }
  class Coin {
    constructor(x,y,value) {
      this.x=x; this.y=y; this.ang=rnd(0,TAU);
      // POP de apertura: salen disparadas hacia afuera más fuerte y NO se dejan imantar durante openCD
      // (escalonado por moneda → cuando una caja revienta encima del player, no se van todas juntas de una;
      // primero se abren en abanico y después van entrando de a poco).
      this.vel=rnd(sper(0.1),sper(0.17));   // pop más corto → spawnean más juntas (la distancia ∝ vel², así que se acercan bastante)
      this.openCD=rnd(0.3,0.85); this.spawnT=0;
      this.value=value; this.radius=value*sper(0.02)/90; this.lifeSpan=ri(15,25);   // ~40% más chicas (la imantación las trae igual)
      this.blinkCD=0; this.grabbed=false; this.accounted=false; this.repositioned=false;
      coins.push(this);
    }
    process() {
      this.lifeSpan -= dt; if (this.lifeSpan <= 0) toRemove.add(this);
      this.spawnT += dt;
      this.openCD = Math.max(this.openCD - dt, 0);
      this.x += Math.cos(this.ang)*this.vel*dt; this.y += Math.sin(this.ang)*this.vel*dt;
      this.vel = Math.max(this.vel - sper(0.13)*dt, 0);   // frena el pop (proporcional a la pantalla)
      this.x = clampN(this.x, this.radius, WORLD_W-this.radius);
      this.y = clampN(this.y, this.radius, WORLD_H-this.radius);
      // si quedó DENTRO de un muro/caja, reubicarla por fuera al punto más cercano (cara más próxima del rectángulo).
      // EXCEPTO si la está imantando el player (grabbed): durante el agarre ignora los muros y vuela derecho hacia vos.
      const bkt = this.grabbed ? null : wallBucketAt(this.x, this.y);
      if (bkt) for (let k = 0; k < bkt.length; k++) { const w = bkt[k];
        if (this.x >= w.x && this.x <= w.x+w.width && this.y >= w.y && this.y <= w.y+w.height) {
          const dl = this.x-w.x, drr = w.x+w.width-this.x, dtp = this.y-w.y, db = w.y+w.height-this.y, m = Math.min(dl,drr,dtp,db);
          if (m === dl) this.x = w.x - this.radius; else if (m === drr) this.x = w.x+w.width + this.radius;
          else if (m === dtp) this.y = w.y - this.radius; else this.y = w.y+w.height + this.radius;
          if (!this.repositioned) { this.vel = 0; this.repositioned = true; }   // la 1ª vez que se la reubica pierde toda la velocidad del pop (no rebota contra el muro)
          break;
        }
      }
      if (this.lifeSpan < 5) this.blinkCD += dt;
      if (this.blinkCD > 0.2) this.blinkCD = 0;
    }
    draw() {
      const pop = Math.min(1, this.spawnT/0.18);                 // escala de aparición
      const r = this.radius * (0.45 + 0.55*pop);
      const dy = this.y + Math.sin(T*3.5 + this.ang) * r * 0.45; // flotación sutil arriba/abajo (fase propia) → se nota y "vive"
      const dim = this.lifeSpan < 5 && this.blinkCD >= 0.1;       // parpadeo apagado cerca de expirar
      if (dim) { circle(this.x, dy, r, [70,58,8]); circle(this.x, dy, r*0.6, [115,95,20]); return; }
      glow(this.x, dy, r*1.15, [255,205,55], 0.16);          // halo apenas (aditivo, se mantiene → stacking entre monedas solapadas)
      // cara PRE-RENDERIZADA (mismas capas que el ícono del shop): 1 blit escalado al radio, en vez de ~6 fills por moneda
      ctx.drawImage(coinSprite(), this.x - r, dy - r, r*2, r*2);
    }
  }
  // Estallido estilo FireworksWeb: fogonazo blanco-caliente (bloom gaussiano) + onda expansiva + una lluvia de
  // CHISPAS con física (velocidad/drag), cada una con su bloom aditivo (los solapados acumulan luz), núcleo que
  // nace blanco y vira al color del fuego, y glint de estrella en las más calientes. Todo ∝ radio: los impactos
  // chicos de bala quedan en un fogonazo sin chispas; muertes/minas/misiles esparcen la lluvia completa.
  // Con tint (opcional) el estallido se TIÑE con ese color (la onda, el remanente y las chispas no-calientes) →
  // las muertes de enemigos explotan en SU color. Sin tint, fuego cálido normal. Firma vieja sigue válida.
  class Explosion {
    constructor(x, y, radius, tint = null) {
      this.x = x; this.y = y;
      this.startRadius = radius; this.radius = radius;
      this.life = 0;
      this.maxLife = clampN(radius / sper(0.04), 0.34, 0.85);    // dura ∝ tamaño
      this.flash = 1;                                            // fogonazo inicial (decae rápido)
      this.color = tint ? tint.slice() : [255, ri(150, 205), ri(30, 75)];   // tint → boom de color (enemigo); si no, fuego
      this.sparks = [];
      const n = clampN(Math.round(radius / sper(0.002)) - 1, 0, 34);   // 0 chispas en impactos chicos de bala
      for (let i = 0; i < n; i++) {
        const a = rnd(0, TAU), sp = radius * rnd(8, 20);         // velocidad radial (mezcla lentas/rápidas)
        const hot = Math.random() < 0.45;                        // ~mitad calientes (blanco-amarillo, con glint)
        const life = this.maxLife * rnd(0.55, 1);
        this.sparks.push({
          x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
          size: radius * rnd(0.12, 0.26), drag: rnd(0.78, 0.88),
          life, maxLife: life, hot,
          color: hot ? [255, 236, 184] : (tint ? modifyColorPerc(tint, 1.2) : [255, ri(120, 190), ri(20, 70)]),
        });
      }
      explosions.push(this);
    }
    process() {
      this.life += dt;
      this.radius = this.startRadius * (1 + 1.6 * (this.life / this.maxLife));   // onda expansiva ∝ tamaño
      this.flash = Math.max(this.flash - dt / 0.1, 0);
      for (const s of this.sparks) {
        s.life -= dt;
        const dr = Math.pow(s.drag, fr);
        s.vx *= dr; s.vy *= dr;
        s.x += s.vx * dt; s.y += s.vy * dt;
      }
      if (this.life >= this.maxLife) toRemove.add(this);
    }
    draw() {
      const lifeF = clampN(1 - this.life / this.maxLife, 0, 1);
      // fogonazo blanco-caliente que se hincha y se apaga, + remanente cálido que decae con la vida
      if (this.flash > 0) bloom(this.x, this.y, this.startRadius * (2.4 + 2.4*(1 - this.flash)), [255, 246, 222], 0.55 * this.flash);
      bloom(this.x, this.y, this.startRadius * (1.4 + 1.5*(1 - lifeF)), this.color, 0.4 * lifeF);
      // onda expansiva: aro fino y brillante que se abre y se desvanece
      if (lifeF > 0.02) {
        ctx.globalAlpha = lifeF * lifeF;
        circle(this.x, this.y, this.radius, modifyColorPerc(this.color, 1.7), Math.max(1, this.startRadius * 0.16 * lifeF));
        ctx.globalAlpha = 1;
      }
      // chispas: bloom aditivo + núcleo (blanco caliente joven → vira al color) + glint de estrella
      const sbloom = IS_TOUCH ? 3.1 : 4.5;   // mobile: bloom de chispa más ceñido → ~2× menos overdraw aditivo (desktop intacto)
      for (const s of this.sparks) {
        const lf = clampN(s.life / s.maxLife, 0, 1);
        if (lf <= 0.01) continue;
        const b = Math.pow(lf, 1.5);
        const r = Math.max(0.4, s.size * (0.45 + 0.55*lf));
        bloom(s.x, s.y, r * sbloom, s.color, b * 0.5);
        const w = s.hot ? (0.4 + 0.6*lf) : 0.3*lf;
        const c0 = s.color;
        ctx.globalAlpha = Math.min(1, b * 1.1);
        circle(s.x, s.y, r, [ (c0[0]+(255-c0[0])*w)|0, (c0[1]+(255-c0[1])*w)|0, (c0[2]+(255-c0[2])*w)|0 ]);
        ctx.globalAlpha = 1;
        if (s.hot && b > 0.6) {                                   // glint sólo en lo más brillante
          const fr2 = r * (3 + 4*(b - 0.6)/0.4), a0 = ctx.globalAlpha;
          ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(0.5, (b - 0.6) * 1.1);
          ctx.drawImage(flareSprite(), s.x - fr2, s.y - fr2, fr2*2, fr2*2);
          ctx.globalAlpha = a0; ctx.globalCompositeOperation = 'source-over';
        }
      }
    }
  }

  // ════════════════ LOOTBOX (port del Pygame) ════════════════
  // Caja que gira, vive 30s (se va a los 10), se rompe con disparos del player y dropea: power (10%),
  // botiquín (20%) o monedas (70%). +100 al score POR DISPARO que conecta (×10 hits = 1000, como el original).
  class LootBox {
    constructor() {
      this.ang = rnd(0, TAU);
      this.angVel = (Math.random() < 0.5 ? -1 : 1) * rnd(sper(0.002), sper(0.005));
      this.startRadius = sper(0.0192); this.radius = this.startRadius;
      this.lifeSpan = 30; this.health = 10; this.hitCD = 0; this.destroyed = false;
      // Cadencia GARANTIZADA (no random): cada 10ª caja = POWER, cada 3ª = VIDA, el resto = ORO. Así el jugador
      // sabe que aparece una vida cada 3 cajas y una mejora cada 10. En pelea de jefe, toda caja que no sea power
      // cae como botiquín (heal fiable). Contador por run (manager.lootCount, reseteado al crear el manager).
      const k = manager.lootCount = (manager.lootCount || 0) + 1;
      this.boxType = (k % 10 === 0) ? 'power' : (k % 3 === 0 || manager.bossWave) ? 'firstAid' : 'coin';
      // posición SIEMPRE dentro de la vista actual (rect de cámara con margen) → la ves aparecer; libre de muros/tanques
      const mgx = W*0.13, mgy = H*0.13;
      let tries = 0;
      do {
        this.x = clampN(camX + rnd(mgx, W - mgx), xper(0.05), WORLD_W - xper(0.05));
        this.y = clampN(camY + rnd(mgy, H - mgy), yper(0.05), WORLD_H - yper(0.05));
        var bad = walls.some(w => rectCollision([this.x-this.radius*1.5, this.y-this.radius*1.5, this.radius*3, this.radius*3], [w.x,w.y,w.width,w.height]))
               || tanks.some(t => rectCollision([this.x-this.radius*1.5, this.y-this.radius*1.5, this.radius*3, this.radius*3], [t.x-t.radius, t.y-t.radius, t.radius*2, t.radius*2]));
        if (!bad && player && getDistSq([this.x,this.y],[player.x,player.y]) < (this.radius*5)**2) bad = true;   // tampoco encima del jugador
      } while (bad && ++tries < 40);
      lootBoxes.push(this);
    }
    process() {
      this.lifeSpan -= dt;
      if (this.lifeSpan <= 10) { toRemove.add(this); return; }
      this.hitCD = Math.max(this.hitCD - dt, 0);
      this.ang += this.angVel * dt;
      for (const shot of shots) {
        if (toRemove.has(shot)) continue;
        if (shot.isPlayerShot && getDistSq([shot.x,shot.y],[this.x,this.y]) < this.radius*this.radius) {
          this.health -= shot.missile ? this.health : 1;   // el MISIL la revienta de un toque; el cañón le saca 1
          this.hitCD = 0.05;
          if (player) player.score += 100;
          toRemove.add(shot);
          if (this.health <= 0) break;                      // ya reventó: no malgastar más disparos este frame
        }
      }
      if (this.health <= 0 && !this.destroyed) {
        if (this.boxType === 'power' && player) {
          // DRAFT: elegí 1 de hasta 3 mejoras que aún no tenés (congela el juego). Si ya las tenés TODAS (o el mutador
          // No Power-ups está activo) → ORO.
          const unowned = POWER_UPS.filter(u => !player.powerUps[u.id]);
          if (unowned.length && !player.noPowerups) {
            const pool = unowned.slice(), opts = [];
            for (let i = 0; i < 3 && pool.length; i++) opts.push(pool.splice(ri(0, pool.length - 1), 1)[0]);
            openDraft(opts);
            popup(this.x, this.y, 'UPGRADE!', [205,130,255], sper(0.026));
          } else {                                                    // todas las mejoras → cofre de ORO
            for (let i = 0; i < ri(35, 50); i++) new Coin(this.x, this.y, ri(45, 75));
            popup(this.x, this.y, 'GOLD!', [255,215,60], sper(0.028));
          }
        }
        else if (this.boxType === 'firstAid' && player) { const wasFull = player.health >= player.maxHealth; player.health = Math.min(player.health + 0.33*player.maxHealth, player.maxHealth*2); popup(this.x, this.y, wasFull ? '+EXTRA HP' : '+HP', wasFull ? [120,235,255] : [100,255,0], sper(0.022)); }   // +33% de vida; overheal hasta 2×
        else if (this.boxType === 'coin') { for (let i = 0; i < ri(17,25); i++) new Coin(this.x, this.y, ri(20,40)); popup(this.x, this.y, '$$$', [255,255,0], sper(0.022)); }
        burst(this.x, this.y, this.boxType === 'power' ? randColor() : this.boxType === 'firstAid' ? [100,255,0] : [255,210,60], 16, sper(0.25), 0.7);
        addShake(sper(0.004));
        this.destroyed = true; toRemove.add(this);
      }
      this.radius = this.lifeSpan * this.startRadius / 30 + (this.hitCD > 0 ? rnd(this.radius*0.25, this.radius*0.5) : 0);
    }
    draw() {
      const isPow = this.boxType === 'power', isAid = this.boxType === 'firstAid';
      const base = isPow ? [180,80,255] : isAid ? [80,230,90] : [210,150,60];   // colores fijos (legibles)
      const dim = this.lifeSpan < 10.25;
      const col = dim ? [95,95,95] : this.hitCD > 0 ? modifyColor(base,120) : base;
      const r = this.radius, a = this.ang;
      // parpadeo de AVISO de expiración en los últimos ~3s (se va a los 10s de vida)
      const blink = (!dim && this.lifeSpan < 13) ? (0.45 + 0.55*Math.abs(Math.sin(T*8))) : 1;
      ctx.globalAlpha = blink;
      if (!dim) glow(this.x, this.y, r*2.1, col, 0.28 + 0.12*Math.sin(T*4));     // glow pulsante
      // caja: placa redondeada rotada con gradiente + marco brillante + brillo glossy
      ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(a);
      const g = ctx.createLinearGradient(0, -r, 0, r);
      g.addColorStop(0, rgb(modifyColorPerc(col,1.5))); g.addColorStop(1, rgb(modifyColorPerc(col,0.55)));
      ctx.fillStyle = g; roundRectPath(-r*0.8, -r*0.8, r*1.6, r*1.6, r*0.22); ctx.fill();
      ctx.strokeStyle = rgb(modifyColorPerc(col,2)); ctx.lineWidth = Math.max(1.5, r*0.14);
      roundRectPath(-r*0.8, -r*0.8, r*1.6, r*1.6, r*0.22); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.25; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-r*0.2, -r*0.3, r*0.42, r*0.26, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
      // símbolo derecho (no rota → siempre legible)
      const symbol = isPow ? 'P' : isAid ? '+' : '$';
      textGlow(symbol, dim ? [140,140,140] : [255,255,255], this.x, this.y, r*1.25, 'center');
      ctx.globalAlpha = 1;   // limpiar el alpha del parpadeo de expiración
    }
  }

    process() {
      if (manager.gameover) return;

      }

      manager.mineCD = Math.max(manager.mineCD - dt, 0);

        new Mine();
        manager.mineCD = manager.hardMode ? ri(8, 16) : ri(12, 22);

      if (!manager.bossWave) {

        if (manager.eventCD === 0) { fireEvent(); manager.eventCD = ri(45, 75); }

    },
    // wave = [waveTime, [Tipo, cant], [Tipo, cant], ...] → oleadas MIXTAS (varios tipos a la vez).
    callWave(wave) {
      const regen = manager.waveNumber % 5 === 0;   // cada 5 oleadas: arena nueva con un BIOMA distinto
      const isFinalWave = manager.waveNumber === manager.waveList.length - 1;   // última de la lista (WAVE 50: jefe final)
      const finalMul = (isFinalWave && manager.endless) ? Math.max(1, manager.endlessLevel) : 1;   // en Sin Fin, la 50 trae tantos jefes finales como el nivel
      if (regen) {
        clearWalls(); mines.length = 0;        // las minas viejas quedarían dentro del layout nuevo
        const bio = BIOMES[ri(0, BIOMES.length - 1)]; manager.biome = bio.name;
        manager.wallColor = randColorInRange(50,255,50,255,50,255);

        for (let i = 0; i < ri(bio.crates[0], bio.crates[1]); i++) new Crate();   // cajas destructibles
        for (let i = 0; i < ri(bio.mines[0],  bio.mines[1]);  i++) new Mine();    // minas trampa
        genDeco();
      }
      manager.waveNumber = (manager.waveNumber + 1) % manager.waveList.length;
      manager.waveCount++;   // contador monótono de oleadas (para logros; no se reinicia con el loop)
      manager.waveTime = wave[0];
      manager.bgTarget = waveBgColor(wave, manager.waveList[manager.waveNumber]);   // el piso vira al color de esta oleada + la siguiente
      const groups = wave.slice(1);
      // banner (aviso especial si la oleada trae un jefe / el jefe final; si no y es arena nueva, el bioma)
      const hasFinal = groups.some(g => g[0] === 'FinalBoss');
      const hasBoss  = groups.some(g => BOSS_TYPES.has(g[0]));
      manager.bossWave = hasBoss;   // las oleadas de jefe (waveTime 3600) igual sueltan lootboxes (heal) — ver gate abajo
      if (manager.hardMode && !hasBoss) manager.waveTime *= 0.65;   // HARDCORE: las oleadas (no-jefe) llegan ~35% antes (presión de ritmo)
      manager.banner = {
        text: 'WAVE ' + (manager.waveNumber === 0 ? manager.waveList.length : manager.waveNumber),
        sub: hasFinal ? (finalMul > 1 ? 'FINAL BOSS ×' + finalMul + '!!' : 'FINAL BOSS!!') : hasBoss ? 'BOSS!' : (regen ? manager.biome : ''),
        t: 0,
      };
      // spawn por grupos. Mooks: cantidad TAL CUAL en Normal (oleadas bien pobladas), ×1.6 en Hardcore. Los
      // élites/jefes (BOSS_TYPES) NO se inflan. Tope global MAX_ENEMIES (las oleadas se acumulan en pantalla).
      const affixChance = (manager.hardMode ? 0.30 : 0.12) * manager.affixMul;   // Hardcore: muchos más élites; Swarm los suprime (affixMul 0.4)
      // ESCALADO POR PROGRESO — waveCount es MONÓTONO (sube toda la run Y el endless). Los enemigos se vuelven más
      // TANQUES con el tiempo → hace falta MÁS DAÑO → las UPGRADES importan y se sienten; el oro/score acompaña para
      // poder bancarlas. El daño enemigo sube poco (tope) para que no se vuelva un one-shot. Reemplaza al viejo escalado
      // sólo-endless (que tocaba defense): ahora la dureza vive en HP, parejo en run normal + endless.
      const wc = manager.waveCount;
      const hpScaleMook = 1 + (wc - 1) * 0.03;                   // wave 50 ≈ 2.5× HP de mook (suavizado de 0.045 → la curva no se despega del daño del player)
      const hpScaleBoss = 1 + (wc - 1) * 0.015;                  // jefes escalan más suave todavía (ya son enormes)
      const atkScaleMook = Math.min(1 + (wc - 1) * 0.008, manager.hardMode ? 1.7 : 1.35); // daño de mook (tope 1.35×; 1.7× en Hardcore = pegan más fuerte)
      const rewardScale  = 1 + (wc - 1) * 0.045;                 // score acompaña la dificultad
      const coinScale    = 1 + (wc - 1) * 0.025;                 // oro acompaña (un poco más suave) → bancás upgrades
      const countScale   = manager.endless ? 1 + manager.endlessLevel * 0.15 : 1;   // SÓLO endless: grupos más grandes (tope MAX_ENEMIES)
      const hardHp = manager.hardMode ? 1.5 : 1;                 // HARDCORE: mooks +50% HP (más tanques, NO más cantidad). Swarm baja HP vía enemyHpMul
      for (const [type, count] of groups) {
        const boss = BOSS_TYPES.has(type);
        let n = boss ? count * finalMul : Math.round(count * manager.enemyCountMul * countScale);   // cantidad: Swarm (enemyCountMul) + endless. Hardcore ya NO infla. Jefes de la 50 ×nivel de Sin Fin (finalMul)
        if (!boss) n = Math.max(1, Math.round(n * MOBILE_SPAWN));   // mobile: ~3/4 de los mooks (jefes intactos)
        for (let i = 0; i < n; i++) {
          if (enemies.length >= MAX_ENEMIES) break;
          const e = new ENEMY_TYPES[type]();
          if (manager.enemySpeedMul !== 1) e.moveSpeed *= manager.enemySpeedMul;   // mutador Frenesí
          e.maxHealth *= boss ? hpScaleBoss : hpScaleMook * hardHp * manager.enemyHpMul; e.health = e.maxHealth;   // progreso × Hardcore(1.5) × Swarm(0.55), sólo mooks
          if (!boss) { e.attack *= atkScaleMook; if (e.startAttack !== undefined) e.startAttack *= atkScaleMook; }
          e.scoreValue = Math.round(e.scoreValue * rewardScale);
          if (e.dropCoins) e.dropCoins = Math.round(e.dropCoins * coinScale);
          if (!boss && Math.random() < affixChance) applyAffix(e);   // élite raro y marcado (sobre el escalado)
        }
      }
    },
  };

  // ════════════════ INPUT ════════════════
  // Movimiento = UNA palanca omnidireccional (joystick izq en mobile, WASD/flechas en desktop): su dirección
  // es la dirección en que se mueve el tanque y hacia donde apunta el cuerpo.
  // Apuntado/disparo aparte: mouse en desktop, tocar la pantalla en mobile.
  // Boost/misil por botones. El joystick suma al teclado; el touch suma al mouse.
  const keys = new Set();
  let aimX = WORLD_W/2, aimY = WORLD_H/2;         // punto de mira en coords de MUNDO (placeholder: startGame lo re-siembra)
  let mouseSX = -1, mouseSY = -1;                 // último mouse en coords de PANTALLA: la mira se re-ancla a él
                                                  // cada frame (si la cámara panea con el mouse quieto, el
                                                  // crosshair queda bajo el cursor igual). -1 = modo touch.
  let aimLockTarget = null;                       // blanco enganchado por el imán (para el marcador de lock-on)
  let mouseLeft = false, mouseRight = false;
  const canvasPointers = new Map();               // pointers táctiles sobre el canvas → disparan apuntando
  const btnState = { missile: false, boost: false };
  const moveVec = { x: 0, y: 0 };                 // palanca de movimiento (hand-rolled), y en coords pantalla (+ abajo)
  const aimVec  = { x: 0, y: 0, active: false };  // palanca de puntería (hand-rolled, mobile): dirección de la mira + dispara
  let aimDown = false;                            // palanca der TOCADA → dispara aunque la aprietes en el centro (sin zona muerta)

  function readInput() {
    // vector de movimiento: teclado (4 direcciones) + palanca, clampeado a magnitud 1
    let mx = (keys.has('d')||keys.has('arrowright')?1:0) - (keys.has('a')||keys.has('arrowleft')?1:0) + moveVec.x;
    let my = (keys.has('s')||keys.has('arrowdown')?1:0)  - (keys.has('w')||keys.has('arrowup')?1:0)   + moveVec.y;
    const m = Math.hypot(mx, my);
    if (m > 1) { mx /= m; my /= m; }
    // Mira en coords de MUNDO. Desktop: re-anclada al cursor cada frame (pantalla→mundo con la cámara
    // actual). Touch: anclada al mundo y movida por la palanca, pero siempre clampeada a la VISTA para que
    // el crosshair nunca se vaya de pantalla cuando la cámara panea.
    if (mouseSX >= 0) { aimX = camX + mouseSX; aimY = camY + mouseSY; }
    else { aimX = clampN(aimX, camX, camX + W); aimY = clampN(aimY, camY, camY + H); }
    // Palanca de puntería (mobile): mueve la MIRA SOBRE EL MAPA (no fija al tanque). Con ZONA MUERTA: cerca
    // del centro no mueve; recién al pasar AIM_DEAD empieza, ramping de 0 a AIM_SPEED en los extremos.
    if (aimVec.active) {
      const am = Math.hypot(aimVec.x, aimVec.y);
      if (am > AIM_DEAD) {
        const k = (am - AIM_DEAD) / (1 - AIM_DEAD);          // 0..1 más allá de la zona muerta
        const sp = sper(AIM_SPEED) * k * dt;
        aimX = clampN(aimX + (aimVec.x / am) * sp, camX, camX + W);
        aimY = clampN(aimY + (aimVec.y / am) * sp, camY, camY + H);
      }
    }
    // LOCK / IMÁN de puntería. Blancos "lockeables" en cámara: ENEMIGOS, LOOTBOXES y CAJAS DESTRUCTIBLES.
    // - Touch: cuando la mira ya está cerca, el imán la engancha suave (fuerza escalada por la palanca: a
    //   fondo suelta, así cambiás de blanco). El anillo de lock aparece mientras el imán manda.
    // - Desktop: NO hay imán; el anillo aparece cuando la mira (cursor) está SOBRE el blanco.
    // aimLockTarget guarda un snapshot {x,y,r} (centro + radio para el anillo del HUD).
    aimLockTarget = null;
    {
      let bcx = 0, bcy = 0, brad = 0, bd = Infinity;
      const scan = (cx, cy, r) => { if (!inView(cx, cy, 0)) return; const d = getDistSq([aimX, aimY], [cx, cy]); if (d < bd) { bd = d; bcx = cx; bcy = cy; brad = r; } };
      for (const e of enemies) scan(e.x, e.y, e.radius);
      for (const b of lootBoxes) scan(b.x, b.y, b.radius);
      for (const w of walls) if (w.breakable) scan(w.x + w.width/2, w.y + w.height/2, Math.max(w.width, w.height)*0.6);   // cajas
      if (brad > 0) {
        if (IS_TOUCH) {
          const r = sper(AIM_MAGNET_RANGE);
          if (bd < r * r) {
            const push = aimVec.active ? clampN((Math.hypot(aimVec.x, aimVec.y) - AIM_DEAD) / (1 - AIM_DEAD), 0, 1) : 0;
            const k = (1 - Math.pow(1 - AIM_MAGNET, fr)) * (1 - push);   // empujando a fondo → imán 0
            aimX += (bcx - aimX) * k; aimY += (bcy - aimY) * k;
            if (push < 0.6) aimLockTarget = { x: bcx, y: bcy, r: brad };
          }
        } else {
          const lockR = brad * 2.2;                            // desktop: anillo si el cursor está sobre el blanco
          if (bd < lockR * lockR) aimLockTarget = { x: bcx, y: bcy, r: brad };
        }
      }
    }
    return {
      moveX: mx, moveY: my,
      aimX, aimY,
      primary: mouseLeft || canvasPointers.size > 0 || aimVec.active || aimDown,
      missile: mouseRight || btnState.missile,
      boost: keys.has('shift') || btnState.boost,
      rage: keys.has('q'),   // mobile: la furia se activa tocando la barra (no hay botón)
    };
  }

  // la pantalla al sistema rotado: stageX = clientY, stageY = innerW - clientX.
  function logicalPos(e) {
    let sx, sy;
    if (stageRot === 90) { sx = e.clientY; sy = window.innerWidth - e.clientX; }
    else { const r = canvas.getBoundingClientRect(); sx = e.clientX - r.left; sy = e.clientY - r.top; }

    tryAutoFs(e);

    // RAGE en mobile: tocar la barra (cuando está LLENA) la descarga — sin botón. Zona generosa (incluye el "◄ Rage").
    if (e.pointerType !== 'mouse' && rageBar && player) {
      const padX = sper(0.02), padY = sper(0.03);
      if (px >= rageBar.x - padX && px <= rageBar.x + rageBar.w + sper(0.14) && py >= rageBar.y - padY && py <= rageBar.y + rageBar.h + padY) {
        if (player.rage >= 1 && player.powerModeActiveTime <= 0) tryActivateRage();   // llena → descarga la furia
        return;   // SIEMPRE consume el toque en la franja de la barra → no mueve la mira (esté llena o no)
      }

    if (e.pointerType === 'mouse') {
      mouseSX = px; mouseSY = py; aimX = camX + px; aimY = camY + py;
      // Estado de botones desde el bitmask e.buttons (bit 0 = izq, bit 1 = der). Apretar un botón con OTRO ya
      // sostenido NO dispara pointerdown (llega como pointermove con buttons actualizado), así que el bitmask
      // se relee también en move/up → podés tirar el misil (click der) sin soltar el cañón (click izq).
      mouseLeft = (e.buttons & 1) !== 0;
      mouseRight = (e.buttons & 2) !== 0;
    } else {
      // La franja SUPERIOR (~18%) no la cubre ninguna palanca (#jMove/#jAim van de 82% para abajo) → los toques en
      // el HUD (vida/escudo/rage/score/minimapa) llegaban acá y agarraban/disparaban la mira. En táctil se apunta
      // con la palanca der, así que ignoramos esos toques de la franja del HUD (no mueven ni disparan la mira).
      if (py < H * 0.18) return;

  // Cada compra: si alcanza la plata y el nivel ≤ MAXLVL, descuenta, aplica el stat, y la próxima cuesta +17%.

  function applyUpgrade(key) {
    const p = player; if (!p) return;
    switch (key) {
      // SIN TOPES en los stats: cada nivel aplica su efecto COMPLETO (lo único que limita el total es MAXLVL + el costo).
      case 'dmg':    p.regAttack *= 1.05; p.attack = p.regAttack; break;
      case 'as':     p.regPrimaryShotAS *= 0.972; p.primaryShotAS = p.regPrimaryShotAS; break;
      case 'crit':   p.critChance = (p.critChance||0) + 0.03334; break;
      case 'critdmg':p.critMult = (p.critMult||2) + 0.0278; break;
      case 'as2':    p.regSecondaryShotAS *= 0.95; p.secondaryShotAS = p.regSecondaryShotAS; break;
      case 'def':    p.regDefense *= 0.96; p.defense = p.regDefense; break;
      case 'shcap':  p.shieldAugment += 0.5; break;

      case 'greed':  p.coinGain = (p.coinGain||1) * 1.02; break;           // codicia: las monedas valen más
      case 'vamp':   p.lifesteal += 2; break;                             // vampirismo: +6 HP por kill (máx +108 de un pool de 1000)
      case 'ragegn': p.rageGain = (p.rageGain||1) * 1.01; break;          // furia: la barra carga más rápido
    }

  function buyUpgrade(u) {

  // ── PALANCA ANALÓGICA hand-rolled (reemplaza nipplejs) ──
  // Aparece donde tocás dentro de su zona y se dibuja con DOM (base + nub). Robusta ante multitouch vía
  // setPointerCapture: TODOS los eventos del dedo (move/up/cancel) vuelven siempre a la zona → nunca queda

  function createJoystick(zoneEl, opts) {

  function drawDebugHUD() {

  function purge() {

        if (inView(s.x, s.y, 200)) {

  let lastT = performance.now();

      if (player && prevPX !== null && mouseSX < 0 && !aimLockTarget) { aimX += player.x - prevPX; aimY += player.y - prevPY; }

      for (const b of lootBoxes) b.process();

    const camRect = [camX - 60, camY - 60, W + 120, H + 120];
    for (const w of walls) if (rectCollision(camRect, [w.x, w.y, w.width, w.height])) w.draw();
    for (const m of mines) if (inView(m.x, m.y, m.radius*6)) m.draw();
    for (const b of lootBoxes) if (inView(b.x, b.y, b.radius*4)) b.draw();
    for (const c of coins) if (inView(c.x, c.y, c.radius*4)) c.draw();   // monedas DEBAJO de los tanques (sobre piso/loot)
    for (const t of tanks) if (t.isPlayer || inView(t.x, t.y, t.radius*5)) t.draw();
    for (const s of shots) if (inView(s.x, s.y, s.radius*12)) s.draw();
    for (const e of explosions) if (inView(e.x, e.y, e.radius + 80)) e.draw();

      btnInfo.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation();
        const show = !fpsBox.classList.contains('show');
        fpsBox.classList.toggle('show', show); btnInfo.classList.toggle('on', show);
      });
    })();
  </script>
  </div><!-- /#stage -->
</body>
</html>
