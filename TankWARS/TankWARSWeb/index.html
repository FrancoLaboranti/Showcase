  <!-- Física rígida (matter-js 0.19.0, vendorizado) para los cuerpos: tanques (dinámicos) y muros
       (estáticos). El manejo/apuntado/disparo/IA/daño siguen siendo hand-rolled. -->
  <script src="matter.min.js"></script>
  <script>
  // ════════════════════════════════════════════════════════════════════
  //  TankWARS — port web del shooter de tanques (Pygame → Canvas 2D).
  //  Slice jugable: player, 4 enemigos básicos, oleadas, muros, monedas,
  //  misiles stackeables, escudo auto, boost. Se juega en HORIZONTAL.
  //  Controles: desktop = WASD/flechas (mover) + mouse (apuntar/disparar).
  //  Mobile = una palanca omnidireccional (mover) + tocar la pantalla
  //  (apuntar/disparar) + botones de misil/boost.
  // ════════════════════════════════════════════════════════════════════
  const TAU = Math.PI * 2;
  const mod = (a, n) => ((a % n) + n) % n;
  const ri  = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ── PERSISTENCIA (localStorage): mejores puntajes, logros, cosméticos desbloqueados ──
  const SAVE_KEY = 'tankwars_save_v1';
  let SAVE = (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } })();
  SAVE.best    = SAVE.best    || {};   // mejor score por modo (normal/hard/endless)
  SAVE.ach     = SAVE.ach     || {};   // logros desbloqueados (id → true)
  SAVE.unlocks = SAVE.unlocks || {};   // cosméticos desbloqueados (colores extra)
  function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }
  // FURIA: descarga el power-mode si la barra está llena. La dispara la tecla Q (desktop) o tocar la barra (mobile).
  let rageBar = null;   // rect en coords lógicas de la barra de furia del HUD (para detectar el toque)
  function tryActivateRage() {
    if (player && player.rage >= 1 && player.powerModeActiveTime <= 0) {
      player.powerModeActiveTime = RAGE_DURATION; player.rage = 0; player.secondaryShotCD = 0;
      popup(player.x, player.y - player.radius*2, 'RAGE!', randColor(), sper(0.03)); addShake(sper(0.011));
    }
  }
  // ── RNG SEMBRABLE (mulberry32): si hay semilla activa, pisa Math.random → la generación del mundo (arena,
  // lootboxes, afijos, eventos) queda reproducible. Sin semilla, Math.random nativo. (La aleatoriedad cosmética
  // también pasa por acá, así que la reproducibilidad es aproximada: el INICIO es igual, diverge al jugar.)
  const _nativeRandom = Math.random;
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function strToSeed(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  let runSeed = null;                // null = sin semilla (aleatorio); string/num = semilla activa
  function applySeed() { Math.random = (runSeed != null && runSeed !== '') ? mulberry32(strToSeed(String(runSeed))) : _nativeRandom; }
  // clave de modo para el ranking de mejores puntajes
  function modeKey() { return (manager.endless ? 'endless' : manager.hardMode ? 'hard' : 'normal'); }
  // multiplicador de SCORE por racha de kills: +0.5x cada 4 kills, tope x5 (decae si dejás de matar)
  function comboMult() { return clampN(1 + Math.floor(manager.combo / 4) * 0.5, 1, 5); }
  // ── LOGROS + COSMÉTICOS: se chequean al terminar la run; algunos desbloquean COLORES extra de tanque ──
  const ACHIEVEMENTS = [
    { id:'wave10',   label:'Wave 10',            unlocks:null,   test:s => s.wave >= 10 },
    { id:'wave20',   label:'Wave 20',            unlocks:'colA', test:s => s.wave >= 20 },
    { id:'boss5',    label:'5 bosses in one run',unlocks:'colB', test:s => s.bossKills >= 5 },
    { id:'beat',     label:'Beat the Final Boss',unlocks:'colC', test:s => s.beat },
    { id:'score50k', label:'50,000 points',      unlocks:'colD', test:s => s.score >= 50000 },
    { id:'endless5', label:'Endless x5',         unlocks:'colE', test:s => s.endless >= 5 },
  ];
  const EXTRA_COLORS = [   // colores extra de tanque, gateados por logro (unlock id)
    { col:[0,90,90],  unlock:'colA' }, { col:[90,0,45], unlock:'colB' }, { col:[45,90,90], unlock:'colC' },
    { col:[90,90,40], unlock:'colD' }, { col:[20,20,30], unlock:'colE' },
  ];
  function allTankColors() { return manager.playerColors.concat(EXTRA_COLORS.map(e => e.col)); }
  function selectedColor() { const all = allTankColors(); return (all[manager.colorSelected] || all[0]).slice(); }
  function checkAchievements() {
    const s = { score: lastScore|0, wave: manager.waveCount||0, beat: !!manager.beatGame, endless: manager.endlessLevel||0, bossKills: manager.bossKills||0 };
    const newly = [];
    ACHIEVEMENTS.forEach(a => {
      if (!SAVE.ach[a.id] && a.test(s)) { SAVE.ach[a.id] = true; newly.push(a.label); if (a.unlocks) SAVE.unlocks[a.unlocks] = true; }
    });
    if (newly.length) manager.newAch = newly;   // se muestran en la pantalla de fin de run
  }

  // ── TUNING KNOBS ──
  const MOVE_SPEED      = 0.12;     // velocidad tope del PLAYER (fracción sper, px/s) — palanca omnidireccional, directa
  const DESKTOP_TURN    = 5;       // giro del cuerpo del PLAYER hacia la dirección WASD en desktop (rad/s) — suaviza el salto entre las 8 direcciones
  const AIM_SPEED       = 0.5;     // velocidad del cursor de mira con la palanca der (mobile), fracción sper/s — la mira se mueve sobre el mapa
  const AIM_DEAD        = 0.5;     // zona muerta de la palanca de mira: cerca del centro NO mueve; recién mueve pasada esta fracción (0..1)
  const AIM_MAGNET      = 0.08;    // imán de la mira hacia el enemigo más cercano (fracción/frame@60) — suave, no clavado
  const AIM_MAGNET_RANGE= 0.16;    // radio de captura del imán (fracción sper). Más rango, pero el imán SUELTA
                                   // mientras empujás la palanca (cambiar de blanco no pelea contra el lock)
  const THRUST          = 0.0096;   // empuje de los ENEMIGOS por frame@60
  const BOOST_MULT      = 1.9;
  const TURN_RATE       = 0.000125; // giro del cuerpo de los ENEMIGOS (con inercia)
  const TURRET_RATE     = 0.00015;  // giro de la torreta de los ENEMIGOS (con inercia)
  const VEL_FRICTION    = 0.92;     // fricción de la vel de los ENEMIGOS por frame@60
  const ANGVEL_FRICTION = 0.95;
  const TURRET_TURN     = 14;       // seguimiento de la torreta del PLAYER hacia la mira (rad/s) → apuntado responsivo
  const PRIMARY_AS      = 0.125;    // cooldown base cañón (= 4x más rápido que el original 0.5)
  const PRIMARY_SCALE   = 0.25;     // daño por tiro del cañón (1/4; DPS igual)
  const PLAYER_ATTACK   = 2;        // ataque base del PLAYER (era 1) → el doble de daño en cañón y misil
  const MAXHP           = 1000;     // VIDA NATURAL: pool base de TODO tanque. El daño se expresa en HP reales (cañón base 25, etc.).
                                    // La durabilidad de cada enemigo vive en su maxHealth (no en defense, que ahora es un multiplicador parejo).
  const RECOIL_MULT     = 0.2;      // escala del retroceso al disparar (1 = original; 0.2 = muy sutil; 0 = sin recoil)
  const MISSILE_MAX     = 4;
  const MISSILE_REGEN   = 10;       // seg por misil
  const MISSILE_CONE    = Math.PI/5; // semi-ángulo del cono de auto-apuntado del misil (~36°)
  const SHIELD_CAP      = 5;
  const RAGE_DURATION   = 12;       // FURIA (estilo GoW): segundos de "power mode" al descargar la barra llena
  const MISSILE_LOCK    = 1.0;      // seg que un enemigo te "lockea" (con telegrafía visible) antes de soltarte el misil
  const PLAYER_R        = 0.0128;   // radio en fracción sper
  const SHOT_SPEED      = 0.8;
  const PLAYER_SPREAD   = Math.PI/60; // cono chico de dispersión del cañón del PLAYER (ángulo total, ~3°) — apenas cubre un poco más
  const MISSILE_SPEED   = 0.48;
  let   MAX_ENEMIES     = 22;   // tope de enemigos en simultáneo (se baja en mobile, ver IS_TOUCH)

  // ── MUNDO ABIERTO ──
  const WORLD_W = 3200, WORLD_H = 1800;  // mundo 2.5× el viewport por lado (~6.3× de área); el viewport sigue 1280×720
  const CAM_LERP      = 0.10;            // seguimiento de la cámara al player (fracción/frame@60)
  const CAM_LOOKAHEAD = 0.25;            // cuánto se corre la cámara hacia la mira (anticipa lo que apuntás)
  // (la cantidad de muros/cajas/minas por arena la define ahora la tabla BIOMES, no una constante fija)

  // ── CANVAS ──
  // Resolución lógica fija 1280×720 (W/H constantes): toda la geometría porcentual (xper/yper/sper) y la
  // física se comportan idénticas al original. El canvas se estira a la pantalla vía la transform del loop.
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 1280, H = 720;
  let dpr = 1, scaleX = 1, scaleY = 1, cssW = 0, cssH = 0, lastVW = 0, lastVH = 0;
  let stageRot = 0;   // 0 = landscape (sin rotar); 90 = vertical → rotamos #stage por CSS para forzar landscape
  // Heurística táctil estándar (puntero grueso + sin hover). Decide si mostrar joysticks/botones.
  const IS_TOUCH = (window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches) || 'ontouchstart' in window;
  // MOBILE: bajar a ~3/4 todo lo que spawnea (más jugable con joystick + menos carga de IA/física = más FPS) y un tope más bajo
  const MOBILE_SPAWN = IS_TOUCH ? 0.75 : 1;
  if (IS_TOUCH) MAX_ENEMIES = 17;
  const IS_EMBEDDED = (window.self !== window.top);
  function resize() {
    const iw = window.innerWidth, ih = window.innerHeight;
    lastVW = iw; lastVH = ih;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    // Si la pantalla está VERTICAL (en touch, no embebido), rotamos #stage 90° por CSS y le damos dimensiones
    // landscape (alto×ancho intercambiados) → el juego siempre se ve apaisado, sin tocar la orientación del SO.
    const stage = document.getElementById('stage');
    const portrait = IS_TOUCH && !IS_EMBEDDED && ih > iw;
    stageRot = portrait ? 90 : 0;
    if (portrait) {
      stage.style.width = ih + 'px'; stage.style.height = iw + 'px';
      stage.style.transform = 'translate(-50%,-50%) rotate(90deg)';
    } else {
      stage.style.width = iw + 'px'; stage.style.height = ih + 'px';
      stage.style.transform = 'translate(-50%,-50%)';
    }
    cssW = canvas.clientWidth || (portrait ? ih : iw);
    cssH = canvas.clientHeight || (portrait ? iw : ih);
    scaleX = cssW / W; scaleY = cssH / H;
    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);
    document.getElementById('rotate').style.display = 'none';   // ya no hace falta: forzamos landscape por CSS
  }
  window.addEventListener('resize', resize);

  // ── HELPERS (port de TankWARS.py) ──
  const xper = p => p * W;
  const yper = p => p * H;
  const sper = p => p * (W + H) / 2;
  const getDist  = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const getDistSq= (a, b) => { const dx=a[0]-b[0], dy=a[1]-b[1]; return dx*dx+dy*dy; };
  const getAngle = (a, b) => Math.atan2(b[1]-a[1], b[0]-a[0]);
  function getAngle2(prev, a, b) {
    let ang = Math.atan2(b[1]-a[1], b[0]-a[0]);
    if (ang - prev < -Math.PI) ang += TAU;
    if (ang - prev >  Math.PI) ang -= TAU;
    return ang;
  }
  function rectCollision(r1, r2) {
    return r1[0]+r1[2] > r2[0] && r1[0] < r2[0]+r2[2] && r1[1]+r1[3] > r2[1] && r1[1] < r2[1]+r2[3];
  }
  function rectPointCollision(r, p) {
    return p[0] >= r[0] && p[0] <= r[0]+r[2] && p[1] >= r[1] && p[1] <= r[1]+r[3];
  }
  const cl = v => Math.max(0, Math.min(255, v|0));
  const modifyColor     = (c, o) => [cl(c[0]+o), cl(c[1]+o), cl(c[2]+o)];
  const modifyColorPerc = (c, f) => [cl(c[0]*f), cl(c[1]*f), cl(c[2]*f)];
  const randColorInRange= (rl,rh,gl,gh,bl,bh) => [ri(rl,rh), ri(gl,gh), ri(bl,bh)];
  const randColorGray   = (lo, hi) => { const n = ri(lo,hi); return [n,n,n]; };
  const randColor       = () => [ri(0,255), ri(0,255), ri(0,255)];
  const rgb = c => `rgb(${cl(c[0])},${cl(c[1])},${cl(c[2])})`;

  // primitivas de dibujo
  function line(x1,y1,x2,y2,color,w) {
    ctx.strokeStyle = rgb(color); ctx.lineWidth = Math.max(1, w); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  function circle(x,y,r,color,w) {
    ctx.beginPath(); ctx.arc(x,y,Math.max(0.5,r),0,TAU);
    if (w) { ctx.strokeStyle = rgb(color); ctx.lineWidth = Math.max(1,w); ctx.stroke(); }
    else   { ctx.fillStyle = rgb(color); ctx.fill(); }
  }
  function rectFill(x,y,w,h,color,stroke) {
    if (stroke) { ctx.strokeStyle = rgb(color); ctx.lineWidth = Math.max(1,stroke); ctx.strokeRect(x,y,w,h); }
    else { ctx.fillStyle = rgb(color); ctx.fillRect(x,y,w,h); }
  }
  // Fuentes de UI (sistema; el CSP bloquea CDNs): UIFONT = condensada techy (Bahnschrift en Win); GOLDFONT = mono
  // para el oro. TEXT_SCALE achica TODO el texto del canvas de una.
  const UIFONT = "'Bahnschrift', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif";
  const GOLDFONT = "'Consolas', 'SFMono-Regular', 'Menlo', 'Courier New', monospace";
  const COMBOFONT = "'Arial Black', 'Impact', 'Bahnschrift', sans-serif";   // pesada/impactante para el multiplicador de racha
  const TEXT_SCALE = 0.9;
  function text(str, color, x, y, px, align='left') {
    ctx.fillStyle = rgb(color); ctx.font = `${Math.round(px*TEXT_SCALE)}px ${UIFONT}`;
    ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y);
  }
  // ── helpers estéticos (glow SIN shadowBlur — carísimo en mobile; gradientes para dar volumen) ──
  // glow aditivo: 1 disco translúcido con composite 'lighter' detrás de la entidad. Resetea estado siempre.
  function glow(x, y, r, color, alpha) {
    const a0 = ctx.globalAlpha;                              // respeta/restaura el alpha entrante (fades, etc.)
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a0 * alpha;
    ctx.fillStyle = rgb(color); ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, r), 0, TAU); ctx.fill();
    ctx.globalAlpha = a0; ctx.globalCompositeOperation = 'source-over';
  }
  // Bloom gaussiano cacheado por color (estilo FireworksWeb): el resplandor de cada chispa/estallido es 1
  // drawImage de una textura radial pre-renderizada — mucho más rico que el disco plano de glow() y más barato
  // que shadowBlur. El color se CUANTIZA a pasos de 32 → el caché queda acotado (~decenas de sprites) aunque las
  // explosiones tiñan con valores aleatorios. Se dibuja con 'lighter': los solapados ACUMULAN luz (el brillo).
  const _glowCache = new Map();
  function glowSprite(color) {
    const r = Math.min(255, Math.round(color[0]/32)*32), g = Math.min(255, Math.round(color[1]/32)*32), b = Math.min(255, Math.round(color[2]/32)*32);
    const key = r + ',' + g + ',' + b;
    let s = _glowCache.get(key);
    if (s) return s;
    const S = 64; s = document.createElement('canvas'); s.width = S; s.height = S;
    const gx = s.getContext('2d');
    const grd = gx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    grd.addColorStop(0,    'rgba(' + key + ',0.95)');
    grd.addColorStop(0.35, 'rgba(' + key + ',0.35)');
    grd.addColorStop(1,    'rgba(' + key + ',0)');
    gx.fillStyle = grd; gx.fillRect(0, 0, S, S);
    _glowCache.set(key, s);
    return s;
  }
  function bloom(x, y, r, color, alpha) {
    if (alpha <= 0.004 || r < 0.5) return;
    const a0 = ctx.globalAlpha;
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, a0 * alpha);
    ctx.drawImage(glowSprite(color), x - r, y - r, r*2, r*2);
    ctx.globalAlpha = a0; ctx.globalCompositeOperation = 'source-over';
  }
  // Flare/estrella blanca cacheada (núcleo + cruz de 2 púas): glint sutil en las chispas más calientes. Lazy
  // (se arma en el primer uso → sin riesgo de orden de carga). Se dibuja aditivo, como en FireworksWeb.
  let _flareSprite = null;
  function flareSprite() {
    if (_flareSprite) return _flareSprite;
    const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'), m = S/2;
    const rg = g.createRadialGradient(m, m, 0, m, m, S*0.16);
    rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(m, m, S*0.16, 0, TAU); g.fill();
    g.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 2; k++) {
      g.save(); g.translate(m, m); g.rotate(k * Math.PI/2);
      const lg = g.createLinearGradient(-m, 0, m, 0);
      lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,0.85)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = lg; g.fillRect(-m, -1, S, 2);
      g.restore();
    }
    _flareSprite = c; return c;
  }
  // relleno radial (centro claro desplazado → borde oscuro): da cuerpo "abombado" metálico
  function radialFill(x, y, r, inner, outer) {
    const g = ctx.createRadialGradient(x - r*0.32, y - r*0.32, r*0.12, x, y, r);
    g.addColorStop(0, rgb(inner)); g.addColorStop(1, rgb(outer));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, r), 0, TAU); ctx.fill();
  }
  // anillo de escudo con glow (doble aro celeste), compartido por todos los tanques
  function shieldRing(t) {
    // INTERMITENCIA rápida cuando el escudo está por agotarse (carga baja): parpadea on/off → avisa que se va a romper.
    // Vale para el jugador Y los enemigos (ambos llaman shieldRing). Sin carga baja, se dibuja siempre.
    const cap = t.shieldCapacity + t.shieldAugment, frac = cap > 0 ? clampN(t.shieldCharge / cap, 0, 1) : 1;
    if (frac < 0.35 && Math.sin(T * 38) < 0) return;   // mitad del ciclo apagado, ~6 Hz → muy intermitente
    const rr = t.shieldR || t.drawRadius*2.5;   // radio del escudo: normal = 2.5×; el Shielder lo agranda (domo que cubre aliados)
    glow(t.x, t.y, rr*1.08, [60,200,255], 0.22);
    circle(t.x, t.y, rr, [130,235,255], t.drawRadius/6);
    circle(t.x, t.y, rr*0.93, [52,204,255], t.drawRadius/11);
  }
  function roundRectPath(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
  }
  // barra de HUD estándar (fondo + relleno con gradiente + brillo glossy + rim) — para vida/furia/escudo, prolijas y parejas
  function hudBar(x, y, w, h, frac, col) {
    const r = h/2, fw = w * clampN(frac, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; roundRectPath(x, y, w, h, r); ctx.fill();
    ctx.save(); roundRectPath(x, y, w, h, r); ctx.clip();
    const g = ctx.createLinearGradient(x, y, x, y+h);
    g.addColorStop(0, rgb(modifyColorPerc(col,1.5))); g.addColorStop(1, rgb(modifyColorPerc(col,0.7)));
    ctx.fillStyle = g; ctx.fillRect(x, y, fw, h);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.2; ctx.fillStyle = '#fff'; ctx.fillRect(x, y, fw, h*0.42);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.restore();
    roundRectPath(x, y, w, h, r); ctx.strokeStyle = rgb(modifyColorPerc(col,1.9)); ctx.lineWidth = Math.max(1, sper(0.0018)); ctx.stroke();
  }
  // texto arcade: contorno oscuro (se lee sobre cualquier fondo) + bloom aditivo suave + relleno.
  // Respeta el globalAlpha entrante (el banner de oleada lo usa para el fade in/out) y lo restaura.
  function textGlow(str, color, x, y, px, align='center') {
    const a0 = ctx.globalAlpha; px = Math.round(px*TEXT_SCALE);
    ctx.font = `700 ${px}px ${UIFONT}`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2, px*0.16); ctx.strokeStyle = `rgba(0,0,0,${0.85*a0})`;
    ctx.strokeText(str, x, y);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a0*0.35;
    ctx.fillStyle = rgb(color); ctx.fillText(str, x, y);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = a0;
    ctx.fillStyle = rgb(color); ctx.fillText(str, x, y);
  }
  // texto de ORO: fuente MONOESPACIADA (distinta del resto de la UI) + dorado + contorno cálido. Se usa para
  // todos los números de oro (plata del HUD, +oro). El símbolo 🪙 lo pone el llamador / lo dibuja la moneda al lado.
  function goldText(str, x, y, px, align='left') {
    const a0 = ctx.globalAlpha; px = Math.round(px*TEXT_SCALE);
    ctx.font = `800 ${px}px ${GOLDFONT}`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2, px*0.18); ctx.strokeStyle = `rgba(60,35,0,${0.9*a0})`;
    ctx.strokeText(str, x, y);
    ctx.fillStyle = '#ffd23c'; ctx.fillText(str, x, y);
    ctx.globalAlpha = a0;
  }
  // Viñetas screen-space (W×H lógicos constantes → los gradientes se construyen UNA vez, patrón CrazyTanks):
  // vigDark oscurece los bordes siempre (profundidad); vigRed pulsa con vida baja.
  const vigDark = ctx.createRadialGradient(W/2, H/2, H*0.42, W/2, H/2, Math.hypot(W,H)*0.55);
  vigDark.addColorStop(0, 'rgba(0,0,0,0)'); vigDark.addColorStop(1, 'rgba(0,0,0,0.34)');
  const vigRed = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, Math.hypot(W,H)*0.5);
  vigRed.addColorStop(0, 'rgba(255,0,0,0)'); vigRed.addColorStop(1, 'rgba(255,30,20,0.5)');

  // ── ESTADO GLOBAL (mimica los globals del original) ──
  let dt = 0, fr = 1;            // fr = dt*60 → escala la acumulación "por frame" del original
  let background = [0,0,0];
  let tanks = [], enemies = [], shots = [], coins = [], walls = [], explosions = [], lootBoxes = [], mines = [];
  let player = null;
  const toRemove = new Set();
  const decay = (val, perFrame) => val * Math.pow(perFrame, fr);

  // ── CÁMARA (mundo abierto) ──
  let camX = 0, camY = 0;        // esquina sup-izq de la vista, en coords de MUNDO
  let camShake = 0;              // magnitud del shake (px lógicos); decae solo en el loop
  let T = 0;                     // reloj visual global (pulsos de minimapa/banner; nunca se resetea)
  const inView = (x, y, m) => x > camX - m && x < camX + W + m && y > camY - m && y < camY + H + m;
  function addShake(m) { camShake = Math.min(camShake + m, sper(0.016)); }

  // ── PARTÍCULAS + POPUPS (juice) ──
  // Pool simple con cap: chispas de impacto, fogonazos, estela de boost, humo de misil, muerte de tanques.
  // Discos planos (sin shadowBlur, carísimo en mobile — lección de SnakeWeb); se desvanecen Y achican.
  const parts = [];
  function spawnPart(x, y, vx, vy, life, r, color, drag = 0.88) {
    if (parts.length >= 350) return;
    parts.push({ x, y, vx, vy, life, maxLife: life, r, color, drag });
  }
  function burst(x, y, color, n, spd, life = 0.6, r = sper(0.004)) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), s = rnd(spd*0.3, spd);
      spawnPart(x, y, Math.cos(a)*s, Math.sin(a)*s, rnd(life*0.5, life), rnd(r*0.5, r*1.4), color);
    }
  }
  function updateParts() {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      const dr = Math.pow(p.drag, fr);
      p.vx *= dr; p.vy *= dr;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
  }
  function drawParts() {
    for (const p of parts) {
      if (!inView(p.x, p.y, 50)) continue;
      const a = p.life / p.maxLife;
      ctx.globalAlpha = a * 0.9;
      circle(p.x, p.y, p.r * (0.4 + a*0.8), p.color);
    }
    ctx.globalAlpha = 1;
  }
  // popups de texto flotante (+score al matar, premio de lootbox) — suben y se desvanecen
  const popups = [];
  function popup(x, y, str, color, px) {
    popups.push({ x, y, str, color, px: px || sper(0.018), t: 0 });
    if (popups.length > 24) popups.shift();
  }
  function updatePopups() {
    for (let i = popups.length - 1; i >= 0; i--) { popups[i].t += dt; if (popups[i].t > 0.9) popups.splice(i, 1); }
  }
  // Se dibuja en el pase de HUD restando la cámara (coords mundo → pantalla), junto al crosshair/minimapa.
  function drawPopups() {
    for (const p of popups) {
      if (!inView(p.x, p.y, 80)) continue;
      ctx.globalAlpha = clampN(1 - p.t/0.9, 0, 1);
      const sx = p.x - camX, sy = p.y - camY - sper(0.02) - p.t * sper(0.05);
      textGlow(p.str, p.color, sx, sy, p.px, 'center');
    }
    ctx.globalAlpha = 1;
  }
  // ── NÚMEROS DE DAÑO (sólo del jugador): aparecen AL INSTANTE en el impacto, hacen un POP y flotan hacia arriba.
  // Crítico = más grande y dorado. Array propio (no el de popups) para no desalojar los +score y poder estilizarlos.
  const dmgNums = [];
  let dmgStag = 0;
  function dmgNum(x, y, amount, crit, missile) {
    dmgStag ^= 1;   // INTERCALA entre DOS posiciones, ambas al EXTREMO DERECHO del spawn (flotan derecho hacia arriba desde ahí)
    dmgNums.push({ x, y, ox: sper(0.022) + dmgStag * sper(0.006), oy: dmgStag * sper(0.007), amt: amount, crit, missile, t: 0 });   // 2 posiciones MUCHO más juntas
    if (dmgNums.length > 40) dmgNums.shift();
  }
  function updateDmgNums() {
    for (let i = dmgNums.length - 1; i >= 0; i--) { dmgNums[i].t += dt; if (dmgNums[i].t > ((dmgNums[i].crit || dmgNums[i].missile) ? 0.85 : 0.6)) dmgNums.splice(i, 1); }
  }
  function drawDmgNums() {
    for (const p of dmgNums) {
      if (!inView(p.x, p.y, 100)) continue;
      const life = (p.crit || p.missile) ? 0.85 : 0.6, f = p.t / life;
      const pop = p.t < 0.11 ? 1.5 - 0.5 * (p.t / 0.11) : 1;                    // POP al salir (escala 1.5→1, overshoot)
      const rise = sper(0.004) + (1 - (1 - f) * (1 - f)) * sper(0.045);         // arranca en la cabeza y sube poco → queda cerca del tanque
      const sx = p.x - camX + p.ox, sy = p.y - camY - rise + (p.oy||0);          // sube DERECHO (sin deriva); ox/oy = 1 de 2 posiciones fijas a la derecha
      ctx.globalAlpha = f < 0.7 ? 1 : clampN(1 - (f - 0.7) / 0.3, 0, 1);        // visible al instante, fade al final
      // MISIL = celeste y grande · CRÍTICO = naranja con "!" · cañón = rojo chico
      const base = (p.missile ? sper(0.022) : p.crit ? sper(0.020) : sper(0.010)) * pop;
      const col  = p.missile ? [90, 210, 255] : p.crit ? [255, 100, 30] : [255, 32, 56];
      textGlow((p.crit ? p.amt + '!' : '' + p.amt), col, sx, sy, base, 'center');
    }
    ctx.globalAlpha = 1;
  }
  // deco scatter del piso (patrón CrazyTanks): puntitos/manchas estáticos por arena, regenerados con los
  // muros — con cámara, el piso necesita textura para que el movimiento se LEA. Se dibujan culleados.
  let deco = [];
  function genDeco() {
    deco = [];
    for (let i = 0; i < 200; i++) {
      deco.push({
        x: rnd(0, WORLD_W), y: rnd(0, WORLD_H),
        r: rnd(sper(0.0015), sper(0.007)),
        a: rnd(0.08, 0.25),
        ring: Math.random() < 0.25,                                  // algunos son anillos, no discos
        c: modifyColorPerc(manager.wallColor, rnd(0.45, 0.9)),
      });
    }
  }
  // grilla + deco + borde del mundo (se dibuja en coords de MUNDO, después del fill de fondo)
  function drawBackdrop() {
    const step = sper(0.13);
    const x0 = Math.max(0, Math.floor(camX/step)*step), x1 = Math.min(WORLD_W, camX + W);
    const y0 = Math.max(0, Math.floor(camY/step)*step), y1 = Math.min(WORLD_H, camY + H);
    ctx.globalAlpha = 0.10;
    ctx.strokeStyle = rgb(modifyColorPerc(background, 2.6)); ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let gx = x0; gx <= x1; gx += step) { ctx.moveTo(gx, Math.max(0,camY)); ctx.lineTo(gx, Math.min(WORLD_H, camY+H)); }
    for (let gy = y0; gy <= y1; gy += step) { ctx.moveTo(Math.max(0,camX), gy); ctx.lineTo(Math.min(WORLD_W, camX+W), gy); }
    ctx.stroke();
    for (const d of deco) {
      if (!inView(d.x, d.y, 30)) continue;
      ctx.globalAlpha = d.a;
      circle(d.x, d.y, d.r, d.c, d.ring ? Math.max(1, d.r*0.35) : 0);
    }
    ctx.globalAlpha = 1;
    // borde del mundo: glow ancho translúcido + línea fina encima (glow barato sin shadowBlur)
    const bc = modifyColorPerc(manager.wallColor, 1.5);
    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = rgb(bc); ctx.lineWidth = sper(0.012);
    ctx.strokeRect(0, 0, WORLD_W, WORLD_H);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = rgb(modifyColorPerc(manager.wallColor, 2.2)); ctx.lineWidth = sper(0.003);
    ctx.strokeRect(0, 0, WORLD_W, WORLD_H);
  }

  // ── MATTER.JS (cuerpos rígidos) ──
  // Top-down → sin gravedad. matter resuelve SOLO las colisiones de cuerpos: tanque↔muro (estático) y
  // tanque↔tanque. El resto (manejo, apuntado, disparo, daño por distancia, IA, monedas) sigue hand-rolled.
  // Cada frame seteamos la velocidad del cuerpo desde el `vel`/`ang` hand-rolled, matter integra+resuelve, y
  // leemos la posición corregida de vuelta. Velocidad de matter ≈ px/step; px/s ÷ 60 = unidad de matter.
  const { Engine, World, Bodies, Body, Composite } = Matter;
  const engine = Engine.create();
  engine.gravity.x = 0; engine.gravity.y = 0;
  const world = engine.world;
  const MATTER_VEL = 1/60;                                   // px/s → velocidad de matter (1 step = 1/60 s)
  const PHYS_STEP = 1000/60;
  let physAcc = 0;
  function stepPhysics(dtSec) {
    physAcc += dtSec * 1000;
    let n = 0;
    while (physAcc >= PHYS_STEP && n < 5) { Engine.update(engine, PHYS_STEP); physAcc -= PHYS_STEP; n++; }
    if (n >= 5) physAcc = 0;                                 // anti espiral si hubo lag
  }
  const TANK_BODY_OPTS = { restitution: 0, friction: 0, frictionAir: 0, frictionStatic: 0, inertia: Infinity };
  const TANK_MASS = 20;   // masa IGUAL para todos los tanques. Como reseteamos la velocidad cada frame, la masa
                          // pareja hace que al chocar se separen 50/50 (no se manda a volar al enemigo chico) → se empujan poco.
  function clearWalls() {
    for (const w of walls) if (w.body) World.remove(world, w.body);
    walls.length = 0;
  }

  // ════════════════ GRILLA ESPACIAL DE MUROS (broad-phase) ════════════════
  // Celdas uniformes; cada muro se inserta en TODAS las celdas que toca su AABB. Reemplaza los scans O(walls) por
  // frame (IA nearWalls, shotAllowed, clearPath del misil) por consultas O(~1) a la celda del punto. Se RECONSTRUYE
  // por frame (barato: O(walls)+O(celdas)) → cero riesgo de invalidación: siempre refleja el `walls` actual, sin
  // flags ni bajas manuales (cajas rotas, regen de arena cada 5 oleadas). Las paredes son estáticas entre frames.
  const WALL_CELL = 256;
  let wallGridCols = 0, wallGridRows = 0, wallGrid = [];
  let _wallQStamp = 0;
  const _wnCand = [];   // scratch reusado para candidatos (la IA corre secuencial → sin reentrancy)
  function buildWallGrid() {
    wallGridCols = Math.ceil(WORLD_W / WALL_CELL);
    wallGridRows = Math.ceil(WORLD_H / WALL_CELL);
    const total = wallGridCols * wallGridRows;
    if (wallGrid.length !== total) { wallGrid = new Array(total); for (let i = 0; i < total; i++) wallGrid[i] = []; }
    else for (let i = 0; i < total; i++) wallGrid[i].length = 0;
    for (let wi = 0; wi < walls.length; wi++) {
      const w = walls[wi];
      let cx0 = (w.x / WALL_CELL) | 0, cy0 = (w.y / WALL_CELL) | 0;
      let cx1 = ((w.x + w.width) / WALL_CELL) | 0, cy1 = ((w.y + w.height) / WALL_CELL) | 0;
      if (cx0 < 0) cx0 = 0; if (cy0 < 0) cy0 = 0;
      if (cx1 >= wallGridCols) cx1 = wallGridCols - 1; if (cy1 >= wallGridRows) cy1 = wallGridRows - 1;
      for (let cy = cy0; cy <= cy1; cy++) { const row = cy * wallGridCols; for (let cx = cx0; cx <= cx1; cx++) wallGrid[row + cx].push(w); }
    }
  }
  // bucket de la celda que contiene (px,py); null si cae fuera del mundo (no hay muros ahí)
  function wallBucketAt(px, py) {
    if (px < 0 || py < 0 || px >= WORLD_W || py >= WORLD_H || !wallGridCols) return null;
    return wallGrid[((py / WALL_CELL) | 0) * wallGridCols + ((px / WALL_CELL) | 0)];
  }
  // candidatos (deduplicados por stamp) cuyas celdas solapan la caja [minX,minY]-[maxX,maxY] → out (el llamador filtra exacto)
  function collectWallsNear(minX, minY, maxX, maxY, out) {
    out.length = 0;
    if (!wallGridCols) return;
    const stamp = ++_wallQStamp;
    let cx0 = (minX / WALL_CELL) | 0, cy0 = (minY / WALL_CELL) | 0, cx1 = (maxX / WALL_CELL) | 0, cy1 = (maxY / WALL_CELL) | 0;
    if (cx0 < 0) cx0 = 0; if (cy0 < 0) cy0 = 0;
    if (cx1 >= wallGridCols) cx1 = wallGridCols - 1; if (cy1 >= wallGridRows) cy1 = wallGridRows - 1;
    for (let cy = cy0; cy <= cy1; cy++) { const row = cy * wallGridCols; for (let cx = cx0; cx <= cx1; cx++) {
      const b = wallGrid[row + cx];
      for (let i = 0; i < b.length; i++) { const w = b[i]; if (w._qs !== stamp) { w._qs = stamp; out.push(w); } }
    } }
  }

  // ════════════════ TANK ════════════════
  class Tank {
    constructor() {
      this.isPlayer = false;
      this.radius = sper(0.0256);
      this.color = [128,128,128];
      this.drawRadius = this.radius;
      this.drawColor = this.color;
      this.ang = rnd(0, TAU);
      this.turretAng = this.ang;
      this.vel = 0; this.angVel = 0; this.turretAngVel = 0;
      this.hitCD = 0; this.primaryShotCD = 0; this.secondaryShotCD = 0;
      this.shieldCD = 0;
      this.shieldCapacity = SHIELD_CAP; this.shieldCharge = 0; this.shieldAugment = 0;
      this.shieldChargeSpeed = 1; this.shielded = false;
      this.covered = 0;   // COBERTURA proyectada por un Shielder cercano: mientras > 0, absorbe disparos como si tuviera escudo (no depende de su propia capacidad)
      this.shieldLockout = 8;   // OVERCARGA: al agotar el escudo se DESACTIVA este tiempo (IA: largo; el jugador lo baja mucho)
      this.maxHealth = MAXHP; this.health = this.maxHealth; this.healthRegenCD = 1; this.healthRegenSpeed = 1;   // vida natural (las subclases enemigas pisan maxHealth)
      this.attack = 1; this.defense = 1; this.moveSpeed = 1;
      this.primaryShotAS = 1; this.secondaryShotAS = 1;
      this.borderPushX = 0; this.borderPushY = 0;
      this.drawAura = false;
      tanks.push(this);
    }
    process() {
      this.hitCD = Math.max(this.hitCD - dt, 0);
      this.covered = Math.max(this.covered - dt, 0);
      this.primaryShotCD = Math.max(this.primaryShotCD - dt, 0);
      this.secondaryShotCD = Math.max(this.secondaryShotCD - dt, 0);
      this.healthRegenCD = Math.max(this.healthRegenCD - dt, 0);
      if (this.shieldCD > 0) {                            // OVERCARGA en curso: escudo desactivado, NO recarga
        this.shieldCD = Math.max(this.shieldCD - dt, 0);
        if (this.shieldCD === 0) this.shieldCharge = this.shieldCapacity + this.shieldAugment;   // terminó la overcarga → vuelve LLENO
      } else if (!this.shielded) {
        const c = (this.shieldCharge > 0.2 ? dt*this.shieldChargeSpeed : dt);
        this.shieldCharge = clampN(this.shieldCharge + c, 0, this.shieldCapacity + this.shieldAugment);
      }

      // Creación perezosa del cuerpo: el radio ya es definitivo tras el constructor de la subclase.
      if (!this.body) {
        this.body = Bodies.circle(this.x, this.y, this.radius, TANK_BODY_OPTS);
        Body.setMass(this.body, TANK_MASS);   // masa pareja → empuje tanque-tanque simétrico y chico
        this.body.gameRef = this;
        World.add(world, this.body);
      }

      this.ang += this.angVel * this.moveSpeed * dt;
      this.turretAng += this.turretAngVel * this.moveSpeed * dt;

      this.angVel = decay(this.angVel, ANGVEL_FRICTION);
      this.turretAngVel = decay(this.turretAngVel, ANGVEL_FRICTION);
      this.vel = decay(this.vel, VEL_FRICTION);
      this.borderPushX = decay(this.borderPushX, VEL_FRICTION);
      this.borderPushY = decay(this.borderPushY, VEL_FRICTION);

      this.ang = mod(this.ang, TAU);
      this.turretAng = mod(this.turretAng, TAU);

      // Manejo vía matter: en vez de integrar la posición a mano (y empujar tanque-tanque a mano), seteamos
      // la velocidad del cuerpo; matter integra y resuelve choques contra muros y otros tanques. La posición
      // corregida se lee de vuelta en el loop (readbackBodies). borderPush sigue conteniendo al tanque en pantalla.
      const mv = this.moveSpeed * MATTER_VEL;
      Body.setVelocity(this.body, {
        x: (Math.cos(this.ang)*this.vel + this.borderPushX) * mv,
        y: (Math.sin(this.ang)*this.vel + this.borderPushY) * mv,
      });

      if (this.health < this.maxHealth && this.health > 0 && this.healthRegenCD === 0) {
        this.health = Math.min(this.health + 0.005*this.maxHealth, this.maxHealth);
        this.healthRegenCD = 10 * this.healthRegenSpeed;
      }

      // daño de disparos del bando contrario. AABB early-reject + distancia AL CUADRADO: evita getDist (que alocaba
      // 2 arrays por par tank×shot y usaba Math.hypot) en el término dominante O(tanks×shots) por frame.
      const r1 = this.radius, r1sq = r1*r1, r25 = this.shieldR || r1*2.5, r25sq = r25*r25;   // radio de absorción del escudo (el Shielder lo tiene GRANDE → su escudo cubre el domo)
      for (const shot of shots) {
        if (toRemove.has(shot)) continue;                 // ya consumido por un muro/caja este frame → no atraviesa
        if (this.isPlayer === shot.isPlayerShot) continue;
        const dx = shot.x - this.x, dy = shot.y - this.y, R = r25 + shot.radius;
        if (dx > R || dx < -R || dy > R || dy < -R) continue;   // caja de descarte (mata ~95% de los pares con 2 restas)
        const d2 = dx*dx + dy*dy;
        if (shot.missile) {
          // El MISIL choca contra el ESCUDO igual que cualquier disparo: detona al tocar la burbuja (r25)
          // si el blanco está escudado/cubierto; sin escudo, detona al tocar el cuerpo (r1). detonate()
          // deja inmunes a los escudados/cubiertos → el domo del Shielder bloquea misiles para él y sus aliados.
          const trigR = (this.shielded || this.covered > 0) ? r25 : r1;
          if (d2 <= (trigR + shot.radius)**2) shot.detonate();
          continue;
        }
        if (this.shielded || this.covered > 0) {
          if (d2 <= r25sq) {
            // Por DEFAULT el escudo DESTRUYE el disparo (no rebota) → no te comés tus propios tiros y los enemigos NUNCA los devuelven.
            // DEFLECT (power-up del jugador): SÓLO el jugador con la mejora rebota el disparo y lo convierte en SUYO (pega a enemigos).
            if (this.isPlayer && this.powerUps && this.powerUps.deflect) {
              shot.x = shot.preX; shot.y = shot.preY;
              shot.ang += Math.PI + rnd(-Math.PI/4, Math.PI/4);
              shot.isPlayerShot = true;            // rebota como disparo del jugador
              shot.color = modifyColor(player.color, 150);
            } else {
              toRemove.add(shot);                  // absorbido por el escudo
            }
          }
        } else if (d2 < r1sq) {
          if (shot.pierce && shot.hit.has(this)) continue;   // PERFORANTE: ya le pegó a este enemigo → lo atraviesa sin re-dañar
          const isP = player && shot.isPlayerShot;
          const atk = isP ? player.attack : shot.attack;
          const pscale = isP ? PRIMARY_SCALE : 1;
          let dmg = MAXHP*0.05*atk*this.defense*pscale;   // daño en HP reales (def parejo → cañón base 25 vs cualquier enemigo)
          const crit = isP && Math.random() < (player.critChance||0);   // GOLPE CRÍTICO (prob + daño se compran en la tienda) — también durante la FURIA
          if (crit) dmg *= (player.critMult||2);
          this.health = Math.max(this.health - dmg, 0);
          this.hitCD = 0.03;
          if (isP) dmgNum(this.x, this.y - this.radius, Math.max(1, Math.round(dmg)), crit);   // número de daño = HP reales
          if (shot.isPlayerShot && player) {
            player.score += 6;
            if (player.powerModeActiveTime <= 0) player.rage = Math.min(player.rage + 0.007 * (player.powerUps.fastRage ? 1.6 : 1) * (player.rageGain||1), 1);   // pegar carga FURIA
          }
          if (inView(shot.x, shot.y, 60)) {
            if (crit) burst(shot.x, shot.y, [255,238,150], 10, sper(0.38), 0.55);   // crítico: fogonazo dorado más grande
            else burst(shot.x, shot.y, modifyColorPerc(shot.color, 1.3), 5, sper(0.22), 0.45);
          }
          if (this.isPlayer) { addShake(sper(0.006)); if (this.powerModeActiveTime <= 0) this.rage = Math.min(this.rage + 0.013 * (this.rageGain||1), 1); }   // recibir daño también carga FURIA
          if (shot.pierce) shot.hit.add(this); else toRemove.add(shot);   // PERFORANTE: no se consume; sigue de largo
        }
      }

      if (this.health <= 0 && !this.isPlayer) {
        if (player) {
          const prevM = comboMult();
          manager.combo++; manager.comboCD = 3.2;                 // racha de kills → multiplica el SCORE (no la economía)
          const m = comboMult(), gained = Math.round((this.scoreValue || 0) * m * manager.scoreMul);
          if (m > prevM) manager.comboPopT = 0.45;                // el multiplicador SUBIÓ de nivel → efecto pop en el HUD
          player.score += gained;
          if (player.lifesteal) player.health = Math.min(player.health + player.lifesteal, player.maxHealth*2);   // VAMPIRISMO (lifesteal = HP planos; overheal hasta 2×)
          if ((this.scoreValue || 0) >= 1400) manager.bossKills++;  // élites/jefes → para logros
          if (this.scoreValue) popup(this.x, this.y - this.radius*2, '+' + gained + (m > 1 ? ' x' + m.toFixed(1) : ''), m > 1 ? [255,200,60] : [255,255,255]);
        }
        const amount = this.dropCoins || 0;
        for (let i = 0; i < amount; i++) new Coin(this.x, this.y, ri(28,42) + (this.coinValue||0));
        toRemove.add(this);
      }

      this.shielded = false;
      this.drawRadius = this.hitCD > 0 ? rnd(this.radius*0.8, this.radius*1.2) : this.radius;
    }
    draw() {
      this.drawColor = this.hitCD > 0 ? modifyColor(this.color,112) : this.color;
      drawTankBody(this);
      if (this.shielded) shieldRing(this);   // sólo el escudo PROPIO se ve (los aliados cubiertos por un Shielder NO levantan escudo, los protege el domo del Shielder)
    }
    shieldAction() {
      // Escudo con OVERCARGA: mientras haya carga, absorbe (drena la carga). Al agotarla se SOBRECARGA y queda
      // DESACTIVADO un rato (shieldLockout: corto para el jugador, largo para la IA). Durante el lockout no
      // recarga ni se puede levantar; al terminar vuelve LLENO de una (ver Tank.process). El límite real es la
      // carga + ese lockout — hay un momento claro de "te quedaste sin escudo", pero el del jugador dura poco.
      if (this.shieldCD > 0) return;                       // sobrecargado → desactivado
      if (this.powerModeActiveTime > 0) return;            // en FURIA el escudo NO gasta carga (ya sos invulnerable); enemigos no tienen powerMode → no afecta
      if (this.shieldCharge > 0) {
        this.shielded = true;
        this.shieldCharge -= dt*1.5;
        if (this.shieldCharge <= 0) { this.shieldCharge = 0; this.shieldCD = this.shieldLockout; if (this.onShieldBreak) this.onShieldBreak(); }   // se vació → OVERCARGA (+ estallido en el jugador)
        shieldRing(this);
      }
    }
    recoil(amount) {
      amount *= RECOIL_MULT;                                   // retroceso muy sutil (0 = sin recoil)
      const rec = this.turretAng + Math.PI;
      if (this.body) Body.translate(this.body, { x: Math.cos(rec)*amount, y: Math.sin(rec)*amount });
    }
    primaryShotAction() {
      if (this.primaryShotCD > 0) return;
      new PrimaryShot(this);
      // fogonazo: 3 chispas en la boca del cañón (solo si se ve, para no gastar el pool fuera de cámara)
      if (inView(this.x, this.y, this.radius*4)) {
        const mx = this.x + Math.cos(this.turretAng)*this.radius*2, my = this.y + Math.sin(this.turretAng)*this.radius*2;
        for (let i = 0; i < 3; i++) {
          const a = this.turretAng + rnd(-0.4, 0.4), s = rnd(sper(0.1), sper(0.3));
          spawnPart(mx, my, Math.cos(a)*s, Math.sin(a)*s, rnd(0.08, 0.18), sper(0.003), modifyColor(this.color, 150), 0.8);
        }
      }
      this.recoil(sper(0.0016));
      this.primaryShotCD = 1 * this.primaryShotAS;
    }
    secondaryShotAction() {
      if (this.secondaryShotCD > 0) return;
      new SecondaryShot(this);
      this.recoil(sper(0.012));
      this.secondaryShotCD = 10 * this.secondaryShotAS;
    }
    // Misil enemigo CON LOCK: cuando el cañón secundario está listo, primero "lockea" al jugador MISSILE_LOCK seg
    // (mientras mantenga línea de tiro; la telegrafía la dibuja Enemy.draw) y recién ahí dispara. fire() se llama
    // sólo con línea de tiro; si se pierde, Enemy.process resetea missileLockT a 0 → hay que mantener el lock seguido.
    fireMissileLocked() {
      if (this.secondaryShotCD > 0) { this.missileLockT = 0; return; }
      this.missileLockT += dt;
      if (this.missileLockT >= MISSILE_LOCK) { this.secondaryShotAction(); this.missileLockT = 0; }
    }
    getBorderPush() {
      // empuje contra los bordes del MUNDO (es lo único que contiene a los tanques; matter no tiene cerco)
      this.borderPushX += this.x < this.radius ? sper(0.0032) : this.x > WORLD_W - this.radius ? -sper(0.0032) : 0;
      this.borderPushY += this.y < this.radius ? sper(0.0032) : this.y > WORLD_H - this.radius ? -sper(0.0032) : 0;
    }
  }

  // dibujo base del cuerpo (chasis placado + orugas), compartido por todos los tanques. Se dibuja en un
  // contexto rotado (save/translate/rotate) para que las placas redondeadas queden prolijas; los detalles
  // por tipo (drawDetail) y la torreta se dibujan DESPUÉS en coords de mundo y se superponen.
  function drawTankBody(t) {
    const dr = t.drawRadius, c = t.drawColor;
    // sombra de apoyo en coords de MUNDO (antes del rotate → "luz desde arriba" consistente, no gira con el tanque).
    // Los SIGILOSOS no la llevan: una sombra flotante sin tanque visible los delataba.
    if (!t.stealth) {
      ctx.globalAlpha = 0.26; ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(t.x, t.y + dr*0.22, dr*1.5, dr*1.05, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(t.x, t.y); ctx.rotate(t.ang);
    // glow del color (aditivo) — los sigilosos (Invis) NO lo llevan: los delataría
    if (!t.stealth) {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.15;
      ctx.fillStyle = rgb(modifyColorPerc(c,1.6));
      ctx.beginPath(); ctx.ellipse(0, 0, dr*1.85, dr*1.55, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    // ORUGAS: cinta oscura + ruedas de rodaje (road wheels) + tacos + borde claro → mucho más cuerpo
    const tl = dr*1.32, tw = dr*0.56;
    for (const s of [-1, 1]) {
      const cy = s*dr*0.74;
      ctx.fillStyle = rgb(modifyColorPerc(c,0.3));
      roundRectPath(-tl, cy - tw/2, tl*2, tw, tw*0.35); ctx.fill();
      ctx.fillStyle = rgb(modifyColorPerc(c,0.52));                          // ruedas de rodaje (se ven entre los tacos)
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(i*dr*0.47, cy, tw*0.3, 0, TAU); ctx.fill(); }
      ctx.fillStyle = rgb(modifyColorPerc(c,0.17));                          // tacos
      for (let i = -4; i <= 4; i++) ctx.fillRect(i*dr*0.3 - dr*0.045, cy - tw/2, dr*0.09, tw);
      ctx.strokeStyle = rgb(modifyColorPerc(c,0.72)); ctx.lineWidth = Math.max(1, dr*0.05);   // borde claro de la oruga
      roundRectPath(-tl, cy - tw/2, tl*2, tw, tw*0.35); ctx.stroke();
    }
    // CHASIS: placa redondeada con gradiente (claro arriba → oscuro abajo) + rim brillante
    const hw = dr*1.12, hh = dr*0.92;
    const g = ctx.createLinearGradient(0, -hh, 0, hh);
    g.addColorStop(0, rgb(modifyColorPerc(c,1.6))); g.addColorStop(0.5, rgb(c)); g.addColorStop(1, rgb(modifyColorPerc(c,0.45)));
    ctx.fillStyle = g; roundRectPath(-hw, -hh, hw*2, hh*2, dr*0.3); ctx.fill();
    // placa de blindaje INTERIOR (escalón más chico → profundidad)
    ctx.strokeStyle = rgb(modifyColorPerc(c,0.5)); ctx.lineWidth = Math.max(1, dr*0.05);
    roundRectPath(-hw*0.78, -hh*0.78, hw*1.56, hh*1.56, dr*0.22); ctx.stroke();
    // rim brillante
    ctx.strokeStyle = rgb(modifyColorPerc(c,2.1)); ctx.lineWidth = Math.max(1, dr*0.11);
    roundRectPath(-hw, -hh, hw*2, hh*2, dr*0.3); ctx.stroke();
    // REMACHES en las 4 esquinas
    ctx.fillStyle = rgb(modifyColorPerc(c,2.4));
    for (const rx of [-1,1]) for (const ry of [-1,1]) { ctx.beginPath(); ctx.arc(rx*hw*0.72, ry*hh*0.64, dr*0.08, 0, TAU); ctx.fill(); }
    // líneas de panel + brillo glossy
    ctx.strokeStyle = rgb(modifyColorPerc(c,0.4)); ctx.lineWidth = Math.max(1, dr*0.055);
    ctx.beginPath(); ctx.moveTo(-hw*0.46, -hh*0.82); ctx.lineTo(-hw*0.46, hh*0.82);
    ctx.moveTo(hw*0.22, -hh*0.82); ctx.lineTo(hw*0.22, hh*0.82); ctx.stroke();
    if (!t.stealth) {   // brillo glossy — el sigiloso no, sería un parche blanco flotante que lo delata
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.22; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-hw*0.2, -hh*0.42, hw*0.55, hh*0.32, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }
  // torreta genérica (cañón placado + centro abovedado), reutilizada por enemigos
  function drawTurret(t, barrelLen=1.75, barrelW=4, coreF=0.6) {
    const a = t.turretAng, dr = t.drawRadius, c = t.drawColor;
    const ex = t.x+Math.cos(a)*dr*barrelLen, ey = t.y+Math.sin(a)*dr*barrelLen;
    const mx = t.x+Math.cos(a)*dr*coreF*1.05, my = t.y+Math.sin(a)*dr*coreF*1.05;
    line(t.x, t.y, mx, my, modifyColorPerc(c,1.25), dr/barrelW*2.2);          // MANTLET (base ancha del cañón)
    line(t.x, t.y, ex, ey, modifyColorPerc(c,1.7), dr/barrelW*1.35);          // cañón
    line(t.x, t.y, ex, ey, modifyColorPerc(c,2.4), dr/barrelW*0.55);          // veta de luz del cañón
    for (const f of [0.5, 0.78]) circle(t.x+Math.cos(a)*dr*barrelLen*f, t.y+Math.sin(a)*dr*barrelLen*f, dr/barrelW*0.95, modifyColorPerc(c,1.15));   // bandas del cañón
    circle(ex, ey, dr*0.16, modifyColorPerc(c,2.6));                          // boca / freno de boca
    circle(ex, ey, dr*0.08, modifyColorPerc(c,0.5));
    circle(t.x, t.y, dr*coreF, modifyColorPerc(c,1.5));                       // cúpula (capas en vez de gradiente: barato)
    circle(t.x, t.y, dr*coreF*0.6, modifyColorPerc(c,2.6));
    circle(t.x, t.y, dr*coreF, modifyColorPerc(c,2.2), Math.max(1, dr*0.06));
    for (let i = 0; i < 4; i++) { const ba = a + Math.PI/4 + i*Math.PI/2; circle(t.x+Math.cos(ba)*dr*coreF*0.68, t.y+Math.sin(ba)*dr*coreF*0.68, dr*0.05, modifyColorPerc(c,2.8)); }   // bolts de la cúpula
  }

  // ════════════════ PLAYER ════════════════
  class Player extends Tank {
    constructor() {
      super();
      this.isPlayer = true;
      this.radius = sper(PLAYER_R);
      this.drawRadius = this.radius;
      this.x = WORLD_W/2; this.y = WORLD_H/2;   // arranca en el centro del MUNDO
      this.color = selectedColor();   // color elegido en el menú (incluye los extra desbloqueados)
      this.regAttack = PLAYER_ATTACK; this.regDefense = 1; this.regPrimaryShotAS = PRIMARY_AS;
      this.regSecondaryShotAS = 1; this.regMoveSpeed = 1; this.regHealthRegenSpeed = 1;
      this.attack = PLAYER_ATTACK; this.defense = 1; this.primaryShotAS = PRIMARY_AS;
      this.secondaryShotAS = 1; this.moveSpeed = 1; this.healthRegenSpeed = 1;
      this.missileMax = MISSILE_MAX; this.missileStack = MISSILE_MAX; this.missileRegenCD = 0; this.missileRegenMult = 1;
      this.boosting = false;
      this.iceSlowCD = 0;   // los disparos de Icy frenan al jugador (no estando en furia)
      this.shieldUpCD = 0;  // sostener-escudo tras detectar un disparo cerca (0.25s: la mitad que la IA)
      this.shieldLockout = 3;   // OVERCARGA del jugador: MUCHO más corta que la IA (se reactiva rápido)
      this.shieldBreakGrace = 0;   // gracia de daño reducido justo tras romperse el escudo (ver onShieldBreak)
      // FURIA: el viejo "power mode" ahora se DESCARGA desde una barra que se carga peleando (rage 0..1). Mientras
      // dura (powerModeActiveTime), stats potenciados (defensa 0 = invulnerable, fuego rápido, x2 vel, misiles infinitos).
      this.rage = 0;
      this.powerModeActiveTime = 0;
      this.powHealthRegenSpeed = 0.0025; this.powAttack = 4; this.powDefense = 0;
      this.powPrimaryShotAS = 0.0125; this.powSecondaryShotAS = 0.05; this.powMoveSpeed = 2;
      // Mejoras ESPECIALES (lootbox 'power', permanentes en la run): triple disparo, recarga rápida de misiles,
      // cañón ancho, furia veloz. Con todas, el lootbox 'power' dropea MUCHO oro.
      this.powerUps = {}; POWER_UPS.forEach(u => this.powerUps[u.id] = false);
      this.coinMagnetMul = 1; this.lifesteal = 0; this.noPowerups = false;
      this.coinGain = 1; this.rageGain = 1;   // UTILITY: la tienda sube el valor de las monedas y la carga de furia
      this.critChance = 0; this.critMult = 2;   // GOLPE CRÍTICO: prob 0 + ×2 daño de base; la tienda sube ambos
      applyArchetype(this);          // arquetipo elegido (redistribuye stats; balance neutro)
      applyMutatorsToPlayer(this);   // mutadores opt-in (trade-offs sobre los stats del tanque)
      this.moneyToAdd = 0; this.moneyToAddCD = 0; this.coinGrabbedCD = 0;
      this.money = 0; this.score = 0;
      player = this;
    }
    process() {
      super.process();
      this.moneyToAddCD = Math.max(this.moneyToAddCD - dt, 0);
      this.coinGrabbedCD = Math.max(this.coinGrabbedCD - dt, 0);
      this.iceSlowCD = Math.max(this.iceSlowCD - dt, 0);

      // Power mode: mientras dura, los stats vivos toman los pow*; si no, los base (reg*, modificados por la tienda).
      this.powerModeActiveTime = Math.max(this.powerModeActiveTime - dt, 0);
      if (this.powerModeActiveTime > 0) {
        this.attack = this.powAttack; this.defense = this.powDefense;
        this.primaryShotAS = this.powPrimaryShotAS; this.secondaryShotAS = this.powSecondaryShotAS;
        this.moveSpeed = this.powMoveSpeed;
      } else {
        this.attack = this.regAttack; this.defense = this.regDefense;
        this.primaryShotAS = this.regPrimaryShotAS; this.secondaryShotAS = this.regSecondaryShotAS;
        this.moveSpeed = this.regMoveSpeed;
      }
      // GRACIA post-rotura de escudo: ventana corta de daño MUY reducido para no morir en el instante crítico
      this.shieldBreakGrace = Math.max(this.shieldBreakGrace - dt, 0);
      if (this.shieldBreakGrace > 0 && this.powerModeActiveTime <= 0) this.defense *= 0.35;   // 65% menos de daño recibido

      const inp = readInput();
      if (inp.rage) tryActivateRage();   // FURIA: tecla Q (desktop) o tocar la barra (mobile) la descargan si está llena
      // Movimiento OMNIDIRECCIONAL: una sola palanca. La dirección de la palanca es la dirección de
      // movimiento; el cuerpo apunta hacia ahí. Velocidad directa (máxima tracción): arranca y frena al
      // instante. Seteamos la velocidad del cuerpo de matter acá (pisa la que puso Tank.process).
      this.boosting = inp.boost;
      const mag = Math.min(1, Math.hypot(inp.moveX, inp.moveY));
      const spd = sper(MOVE_SPEED) * this.moveSpeed * (this.boosting ? BOOST_MULT : 1) * mag * (this.iceSlowCD > 0 ? 0.55 : 1);   // Icy: 55% (lento real, pero seguís móvil)
      // El MOVIMIENTO va SIEMPRE en la dirección de la palanca (instantáneo, máxima tracción, sin arco).
      // El ángulo del cuerpo es sólo VISUAL (apuntás con la torreta/mouse aparte), así que lo desacoplamos.
      let moveX = 0, moveY = 0;
      if (mag > 0.05) {
        const target = Math.atan2(inp.moveY, inp.moveX);            // dirección pedida = dirección de movimiento
        moveX = (inp.moveX / Math.hypot(inp.moveX, inp.moveY)) * spd;
        moveY = (inp.moveY / Math.hypot(inp.moveX, inp.moveY)) * spd;
        if (IS_TOUCH) {
          this.ang = target;                                       // joystick analógico: dirección continua → snap directo
        } else {
          // Desktop (WASD da solo 8 direcciones discretas): el cuerpo rota SUAVE hacia la dirección para
          // que el sprite no salte de golpe, pero el movimiento ya es instantáneo (arriba). Tope DESKTOP_TURN rad/s.
          const adiff = getAngle2(this.ang, [0,0], [Math.cos(target),Math.sin(target)]) - this.ang;
          this.ang = mod(this.ang + clampN(adiff, -DESKTOP_TURN*dt, DESKTOP_TURN*dt), TAU);
        }
      }
      if (this.body) Body.setVelocity(this.body, {
        x: (moveX + this.borderPushX) * MATTER_VEL,
        y: (moveY + this.borderPushY) * MATTER_VEL,
      });
      // estela de boost: llamitas que quedan atrás mientras turbeás (se nota que vas rápido)
      if (this.boosting && mag > 0.05) {
        const bx = this.x - Math.cos(this.ang)*this.radius*1.6, by = this.y - Math.sin(this.ang)*this.radius*1.6;
        spawnPart(bx + rnd(-3,3), by + rnd(-3,3),
                  -Math.cos(this.ang)*sper(0.04), -Math.sin(this.ang)*sper(0.04),
                  rnd(0.2, 0.4), sper(0.0045), [255, ri(120,200), 0], 0.9);
      }
      if (inp.primary) this.primaryShotAction();
      if (inp.missile) this.secondaryShotAction();

      // Torreta: seguimiento DIRECTO hacia la mira con tope TURRET_TURN rad/s → responde apenas cambiás de
      // objetivo, sin el lag de acumular turretAngVel.
      const tdiff = getAngle2(this.turretAng, [this.x,this.y], [inp.aimX, inp.aimY]) - this.turretAng;
      this.turretAng = mod(this.turretAng + clampN(tdiff, -TURRET_TURN*dt, TURRET_TURN*dt), TAU);

      // escudo automático (como la IA): se activa si hay un disparo enemigo cerca
      this.autoShield();

      // regen de misiles
      this.missileRegenCD = Math.max(this.missileRegenCD - dt, 0);
      if (this.missileStack < this.missileMax && this.missileRegenCD === 0) {
        this.missileStack++;
        this.missileRegenCD = MISSILE_REGEN * this.regSecondaryShotAS * this.missileRegenMult;
      }

      this.getBorderPush();

      // IMÁN de monedas: succión en LÍNEA RECTA (sin curvar ni orbitar) que se acelera cuanto más cerca → glide fluido.
      const magRange = sper(0.15) * this.coinMagnetMul;
      for (const coin of coins) {
        if (coin.openCD > 0) continue;                      // todavía en su POP de apertura → el imán no la toca aún
        const dx = this.x - coin.x, dy = this.y - coin.y, d2 = dx*dx + dy*dy;
        if (d2 >= magRange*magRange) continue;
        coin.grabbed = true; coin.vel = 0;                  // el imán maneja el movimiento (cortamos el pop para que no pelee)
        const d = Math.sqrt(d2) || 1, t01 = 1 - d/magRange;
        const pull = sper(0.3) + sper(1.7) * t01 * t01;     // base + succión CUADRÁTICA por cercanía (tipo aspiradora)
        const step = Math.min(pull * dt, d);                // nunca se pasa del player → sin overshoot/jitter
        coin.x += dx/d * step; coin.y += dy/d * step;
        if (d < this.radius + coin.radius && !coin.accounted) {
          this.moneyToAdd += Math.round(coin.value * manager.coinMul * (this.coinGain||1)); this.coinGrabbedCD = 0.03;   // mutadores + upgrade Coin value
          burst(coin.x, coin.y, [255,255,80], 3, sper(0.12), 0.35, sper(0.0025));   // destello al juntar
          coin.accounted = true; toRemove.add(coin);
        }
      }

      if (this.moneyToAdd > 0 && this.moneyToAddCD === 0) {
        const tr = Math.max(1, Math.ceil(this.moneyToAdd * 0.15));   // roll-up PROPORCIONAL → el contador sube fluido sea cual sea el monto
        this.moneyToAdd -= tr; this.money += tr; this.moneyToAddCD = 0.01;
      }

      if (this.health <= 0) {
        manager.gameover = true; addShake(sper(0.016));
        // como el .py original: al morir, el jugador EXPLOTA largando sus monedas (en base a la plata acumulada),
        // hasta 50 monedas de 30-50 c/u, restándolas de la plata.
        let dropLimit = 50;
        while (this.money > 40 && dropLimit-- > 0) { const value = ri(30, 50); new Coin(this.x, this.y, value); this.money -= value; }
        toRemove.add(this); player = null;
      }
    }
    autoShield() {
      // como el shieldEval de la IA: detectar un disparo enemigo cerca arma el escudo y lo SOSTIENE
      // (shieldUpCD), no solo ese frame — mientras el disparo siga cerca, el timer se va refrescando.
      // Para el JUGADOR el sostén forzado es 0.25s: la MITAD que la IA (0.5s) → el auto-escudo gasta menos carga.
      for (const shot of shots) {
        if (!shot.isPlayerShot && getDistSq([this.x,this.y],[shot.x,shot.y]) < (this.radius*4)**2) {
          this.shieldUpCD = 0.25; break;
        }
      }
      this.shieldUpCD = Math.max(this.shieldUpCD - dt, 0);
      if (this.shieldUpCD > 0) this.shieldAction();
    }
    onShieldBreak() {
      // ESTALLIDO al romperse el escudo: convierte el instante crítico (overcarga = 0 defensa) en un momento DEFENSIVO.
      // Barre los disparos enemigos cercanos (no comés la ráfaga que venía) + da una gracia de daño reducido para
      // alcanzar a reposicionarte. Onda + sacudida para que se LEA que tu escudo reventó.
      const R = this.radius * 6.5, Rsq = R * R;
      for (const shot of shots) {
        if (shot.isPlayerShot || toRemove.has(shot)) continue;
        if (getDistSq([this.x, this.y], [shot.x, shot.y]) < Rsq) toRemove.add(shot);   // limpia la lluvia entrante
      }
      this.shieldBreakGrace = 1.0;                                  // 1s de daño muy reducido tras reventar
      new Explosion(this.x, this.y, this.radius * 2.6, [120, 210, 255]);   // onda celeste (color del escudo)
      burst(this.x, this.y, [150, 235, 255], 16, sper(0.4), 0.6);
      addShake(sper(0.013));
    }
    primaryShotAction() {
      if (this.primaryShotCD > 0) return;
      // MULTISHOT: por debajo de un cooldown "distinguible" (CAP), en vez de disparar más rápido (que se ve como un
      // chorro sin huecos) se disparan N tiros casi paralelos por ráfaga, espaciando las ráfagas a ~CAP. DPS idéntico.
      const CAP = 0.05;
      const n = this.primaryShotAS < CAP ? Math.max(1, Math.round(CAP / this.primaryShotAS)) : 1;
      const tri = this.powerUps.triple;
      for (let k = 0; k < n; k++) {
        const off = n > 1 ? rnd(-0.045, 0.045) : 0;       // los extra salen casi en la misma dirección
        new PrimaryShot(this, off);
        if (tri) { new PrimaryShot(this, off + 0.16); new PrimaryShot(this, off - 0.16); }   // alas del TRIPLE (más área)
      }
      if (inView(this.x, this.y, this.radius*4)) {        // fogonazo (una vez por ráfaga)
        const mx = this.x + Math.cos(this.turretAng)*this.radius*2, my = this.y + Math.sin(this.turretAng)*this.radius*2;
        for (let i = 0; i < 3; i++) { const a = this.turretAng + rnd(-0.4, 0.4), s = rnd(sper(0.1), sper(0.3)); spawnPart(mx, my, Math.cos(a)*s, Math.sin(a)*s, rnd(0.08, 0.18), sper(0.003), modifyColor(this.color, 150), 0.8); }
      }
      this.recoil(sper(0.0016));
      this.primaryShotCD = this.primaryShotAS * n;          // ráfagas espaciadas a ~CAP → DPS = n/(AS·n) = 1/AS (sin cambio)
    }
    secondaryShotAction() {
      const powered = this.powerModeActiveTime > 0;
      if (this.secondaryShotCD > 0) return;
      if (!powered && this.missileStack <= 0) return;     // sin furia, necesitás stack; con furia, misiles infinitos
      new SecondaryShot(this);
      this.recoil(sper(0.012));
      if (!powered) {
        this.missileStack--;
        // Si el regen no estaba corriendo (stack venía lleno), arrancarlo ahora → si no, el frame siguiente
        // regeneraba uno al instante (regenCD==0) y el primer misil salía "gratis".
        if (this.missileRegenCD === 0) this.missileRegenCD = MISSILE_REGEN * this.regSecondaryShotAS * this.missileRegenMult;
      }
      this.secondaryShotCD = powered ? 10 * this.secondaryShotAS : 0.25;
    }
    draw() {
      const flash = this.hitCD > 0;
      this.drawColor = flash ? modifyColor(this.color,112) : this.coinGrabbedCD > 0 ? [255,255,0] : this.powerModeActiveTime > 0 ? randColor() : this.iceSlowCD > 0 ? [120,200,255] : this.color;
      drawTankBody(this);
      if (this.shielded) shieldRing(this);   // burbuja de escudo (parpadea rápido cuando está por agotarse — ver shieldRing)
      // (la barra de FURIA vive en el HUD arriba-izquierda, debajo de la vida — ver drawHUD)
      // proa: triángulo claro que marca el frente del tanque
      const a = this.ang, dr = this.drawRadius;
      ctx.fillStyle = rgb(modifyColorPerc(this.drawColor, 2.2));
      ctx.beginPath();
      ctx.moveTo(this.x+Math.cos(a)*dr*1.15, this.y+Math.sin(a)*dr*1.15);
      ctx.lineTo(this.x+Math.cos(a+0.42)*dr*0.7, this.y+Math.sin(a+0.42)*dr*0.7);
      ctx.lineTo(this.x+Math.cos(a-0.42)*dr*0.7, this.y+Math.sin(a-0.42)*dr*0.7);
      ctx.closePath(); ctx.fill();
      // torreta (cañón placado + cúpula), consistente con los enemigos
      drawTurret(this, 2, 3.4, 0.72);
      // MARCA DE JUGADOR: anillo claro + núcleo que late en la cúpula → destaca entre los enemigos de un vistazo
      circle(this.x, this.y, dr*0.42, modifyColorPerc(this.drawColor, 2.9), Math.max(1, dr*0.06));
      glow(this.x, this.y, dr*0.5, modifyColorPerc(this.drawColor, 2.2), 0.3);
      circle(this.x, this.y, dr*(0.16 + 0.04*Math.sin(T*6)), [255,255,255]);
    }
  }

  // ════════════════ ENEMY base ════════════════
  class Enemy extends Tank {
    constructor() {
      super();
      // Spawn en ANILLO alrededor del player (patrón SnakeWeb): cerca de la acción pero FUERA de cámara
      // (criterio real: inView, no solo distancia — la semidiagonal de la vista + lookahead supera el radio
      // del anillo) y NUNCA dentro de un muro (ahí matter lo eyectaba con un pop feo y la esquiva quedaba
      // ciega). Si se agotan los intentos (player arrinconado), se usa el candidato MÁS LEJANO válido.
      const cx0 = player ? player.x : WORLD_W/2, cy0 = player ? player.y : WORLD_H/2;
      let stries = 0, sok = false, bestX = cx0 + xper(0.9), bestY = cy0, bestD = -1;
      while (!sok && stries++ < 25) {
        const sa = rnd(0, TAU), sd = rnd(xper(0.75), xper(1.15));
        this.x = clampN(cx0 + Math.cos(sa)*sd, this.radius*2, WORLD_W - this.radius*2);
        this.y = clampN(cy0 + Math.sin(sa)*sd, this.radius*2, WORLD_H - this.radius*2);
        if (walls.some(w => rectCollision([this.x-this.radius*2, this.y-this.radius*2, this.radius*4, this.radius*4], [w.x,w.y,w.width,w.height]))) continue;
        const dd = getDistSq([this.x,this.y],[cx0,cy0]);
        if (dd > bestD) { bestD = dd; bestX = this.x; bestY = this.y; }
        sok = dd > xper(0.7)**2 && !inView(this.x, this.y, sper(0.05));
      }
      if (!sok) { this.x = clampN(bestX, this.radius*2, WORLD_W - this.radius*2); this.y = clampN(bestY, this.radius*2, WORLD_H - this.radius*2); }
      this.maxDistToPlayer = rnd(sper(0.128), sper(0.512));
      this.inScreen = false; this.playerLocked = true; this.scoutModeTimer = 0;
      this.targetX = cx0; this.targetY = cy0; this.targetRadius = 0;
      this.aimAngle = this.ang; this.aimPointX = 0; this.aimPointY = 0;
      this.dropCoins = 0; this.coinValue = 0; this.scoreValue = 0;
      this.shieldUpCD = 0; this.useShield = false;   // useShield: el enemigo evalúa solo si levantar escudo ante disparos
      this.avoidSide = 1; this.avoidCD = 0;          // histéresis de la esquiva de muros (sostener el lado elegido)
      this.missileLockT = 0;                         // tiempo de lock acumulado antes de soltar el misil (telegrafía)
      this.pickScout(false);
      enemies.push(this);
    }
    // Punto scout (deambular): cerca de DONDE ESTÁ (elegirlo en cualquier lado del mundo abierto lo mandaba
    // a la otra punta del mapa), fuera de muros. Con biasToPlayer, el centro de búsqueda es el punto medio
    // hacia el player → los que perdieron el agro derivan de vuelta a la acción en vez de orbitar lejos.
    pickScout(biasToPlayer) {
      const ax = (biasToPlayer && player) ? (this.x + player.x)/2 : this.x;
      const ay = (biasToPlayer && player) ? (this.y + player.y)/2 : this.y;
      let tries = 0;
      do {
        this.scoutX = clampN(ax + rnd(-xper(0.7), xper(0.7)), xper(0.04), WORLD_W - xper(0.04));
        this.scoutY = clampN(ay + rnd(-yper(0.7), yper(0.7)), yper(0.04), WORLD_H - yper(0.04));
      } while (++tries < 30 && walls.some(w => rectCollision([this.scoutX-this.radius*2,this.scoutY-this.radius*2,this.radius*4,this.radius*4],[w.x,w.y,w.width,w.height])));
    }
    process() {
      super.process();
      // escudo: la detección (shieldEval) sólo si el tipo la usa, pero el sostener-escudo (shieldUpCD) es
      // universal → el Commander puede dispararle shieldEval a enemigos que normalmente no se escudan.
      this.shieldUpCD = Math.max(this.shieldUpCD - dt, 0);
      if (this.useShield) this.shieldEval();
      if (this.shieldUpCD > 0) this.shieldAction();
      if (player) { this.targetX = player.x; this.targetY = player.y; this.targetRadius = player.radius; }
      if (!player || this.scoutModeTimer > 15) this.playerLocked = false;
      // RE-AGRO por cercanía: si el player está a menos de media pantalla, volver a perseguirlo. Sin esto,
      // un enemigo que perdió el lock (15s sin línea de tiro) orbitaba su scout para siempre → stragglers
      // pasivos que llenaban MAX_ENEMIES y estancaban las oleadas de jefe.
      if (player && !this.playerLocked && getDistSq([this.x,this.y],[player.x,player.y]) < sper(0.45)**2) {
        this.playerLocked = true; this.scoutModeTimer = 0; this.avoidCD = 0;   // re-lock → reevaluar la esquiva
      }
      // al llegar al scout, sortear el próximo (sesgado hacia el player) — el scout fijo era de la arena chica
      if (!this.playerLocked && getDistSq([this.x,this.y],[this.scoutX,this.scoutY]) < (this.radius*4)**2) this.pickScout(true);

      this.aimAngle = getAngle2(this.turretAng, [this.x,this.y], [this.targetX,this.targetY]);

      const canShoot = this.shotAllowed();   // se calcula UNA vez por frame y se reusa abajo (era ×2: gating de mov. + de disparo)
      if (canShoot) {
        if (!this.playerLocked) this.avoidCD = 0;   // recién re-lockeó para dispararme → reevaluar por dónde esquivar
        this.playerLocked = true; this.scoutModeTimer = 0;
        const d = getDist([this.x,this.y],[this.targetX,this.targetY]);
        if (d > this.maxDistToPlayer || !this.inScreen) this.vel += sper(THRUST)*fr;
        else if (d < this.maxDistToPlayer/3) this.vel -= sper(THRUST)*fr;
      } else {
        this.vel += sper(THRUST)*fr;
        this.scoutModeTimer += dt;
      }

      let goal;
      if (!this.playerLocked && this.escortOf && this.escortOf.health > 0 && !toRemove.has(this.escortOf)) {
        // ESCOLTA: si no persigue al player, se mantiene en su slot alrededor del comandante (el grupo lo sigue por un área)
        goal = [clampN(this.escortOf.x + Math.cos(this.escortSlot)*this.escortDist, xper(0.04), WORLD_W-xper(0.04)),
                clampN(this.escortOf.y + Math.sin(this.escortSlot)*this.escortDist, yper(0.04), WORLD_H-yper(0.04))];
      } else {
        if (this.escortOf && (this.escortOf.health <= 0 || toRemove.has(this.escortOf))) this.escortOf = null;   // comandante muerto → escolta libre
        goal = this.playerLocked ? [this.targetX,this.targetY] : [this.scoutX,this.scoutY];
      }
      const goalAng = getAngle2(this.ang, [this.x,this.y], goal);
      this.moveAngle = goalAng;

      // ── NAVEGACIÓN: RODEO POR ESQUINA ──
      // En vez de "bigotes" reactivos (que dudaban frente a un muro), cuando el rayo hacia el objetivo choca
      // un muro elegimos rodearlo DETERMINÍSTICAMENTE: miramos las dos esquinas "silueta" del muro (las de
      // ángulo extremo vistas desde acá) y apuntamos a pasar por AFUERA de la que pide menos desvío. Con
      // histéresis (avoidCD) para sostener el lado elegido. Izquierda o derecha, sin zigzaguear.
      const reach = this.radius * 16;
      const margin = this.radius * 1.6;            // cuánto "engordamos" el muro para que el cuerpo lo libre
      const nearWalls = [];
      collectWallsNear(this.x - reach, this.y - reach, this.x + reach, this.y + reach, _wnCand);   // candidatos de la grilla (en vez de escanear TODOS los muros)
      for (let ci = 0; ci < _wnCand.length; ci++) { const w = _wnCand[ci];
        if (this.x > w.x - reach && this.x < w.x + w.width + reach && this.y > w.y - reach && this.y < w.y + w.height + reach) nearWalls.push(w);   // mismo test exacto → nearWalls idéntico
      }
      // primer muro que cruza el rayo recto al objetivo (cuerpo expandido por margin)
      const goalDist = getDist([this.x,this.y], goal), rayLen = Math.min(goalDist, reach);
      const ca = Math.cos(goalAng), sa = Math.sin(goalAng);
      let block = null;
      for (let i = 1; i <= 12 && !block; i++) {
        const px = this.x + ca*rayLen*i/12, py = this.y + sa*rayLen*i/12;
        for (const w of nearWalls) {
          if (px >= w.x-margin && px <= w.x+w.width+margin && py >= w.y-margin && py <= w.y+w.height+margin) { block = w; break; }
        }
      }
      this.avoidCD = Math.max(this.avoidCD - dt, 0);
      if (block) {
        const w = block;
        const corners = [[w.x-margin,w.y-margin],[w.x+w.width+margin,w.y-margin],[w.x+w.width+margin,w.y+w.height+margin],[w.x-margin,w.y+w.height+margin]];
        let minRel = Infinity, maxRel = -Infinity, leftC = corners[0], rightC = corners[0];
        for (const c of corners) {                 // ángulo de cada esquina relativo al rumbo-objetivo, en [-π,π]
          const rel = mod(getAngle([this.x,this.y], c) - goalAng + Math.PI, TAU) - Math.PI;
          if (rel < minRel) { minRel = rel; leftC = c; }
          if (rel > maxRel) { maxRel = rel; rightC = c; }
        }
        let side;                                   // +1 = rodear por la derecha (esquina de ángulo máximo)
        if (this.avoidCD > 0) side = this.avoidSide;                            // sostener lo comprometido
        else side = Math.abs(maxRel) <= Math.abs(minRel) ? 1 : -1;             // si no, el lado de menor desvío
        this.avoidSide = side; this.avoidCD = 0.45;
        const corner = side === 1 ? rightC : leftC;
        const wcx = w.x+w.width/2, wcy = w.y+w.height/2;                        // apuntar por AFUERA de la esquina
        const ox = corner[0]-wcx, oy = corner[1]-wcy, ol = Math.hypot(ox,oy) || 1;
        this.moveAngle = getAngle2(this.ang, [this.x,this.y], [corner[0]+ox/ol*margin, corner[1]+oy/ol*margin]);
      }
      // borde del mundo: si el rumbo elegido se va a salir, girarlo hacia adentro
      const LB = this.radius * 6;
      const fx = this.x + Math.cos(this.moveAngle)*reach, fy = this.y + Math.sin(this.moveAngle)*reach;
      if (fx < LB || fx > WORLD_W-LB || fy < LB || fy > WORLD_H-LB) {
        const toC = getAngle2(this.moveAngle, [this.x,this.y], [WORLD_W/2, WORLD_H/2]);
        this.moveAngle += clampN(toC - this.moveAngle, -0.6, 0.6);
      }
      // despegue: si está RASPANDO un muro, empujón perpendicular hacia afuera (antes quedaba trabado
      // deslizando contra la pared sin poder rodearla)
      for (const w of nearWalls) {
        const nx = clampN(this.x, w.x, w.x+w.width), ny = clampN(this.y, w.y, w.y+w.height);
        const ddx = this.x-nx, ddy = this.y-ny, d2 = ddx*ddx+ddy*ddy, lim = this.radius*1.9;
        if (d2 < lim*lim && d2 > 1e-6) {
          const dd = Math.sqrt(d2), push = sper(0.0035) * (1 - dd/lim) * fr;
          this.borderPushX += ddx/dd*push; this.borderPushY += ddy/dd*push;
        } else if (d2 <= 1e-6) {
          // centro DENTRO del muro (arena regenerada encima): empujar hacia la cara más cercana para salir
          const dl = this.x - w.x, drr = w.x + w.width - this.x, dtp = this.y - w.y, db = w.y + w.height - this.y;
          const m = Math.min(dl, drr, dtp, db), push = sper(0.006) * fr;
          if (m === dl) this.borderPushX -= push; else if (m === drr) this.borderPushX += push;
          else if (m === dtp) this.borderPushY -= push; else this.borderPushY += push;
        }
      }
      // steering proporcional al error, con wrap a ±π (la esquiva puede empujar el error más allá de π y
      // sin el wrap el tanque giraba por el lado LARGO — trompos visibles contra muros)
      let angErr = this.moveAngle - this.ang;
      angErr = mod(angErr + Math.PI, TAU) - Math.PI;
      const turn = clampN(angErr / 0.6, -1, 1);
      this.angVel += turn * sper(TURN_RATE) * 1.5 * fr;
      this.turretAngVel += (this.aimAngle > this.turretAng ? sper(TURRET_RATE) : -sper(TURRET_RATE)) * fr;
      if (!this.playerLocked) this.turretAng = this.ang;

      // activación ("entró a la pelea"): cuando entra a la VISTA de la cámara — habilita disparar y el
      // borderPush (la semántica original de inScreen, adaptada a cámara móvil)
      if (!this.inScreen && this.x > camX + this.radius*2 && this.x < camX + W - this.radius*2 &&
          this.y > camY + this.radius*2 && this.y < camY + H - this.radius*2) this.inScreen = true;
      this.getBorderPush();   // contención del mundo SIEMPRE (el gate por inScreen era de la era pantalla==mundo)

      if (canShoot) this.fire();
      else this.missileLockT = 0;   // sin línea de tiro → se cancela el lock del misil (tiene que ser 1s SEGUIDO)
    }
    fire() { this.primaryShotAction(); }
    shotAllowed() {
      if (!player || !this.inScreen) return false;
      // gate por distancia: si el blanco supera el alcance del rayo, ni lo recorras (los enemigos lejanos lo saltean)
      const reach = this.radius * 50, tdx = this.targetX - this.x, tdy = this.targetY - this.y;
      if (tdx*tdx + tdy*tdy > reach*reach) return false;
      // Rayo de línea de tiro hacia el objetivo (aimAngle ya apunta al jugador). El PASO no puede ser más grueso
      // que el blanco: con this.radius como paso, los tanques GRANDES (FinalBoss, radio 35px > hitbox 25.6px del
      // jugador) salteaban la hitbox entre muestras → shotAllowed parpadeaba false → el lock del misil (1s SEGUIDO)
      // se reseteaba sin parar. Paso = min(radio, blanco) → nunca lo saltea. Mismo alcance (radio*50) que antes.
      const step = Math.min(this.radius, this.targetRadius || this.radius);
      const n = Math.min(Math.ceil(reach / step), 160);
      const ca = Math.cos(this.aimAngle), sa = Math.sin(this.aimAngle);
      const trx = this.targetX - this.targetRadius, try0 = this.targetY - this.targetRadius, td = this.targetRadius * 2;
      for (let i = 0; i < n; i++) {
        const px = this.x + ca*step*i, py = this.y + sa*step*i;
        this.aimPointX = px; this.aimPointY = py;
        if (px >= trx && px <= trx+td && py >= try0 && py <= try0+td) return true;                  // pegó en la hitbox del jugador
        const bkt = wallBucketAt(px, py);   // grilla: solo los muros de la celda del punto, no todos
        if (bkt) for (let k = 0; k < bkt.length; k++) { const w = bkt[k]; if (px >= w.x && px <= w.x+w.width && py >= w.y && py <= w.y+w.height) return false; }   // tapado por un muro
      }
      return false;
    }
    shieldEval() {
      // si hay UN disparo del jugador cerca, levantá el escudo y mantenelo medio segundo. Con el PRIMERO alcanza
      // (break): antes seguía escaneando todos los shots y, peor, drenaba el escudo una vez por shot cercano.
      // AABB + distancia al cuadrado escalar → sin alocar arrays por shot (lo amplifica el aura del Commander).
      const R = this.radius*3, Rsq = R*R;
      for (const shot of shots) {
        if (!shot.isPlayerShot) continue;
        const dx = shot.x - this.x, dy = shot.y - this.y;
        if (dx > R || dx < -R || dy > R || dy < -R) continue;
        if (dx*dx + dy*dy < Rsq) { this.shieldAction(); this.shieldUpCD = 0.5; break; }
