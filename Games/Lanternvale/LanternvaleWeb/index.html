:!0},wisp:{n:"Wisp",hp:330,atk:46,def:6,spd:56,r:5,ai:"caster",proj:"orb",fly:!0,aggro:124,leash:200,pref:90,range:150,cd:2.1,windup:.5,xp:76,gold:[18,30],drops:[["ember",.4]],pool:"marsh",gear:.04,art:"wisp"},revenant:{n:"Revenant",hp:430,atk:52,def:18,spd:38,r:7,ai:"tank",combo:3,aggro:90,leash:180,range:24,cd:2.2,windup:.45,xp:96,gold:[26,42],drops:[["dust",.4]],pool:"marsh",gear:.05,art:"revenant"},thornling:{n:"Thornling",hp:140,atk:38,def:6,spd:72,r:4,ai:"rusher",aggro:400,leash:999,range:10,cd:.9,xp:10,gold:[0,2],drops:[],art:"thornling",minion:!0},mite:{n:"Crystal Mite",hp:130,atk:34,def:8,spd:66,r:4,ai:"rusher",aggro:400,leash:999,range:10,cd:.9,xp:12,gold:[1,3],drops:[],art:"mite",minion:!0},totem:{n:"Thorn Totem",hp:900,atk:40,def:10,spd:0,r:8,ai:"totem",aggro:90,leash:999,range:44,cd:3.2,windup:.9,xp:150,gold:[40,60],drops:[["thorn",1]],art:"totem",still:!0},greyfang:{n:"Greyfang",boss:!0,hp:2e3,atk:22,def:6,spd:62,r:10,ai:"bwolf",aggro:110,leash:150,range:40,cd:1.5,windup:.5,xp:320,gold:[120,160],drops:[["pelt",1],["potM",.6]],pool:"forest",special:[["wolfbane",.3],["wolfhelm",.3],["fangneck",.35]],art:"greyfang"},warden:{n:"The Cave Warden",boss:!0,hp:6600,atk:44,def:16,spd:26,r:14,ai:"bgolem",aggro:120,leash:170,range:44,cd:2.2,windup:.9,xp:1e3,gold:[400,500],drops:[["core",1],["shard",.8],["potL",.6]],pool:"cave",special:[["visor",.3],["stoneheart",.25],["emberbrand",.15],["crystaledge",.3]],art:"warden"},troll:{n:"Mire Troll",boss:!0,mini:!0,hp:5600,atk:50,def:14,spd:34,r:11,ai:"btroll",aggro:110,leash:150,range:40,cd:2.4,windup:.8,xp:520,gold:[250,320],drops:[["gooey",1],["potL",.5]],pool:"marsh",special:[["bramble",.25],["marsheye",.15],["runic",.3]],art:"troll"},thornmother:{n:"The Thornmother",boss:!0,hp:13e3,atk:44,def:18,spd:0,r:18,ai:"bthorn",aggro:150,leash:999,range:60,cd:2,windup:.8,xp:3e3,gold:[1500,1800],drops:[["thorn",1],["potL",1]],pool:"marsh",special:[["thornreaver",.6],["thorncrown",.6],["bramble",.3],["marsheye",.3]],art:"thornmother",still:!0}};for(const e in ENEMIES)ENEMIES[e].id=e;const BOSS_RESPAWN=300,SKILLS=[{id:"power",n:"Power Strike",lv:2,cd:6,d:"A heavy blow in front of you: 250% damage and a big knockback."},{id:"whirl",n:"Whirlwind",lv:4,cd:9,d:"Spin and hit everything around you for 160% damage."},{id:"ember",n:"Ember Bolt",lv:7,cd:4,d:"A bolt of fire that pierces up to three monsters for 200% damage. It lights up the dark."},{id:"wind",n:"Second Wind",lv:10,cd:28,d:"Heal 35% of your health and take 40% less damage for 3 seconds."}],LEVEL_CAP=20,xpNext=e=>Math.round(22*Math.pow(e,1.75));function baseStats(e){return{hp:50+10*e,atk:4+2*e,def:1+e,spd:62,crit:5}}const NPCS={maren:{n:"Elder Maren",role:"Village elder",voice:520,look:{skin:"#eab893",hair:"#eeeef4",hs:"bun",shirt:"#7a4aa8",robe:!0,hold:"staff"},greet:["Ah, there you are. Come in, come in. Mind the cat.","The lanterns burn a little brighter when you are around."],talk:["Lanternvale has stood for three hundred years. It will stand three hundred more, with a little help.","The first villagers lit the lanterns to keep the Blight away. Lately they burn low.","Do not be a stranger. Old women like visitors almost as much as they like being right."]},brom:{n:"Brom",role:"Blacksmith",voice:180,shop:"weapons",look:{skin:"#d89a6a",hair:"#5a3a1a",hs:"bald",shirt:"#8a3a2a",beard:"#6a3a1a",apron:"#5a4030",hold:"hammer"},greet:["Steel for sale. Sharp side goes toward the monster.","Back again? Good. My anvil gets lonely."],talk:["If it is sharp, I made it. If it is dull, you used it.","You swing like a farmer. That is a compliment. Farmers are strong.","My grandfather forged the lantern hooks in the square. Still holding. Of course they are.","Bring me stone that hums one day. Golem cores. I want to hear them sing on my anvil."]},tilda:{n:"Tilda",role:"Armorer",voice:330,shop:"armor",look:{skin:"#f2c29a",hair:"#d05a2a",hs:"braid",shirt:"#6a7a8a",pauldron:"#a8b0b8"},greet:["Welcome to the Armory! Everything here has been dented at least once. By me. For testing.","Need something between you and the teeth?"],talk:["Leather for the meadow, iron for the woods, and prayers for the marsh.","A helmet is cheaper than a head. I checked.","Dents are just armor telling stories.","Spider silk makes the finest padding. Nobody wants to fetch it, though. Hint, hint."]},pipette:{n:"Pipette",role:"Alchemist",voice:640,shop:"potions",look:{skin:"#f6d0b0",hair:"#7a5ab8",hs:"short",shirt:"#2fa39a",hat:"witch",hatc:"#2a8a82",glasses:!0},greet:["Potions! Tonics! Things that fizz! Mostly safe!","Oh good, a customer! Or a test subject. Customer! I meant customer."],talk:["The red ones heal. The purple ones fizz. Do not drink the ones that hum.","Slime gel is the secret ingredient. Also the not-so-secret ingredient.","If you start glowing, that is normal. If you stop glowing, come back.","I tried to brew a potion of courage once. It just made people very chatty."]},wren:{n:"Sister Wren",role:"Healer",voice:440,heal:!0,look:{skin:"#e8b890",hair:"#6a4a2a",hs:"short",shirt:"#f0ece0",robe:!0,hat:"hood",hatc:"#f4f0e4",trim:"#5aa04a"},greet:["Peace, traveler. Sit down before you fall down.","Hurt again? I will not ask. I will only fix."],talk:["Hold still. This only stings a little.","The meadow herbs are gentle. The marsh ones bite back.","Rest is also a kind of medicine. The cheap kind."]},hale:{n:"Captain Hale",role:"Captain of the guard",voice:240,look:{skin:"#d8a070",hair:"#3a2a1a",hs:"short",shirt:"#3a5aa8",hat:"helm",hatc:"#a8b0b8",hold:"spear",beard:"#3a2a1a"},greet:["Citizen. Or adventurer. Either way, stand up straight.","At ease. Mostly."],talk:["I have guarded this gate for twenty years. The gate has never once thanked me.","Bandits in Whisperwood wear little tin badges. Bring me a few and I will know they are thinning out.","The east bridge? Washed out in the spring floods. We mend it when the forest is safe."]},nell:{n:"Old Nell",role:"Villager",voice:470,look:{skin:"#f2c29a",hair:"#cfcfd4",hs:"bun",shirt:"#a85a6a",robe:!0,shawl:"#7a3a4a",hold:"cane"},greet:["Oh! A visitor. Would you like a biscuit? Not the cat. An actual biscuit.","Hello, dear. You look taller today."],talk:["My late husband was a terrible dancer. I miss that.","In my day the Blightmarsh was a lake. We used to skate on it.","The cat is named after the biscuits. Not the other way around."]},tobin:{n:"Tobin",role:"A very busy child",voice:760,kid:!0,look:{skin:"#f6d0b0",hair:"#e87a2a",hs:"messy",shirt:"#f0d05a",pants:"#4a6aa8"},greet:["Are you an adventurer? A REAL one? Can I see your sword? Can I hold it? No? Okay.","Hi again! Did you see anything golden?"],talk:["When I grow up I am gonna be an adventurer. Or a baker. Or both!","Biscuit caught a mouse yesterday. Then she let it go. I think they are friends now.","Captain Hale can sleep standing up. I have seen it."]},lyle:{n:"Lyle",role:"Bard",voice:380,look:{skin:"#e8b890",hair:"#8a5a2a",hs:"short",shirt:"#b03a3a",hat:"feather",hatc:"#6a2a2a",hold:"lute"},greet:["Ah, an audience! Sit, sit. Or stand. Standing ovations are also accepted.","Back for another song? I only know rumors, but I sing them beautifully."],talk:["They say a hermit lives in Whisperwood, beyond the bushes that are not quite bushes.","Old stones stand deep in the southern woods. Nobody remembers who built them.","Hedges are sneaky things. Some of them hide doors. Try the meadow, south of the pond.","Golden hares only come out when the meadow is quiet. Well, quieter.","A crack in the Cinder Crags, east of the lookout. I would look myself, but I am a bard. We are delicate.","Toss a coin in the village well. Then toss a few more. Wells appreciate persistence.","Deep in the cave there is a pool that glitters. Someone left treasure by the water, or so the song goes.","In the marsh, a shrine sinks a little every year. Whatever it guards, it guards it poorly."]},biscuit:{n:"Biscuit",role:"The village cat",voice:900,cat:!0,greet:["Mrrp."],talk:["Biscuit purrs and headbutts your hand.","Biscuit ignores you with tremendous dignity.","Biscuit rolls over. It is a trap. You pet the belly anyway."]},oswin:{n:"Oswin",role:"Hermit of Whisperwood",voice:200,look:{skin:"#d8a070",hair:"#b0b0a8",hs:"long",shirt:"#6a5a3a",robe:!0,beard:"#c8c8c0",hold:"staff"},greet:["Visitors? Hmph. The trees told me you would come. The trees gossip."],talk:["The alpha, Greyfang, hunts the northwest glade. Old and clever. Dodge the lunge, then strike.","I came here to be alone. It is going very well, apart from you.","The ruins to the southwest were a watchtower once. Now they watch moss grow."]},dagna:{n:"Dagna",role:"Miner",voice:260,short:!0,look:{skin:"#e8a878",hair:"#a83a1a",hs:"braid",shirt:"#6a5a4a",hat:"minerhat",hatc:"#e0b030",hold:"pick",beard:"#a83a1a"},greet:["Rocks, rocks, rocks. And then gems! Then more rocks.","You again. Good. You are sturdier than you look."],talk:["The cave glitters in the dark. Something big guards the deepest chamber. I heard it walk.","Crabs up here are all shell and bad attitude. Hit them hard, then hit them again.","Golem cores fetch a fine price. Brom would pay double if you asked nicely. He will not, but ask."]},fitch:{n:"Fitch",role:"Peddler",voice:300,shop:"peddler",look:{skin:"#d8a070",hair:"#3a3a3a",hs:"short",shirt:"#5a6a3a",hat:"kerchief",hatc:"#8a6a2a",pack:!0},greet:["Prices are higher out here. So is the danger. Coincidence? Absolutely not."],talk:["The totems feed the thorn wall. Break all three and the way north opens.","The troll by the northwest totem hits like a falling house. Keep moving.","I sell to heroes and villains alike. Mostly heroes. Villains haggle."]}},QUESTS={m1:{n:"Slime Season",main:!0,giver:"maren",type:"kill",target:["slime"],need:6,zone:"meadow",goal:"Defeat slimes in Buttercup Meadow",reward:{gold:40,xp:40,items:[["potS",2]]},unlock:"forestOpen",offer:"The meadow slimes are at the cabbages again. Clear out six of them for me, would you? The meadow is down the south road.",prog:"Six slimes, dear. The meadow is just south of the village.",done:"Wonderful! Here, for your trouble. I will tell Captain Hale to open the west gate for you. Whisperwood lies beyond it."},m2:{n:"Wolves at the Edge",main:!0,giver:"hale",req:["m1"],type:"kill",target:["wolf"],need:8,zone:"forest",goal:"Defeat wolves in Whisperwood",reward:{gold:120,xp:150},offer:"The Elder vouches for you, so here is a real job. Wolves are prowling the edge of Whisperwood. Put down eight of them.",prog:"Eight wolves. Whisperwood is through the west gate.",done:"Eight! Not bad at all. Go and see Brom, he will want to sell you something sharper now."},m3:{n:"The Alpha",main:!0,giver:"hale",req:["m2"],type:"boss",flag:"killed_greyfang",zone:"forest",at:"glade",goal:"Defeat Greyfang in the northwest glade",reward:{gold:300,xp:350},unlock:"cragsOpen",offer:"Those wolves answer to Greyfang, the old alpha. He dens in the northwest glade of Whisperwood. End it, and I can finally send men to mend the east bridge.",prog:"Greyfang dens in the northwest glade. Watch for the lunge.",done:"Greyfang, gone! I will send a crew to mend the east bridge at once. The Cinder Crags are beyond it."},m4:{n:"The Missing Miner",main:!0,giver:"maren",req:["m3"],type:"talk",turnIn:"dagna",zone:"crags",goal:"Find Dagna in the Cinder Crags",reward:{gold:80,xp:150},offer:"A miner named Dagna went up into the Cinder Crags a month ago. Not a word since. Would you find her? Cross the east bridge.",prog:"Dagna should be somewhere in the Cinder Crags, past the east bridge.",done:"Lost? I am not lost. I know exactly where I am. The problem is where my lantern is."},m5:{n:"Light in the Deep",main:!0,giver:"dagna",req:["m4"],type:"find",item:"lantern",zone:"crags",at:"hideout",goal:"Recover the lantern from the goblin hideout",reward:{gold:200,xp:250,items:[["minerhelm",1]]},unlock:"caveOpen",offer:"Goblins stole my lantern and hauled it off to their hideout in the southeast of the crags. Bring it back and I will show you the way into Glimmer Cave. Down there without a light, you are a snack.",prog:"The goblin hideout is in the southeast of the crags. Look for a chest.",done:"My lantern! Take my old helmet too, it has kept this skull in one piece. The cave mouth is in the north cliff. Keep the light close."},m6:{n:"The Cave Warden",main:!0,giver:"dagna",req:["m5"],type:"boss",flag:"killed_warden",zone:"cave",at:"chamber",goal:"Defeat the Cave Warden",reward:{gold:800,xp:1e3},offer:"Something ancient guards the deepest chamber of Glimmer Cave. The golems follow it. Put it to rest, and bring back whatever it guards.",prog:"The Warden sleeps in the deepest chamber, at the north end of the cave.",done:"You beat the Warden? And it guarded a sigil? That is old magic. Take it to your Elder, she will know what it opens."},m7:{n:"The Sealed Road",main:!0,giver:"dagna",req:["m6"],type:"find",item:"sigil",turnIn:"maren",zone:"village",goal:"Bring the Warden's Sigil to Elder Maren",reward:{gold:200,xp:300},unlock:"marshOpen",offer:"Go on, take that sigil to Maren. Whatever it opens, I would rather it was her problem than mine.",prog:"Elder Maren waits by her hall in Lanternvale.",done:"The Warden's Sigil. It seals the north gate, and I hoped never to see it again. Beyond lies the Blightmarsh, where the Blight grows. I will open the gate."},m8:{n:"Roots of the Blight",main:!0,giver:"maren",req:["m7"],type:"totems",need:3,zone:"marsh",goal:"Destroy the Thorn Totems",reward:{gold:600,xp:1500},offer:"Three thorn totems feed a wall of brambles around the heart of the marsh. Break all three, and the way to the heart will open.",prog:"Three totems: one to the west, one to the east, one in the northwest.",done:"The thorn wall has fallen? Then only the Heart remains. Rest first. Then end this."},m9:{n:"Heart of Thorns",main:!0,giver:"maren",req:["m8"],type:"boss",flag:"killed_thornmother",zone:"marsh",at:"heart",goal:"Defeat the Thornmother",reward:{gold:2e3,xp:3e3},offer:"At the heart of the marsh grows the Thornmother, the root of the Blight itself. Go carefully. Come home.",prog:"The Thornmother waits beyond the fallen thorn wall.",done:"You did it. The lanterns burn brighter than I have seen in fifty years. Lanternvale owes you everything. We will start with a parade. A small one. It is a small village."},s_gel:{n:"Sticky Business",giver:"pipette",type:"collect",item:"gel",need:5,zone:"meadow",goal:"Bring Slime Gel to Pipette",reward:{gold:50,xp:30,items:[["potM",1]]},offer:"I need slime gel for my potions. Five globs! The meadow slimes drop it. Squish, squish!",prog:"Five globs of slime gel, please! Slimes drop it in the meadow.",done:"Perfect globs! Now I can brew proper Potions. They are on my shelf from today. Here, one on the house!"},s_locket:{n:"Nell's Locket",giver:"nell",type:"find",item:"locket",zone:"meadow",at:"well",goal:"Find Nell's locket near the old well",reward:{xp:60,items:[["charm",1]]},offer:"I lost my locket in the meadow, near the old well in the southwest. My eyes are not what they were. Would you look for it?",prog:"Near the old well, in the southwest of the meadow. It will sparkle, I am sure.",done:"My locket! Oh, thank you. Here, this charm kept my husband safe for forty years. Mostly from my cooking."},s_tonic:{n:"Special Delivery",giver:"wren",req:["m1"],type:"deliver",item:"tonic",turnIn:"oswin",zone:"forest",at:"hermit",goal:"Take the tonic to Oswin the hermit",reward:{xp:120,items:[["bead",1]]},offer:"A hermit lives deep in Whisperwood, in the southeast. Too proud to visit. Would you bring him this tonic?",prog:"Oswin lives in the southeast of Whisperwood. Look for bushes you can walk through.",done:"Wren's tonic! Bitter as my mood. Thank her for me. And take this, I have no use for trinkets."},s_badges:{n:"Bandit Bounty",giver:"hale",req:["m1"],type:"collect",item:"badge",need:6,zone:"forest",goal:"Bring Bandit Badges to Captain Hale",reward:{gold:150,xp:100},offer:"Bandits in Whisperwood carry little tin badges. Bring me six and I will pay a bounty.",prog:"Six b
