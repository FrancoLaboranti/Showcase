<canvas id="c"></canvas>

<section id="scrTitle" class="scr">
  <div class="wrap">
    <div class="logo">Cinderheart</div>
    <div class="tag">the last ember of a dead sun</div>
    <div class="menu">
      <button class="btn" id="btnContinue">Continue</button>
      <button class="btn" id="btnNew">New campaign</button>
      <div class="diff" id="diffPick">
        <button class="btn alt small" data-d="0">Story</button>
        <button class="btn alt small" data-d="1">Normal</button>
        <button class="btn alt small" data-d="2">Hard</button>
      </div>
    </div>
  </div>
  <div class="foot">tap ⓘ for how combat works</div>
</section>

<section id="scrMap" class="scr">
  <div class="head">
    <div class="zn" id="mapZone"></div>
    <div class="zs" id="mapZoneSub"></div>
    <div class="rule" id="mapRule"></div>
  </div>
  <div class="zones" id="mapZones"></div>
  <div id="mapPath"></div>
  <div id="nodeCard" class="panel"></div>
  <div id="mapParty"></div>
</section>

<section id="scrCamp" class="scr">
  <div id="campScene"></div>
  <div class="top">
    <div class="t">Camp</div>
    <div class="dim" id="campLvl"></div>
    <div class="xpbar" id="campXp"><i></i><span></span></div>
  </div>
  <div id="campSheet" class="panel">
    <div class="shd"><div><div class="nm" id="campName"></div><div class="rl" id="campRole"></div></div><span class="sp"></span><button class="btn small" id="btnCampBack">Map</button></div>
    <div id="campMain">
      <div class="tabs" id="campTabs">
        <button data-t="gear">Gear</button>
        <button data-t="skills">Abilities</button>
        <button data-t="tree">Tree</button>
      </div>
      <div id="campPane"></div>
    </div>
  </div>
</section>

<section id="scrBattle" class="scr">
  <div id="timeline"></div>
  <div id="zoneRule"><span class="ic"></span><span></span></div>
  <div id="hits"></div>
  <div id="plates"></div>
  <div id="banner"></div>
  <div id="ring"></div>
  <div id="rtip" class="panel"></div>
  <div id="coach" class="panel"></div>
</section>

<section id="scrDialog" class="scr">
  <button class="btn alt small" id="dlgSkip">Skip</button>
  <div id="dlgBox" class="panel">
    <div id="dlgName"></div>
    <div id="dlgText"></div>
    <div id="dlgChoices"></div>
    <div id="dlgMore">tap</div>
  </div>
</section>

<section id="scrResult" class="scr">
  <div id="resCard" class="panel"></div>
</section>

<div id="modal"><div class="panel"><div class="mt"></div><div class="md"></div><div class="acts"></div></div></div>
<div id="pauseOv"><div class="pt">Paused</div><button class="btn" id="btnResume">Resume</button><div class="popts"><button class="btn alt small" id="speed">Speed 1x</button><button class="btn alt small" id="logBtn">Battle log</button></div></div>
<div id="log" class="panel"></div>
<div id="tip" class="panel"></div>
<div id="dragGhost"></div>
<div id="rotate">Turn the phone sideways: Cinderheart is played in landscape.</div>


<div id="corner">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>

"sentinel","seer*","sentinel"],pre:"d_4d",desc:"Two Sentinels that resist steel, guarding a veteran Seer."},{id:"4e",type:"boss",name:"Magister Orrin",foes:["lens","orrin","lens"],pre:"d_4e",post:"d_4e_post",desc:"His Frost rises every turn. At 5, everyone without a Shield freezes."}],5:[{id:"5a",type:"battle",name:"The Nave",foes:["zealot","cantor","zealot"],pre:"d_5_intro",desc:"Zealots grow angrier as their allies fall; the Cantor Empowers them."},{id:"5b",type:"battle",name:"The Bell Tower",foes:["bellwarden","cantor","zealot"],pre:"d_5b",desc:"A Bellwarden stuns whoever is already silenced. Mind the Bell."},{id:"5c",type:"event",name:"Confession",event:"e_confess",desc:"Someone is whispering inside a confession box."},{id:"5d",type:"elite",name:"Hymn of Wrath",foes:["cantor","zealot*","cantor"],pre:"d_5d",desc:"Two Cantors buffing a veteran Zealot. Strip the blessings, or silence the choir."},{id:"5e",type:"boss",name:"Abbess Morrow",foes:["morrow"],pre:"d_5e",post:"d_5e_post",desc:"The Voice of the Hush charges a Vow of Silence over your whole party."}],6:[{id:"6a",type:"battle",name:"The First Step",foes:["shade","shade"],pre:"d_6_intro",desc:"Pall Shades flicker: steel passes through them every other turn."},{id:"6b",type:"battle",name:"The Last Congregation",foes:["seer","shade","zealot*"],pre:"d_6b",desc:"The Hush's last faithful, and the dark they pray to."},{id:"6c",type:"event",name:"The Edge of the Pall",event:"e_edge",desc:"The Stair ends at a door of nothing."},{id:"6d",type:"elite",name:"Umbral Choir",foes:["sentinel","shade","cantor*"],pre:"d_6d",desc:"A Sentinel, a veteran choir, and a Shade between them."},{id:"6e",type:"boss",name:"The Hierophant",foes:["casimir"],pre:"d_6e",post:"d_6e_post",desc:"Casimir, and what he becomes. The end of the Stair."}]},NODE_ICON={battle:"swords",elite:"skull",event:"diamond",boss:"crown"},DLG={d_prologue:[["narr","Forty years ago something came down out of the sky and swallowed the sun. People call it the Pall."],["narr","Tallowgate, the last city, lives around the Great Lantern. The Lantern lives on stolen light. So do the people who guard it."],["wren","Rule one of thieving: never take anything that is still beating."],["wren","...I am going to need a new rule one."],["quill","You're awake. Good. You were stabbed, you bled on my floor, and something inside your chest is glowing. I would like an explanation, and then payment."],["wren","It was a jewel in the Hush reliquary. Then somebody put a knife in me, and the jewel... went in with the knife."],["quill","It's a heart, dear. A hot one. I tried to take it out and it melted my good forceps."],["garrow","Wren. No family name. By order of the Lampwardens you are under arrest for theft from the Reliquary."],["wren","Big man, small door. Did you duck, or does the door just respect you?"],["garrow","Don't make this hard."],["quill","Oh, it's about to get hard. Those aren't Lampwardens outside. That's the Chandler's crew. They burn places."],["garrow","Nobody burns a clinic while I am standing in it."],["garrow","The arrest continues after."]],d_1a:[["thug","The Hush... wants its heart back..."],["quill","The Hush. The quiet church. The ones who say the dark is a mercy."],["wren","They didn't feel very merciful going in."],["garrow","The Hush pay the Lantern's tithe. They are lawful."],["quill","Then why are their hired knives in my clinic, Lampwarden?"],["garrow","...Walk. We find the Chandler, and we ask her."]],d_1b:[["narr","Behind the tallow pits the Chandler breeds her hounds: smoke with teeth and a candle for a skull."],["wren","Great. Dogs that are also a fire hazard."]],d_1d:[["narr","A Lampbreaker blocks the lane with a door he tore off its hinges."],["garrow","When he braces you can't go around him. Only through."],["quill","Then go through him. I'll stitch up whatever is left."]],d_1e:[["chandler","Little thief. You have something of the Hierophant's in you. Give it back and I will only make a small candle out of you."],["wren","What is it with you people and candles?"],["chandler","Everything burns down to wax, girl. Everything. Light the wicks!"],["narr","While a Tallow Candle burns at her side, the Chandler hits harder. When she lifts her cauldron, it shows on the turn order."]],d_1e_post:[["chandler","The Hierophant... will snuff you all..."],["garrow",'Orders. Sealed by my captain AND by the Hierophant. "Bring the heart to the Stair of Morning. Let the Pall feed."'],["garrow","My captain sold the Lantern to them."],["wren","So. Still arresting me?"],["garrow","...Later. Maybe."],["quill","If they want to feed that heart to the thing in the sky, it's because it is the one thing that could light the sun again. Take it to the top of the Stair first."],["wren","Up the Stair of Morning. Through the Saltmire, the Cinder Orchard, the old Observatory and the Hush's own cathedral."],["garrow","That is the worst plan I have ever heard."],["wren","You're coming, though."],["garrow","I'm coming."]],d_2_intro:[["narr","The Saltmire was a market once. Then the sea came in, and it never left."],["quill","Smugglers still cross it. Mind the Drowners: they swell up, and then they pop."],["wren","I love it here already."]],d_2b:[["narr","A Brine Acolyte walks with them, closing every wound you open. Silence it, stun it, or burn through it first."]],d_2d:[["narr","Two Drowners, fat with brine. Whatever kills them had better be ready for the splash."]],d_2e:[["narr","Something enormous moves under the market."],["quill","The smugglers call it Brackmaw. It eats boats."],["garrow","We are not a boat."],["narr","Brackmaw dives and surfaces. Submerged it barely feels a thing: save your strongest blows for when it comes up for air."]],d_2e_post:[["quill","Its stomach was full of Lampwarden badges."],["garrow","...And my captain's lamp."],["narr","Somewhere ahead, over the water, someone is singing."]],d_3_intro:[["narr","The Cinder Orchard never stopped burning. The trees are charcoal that remembers being alive."],["seren","Give me the heart, thief, and I will let the big one dream something nice."],["narr","Garrow is snoring on his feet."],["wren","Is that a threat or a lullaby?"],["seren","In the Hush it is the same thing."],["narr","The embers stir. Cinder Imps pour out of the trees, and they are not choosy about whom they burn."]],d_3a:[["seren","You could have let them burn me."],["wren","I could have. You sing too well to waste."],["seren","The Hierophant took my sister's light for his Stair. I sang for him for six years. I am done singing for him."],["garrow","What did I miss."],["quill","A conversion."],["narr","Seren joins the party. From now on you choose which three go into each battle, at the Camp."]],d_3b:[["narr","An Ashbark shelters a Wisp and an Imp. The Imp eggs the others on: kill it first, or everyone hits harder."]],d_3d:[["narr","The Orchard's gate is two Ashbarks thick. They shrug off fire. Plan accordingly."]],d_3e:[["seren","The Ashen Matron was the Orchard's guardian. The Hierophant fed her ashes until she forgot what she guarded."],["matron","Little sparks. Come to me. I will keep you warm forever."],["narr","Her Ember Hoard turns fire into food: Ember damage HEALS her until her bark cracks. Bring steel and void."]],d_3e_post:[["matron","Thank you... little spark... carry it up... all the way up..."],["narr","She leaves her heartwood behind, still warm."]],d_4_intro:[["narr","The Observatory was built to watch the sun. Now it watches nothing, and it is very, very cold."],["quill","The Stair of Morning starts at the top of the dome."],["seren","Deep Cold: a slowed body takes more damage in here. Theirs too."]],d_4b:[["narr","A Starglass Seer. When it Foretells, a red mark hangs over one of you: shield them, cover them, or break the Seer's focus."]],d_4d:[["narr","Two Sentinels, all ice and patience, around a Seer that has seen you coming."]],d_4e:[["orrin","I froze the stars themselves to keep you from climbing. The sun is dead, child. Let the dead rest."],["wren","You first."],["narr","Orrin's Frost rises every turn, faster with each Cryo Lens alive. At 5 he casts Absolute Zero, and whoever has no Shield freezes."]],d_4e_post:[["orrin","Casimir... will open the sky... and let it in..."],["seren","The Hierophant. He is waiting above the cathedral."],["garrow","Then we go through the cathedral."]],d_5_intro:[["narr","The Bell Cathedral. Every bell of the Hush has had its clapper pulled, except one."],["seren","The Great Bell. When it tolls, whoever holds the most Ember is struck silent. Spend it before it rings."]],d_5b:[["narr","The Bellwarden rings the tower. Anyone already silenced who takes its Knell is stunned as well."]],d_5d:[["narr","Two Cantors pour hymns into one veteran Zealot. Strip the blessings, or quiet the choir."]],d_5e:[["morrow","Hush now. Hush. Every scream in this world ends in silence. I only bring it sooner."],["seren","Abbess."],["morrow","Little Seren. You always sang a half-step sharp."],["narr","Every third turn the Abbess charges a Vow of Silence over your whole party. A Ward stops it; so does a stun that breaks her focus."]],d_5e_post:[["morrow","Silence... was mercy..."],["seren","No. It was just quiet."]],d_6_intro:[["narr","Above the cathedral the Stair of Morning climbs into the Pall. There is no light up here but the one in Wren's chest."],["wren","It's pulling. The heart. It wants to go home."],["quill","Then let's walk it to the door."]],d_6b:[["narr","The Hush's last faithful kneel on the Stair, and the dark kneels with them."]],d_6d:[["narr","The Stair narrows. Something that used to be a choir is waiting."]],d_6e:[["casimir","You carried it all the way up for me. How thoughtful."],["wren","I carried it up to throw it at the sky, actually."],["casimir","The Pall is not a monster, child. It is peace. When the last ember goes out no one will ever be afraid of the dark again, because there will be nothing else."],["garrow","I have heard enough sermons."]],d_6e_post:[["narr","Wren reaches into her own chest, takes out the heart, and throws it into the eye of the Pall."],["narr","For a moment, nothing. Then the black sky cracks like old glass, and light pours through the cracks."],["wren","...Still warm in there. Huh. It left me a spark."],["garrow","Wren."],["wren","Mm."],["garrow","You are under arrest."],["wren","For what?"],["garrow","Theft. Of the sun. From the sky."],["quill","Technically, she returned it."],["seren","Listen. Can you hear it? Nothing is quiet any more."],["narr","The sun came back pale and small, like a coin at the bottom of dark water. But it came back."],["narr","THE END. Every battle stays open on the map, for anyone who wants to fight it again."]]},SPEAKER_NAME={narr:"",thug:"Tallow Thug",chandler:"The Chandler",matron:"The Ashen Matron",orrin:"Magister Orrin",morrow:"Abbess Morrow",casimir:"Hierophant Casimir",brackmaw:"Brackmaw",sun:"The Hollow Sun"},BLESS={ember2:"Your party starts the next battle with +2 Ember each.",haste:"Your party starts the next battle with Haste.",empower:"Your party starts the next battle Empowered for 2 turns.",poison:"Your party starts the next battle Poisoned."},EVENTS={e_doubt:{lines:[["garrow","My captain signed the order to bring you in. He never signs anything himself."],["wren","So somebody wanted me caught quietly."],["garrow","Show me what you stole."]],choices:[{text:"Show him the heart",sub:"Everyone gains 90 XP",fx:{xp:90},after:[["garrow","...It's warm. Like standing in the sun. I had forgotten what that was like."],["wren","Forty years is a long time to forget."]]},{text:"Pick his pocket while he stares",sub:"Gain a Wick Charm (+7 Speed)",fx:{item:"c_wick"},after:[["garrow","I saw that."],["wren","You saw nothing. It was very dark."]]}]},e_shrine:{lines:[["narr","Half under the water stands a shrine to the old sun. Somebody still leaves offerings."],["quill","Dead god, living pilgrims. Typical."]],choices:[{text:"Pray at the shrine",sub:"Blessing: +2 Ember each at the start of the next battle",fx:{bless:"ember2"},after:[["narr","For a moment, the water is warm."]]},{text:"Loot the offerings",sub:"A random rare item, but you start the next battle Poisoned",fx:{item:"rare",bless:"poison"},after:[["quill","It isn't stealing if the god is dead."],["wren","That is exactly what I always say!"]]}]},e_song:{lines:[["seren","My sister was a cantor too. Mira. The Hierophant took her light for his Stair."],["wren","Took it how?"],["seren","He asked her to sing, and then he asked her to stop. Forever."]],choices:[{text:"Ask her to sing Mira's song",sub:"+1 skill point for Seren",fx:{sp:"seren"},after:[["seren","Thank you for listening. Nobody in the Hush ever listens."]]},{text:"Ask about the Hierophant's plan",sub:"Everyone gains 150 XP",fx:{xp:150},after:[["seren","He will feed the heart to the Pall, and the Pall will close. Forever. He calls it mercy."],["garrow","He calls a lot of things mercy."]]}]},e_chart:{lines:[["narr","A star chart covers the dome: every star that went out, crossed off by hand."],["quill","Someone kept count. For forty years."]],choices:[{text:"Study the chart",sub:"+1 skill point for Wren",fx:{sp:"wren"},after:[["wren","The heart knows where it came from. I can feel the way up."]]},{text:"Burn it to keep warm",sub:"Blessing: Haste at the start of the next battle",fx:{bless:"haste"},after:[["garrow","Practical."],["quill","Vandal."]]}]},e_confess:{lines:[["narr","A confession box. Someone inside is whispering."],["seren","A novice. She's hiding from the Abbess."]],choices:[{text:"Let her go",sub:"Everyone gains 200 XP, and she leaves you a Candle Stub",fx:{xp:200,item:"c_stub"},after:[["narr","She slips away between the pews. On the bench, a candle stub, still warm."]]},{text:"Take the Abbess's key from her",sub:"A random epic item",fx:{item:"epic"},after:[["seren","She's shaking. Good. So am I."]]}]},e_edge:{lines:[["narr","The Stair ends at a door made of nothing. Beyond it, the Pall breathes."],["
