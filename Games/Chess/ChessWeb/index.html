<body>
  <canvas id="c"></canvas>

  <div id="menu">
    <h1>CHESS</h1>
    <div class="sub">Choose how to play</div>
    <button data-mode="pvp">2 Players</button>
    <button data-mode="w">Play as White (vs AI)</button>
    <button data-mode="b">Play as Black (vs AI)</button>
    <button data-mode="aiva">AI vs AI (spectator)</button>
    <div class="engine-line" id="engineLine">Loading Stockfish…</div>
  </div>

  <div id="diffMenu">
    <h2 id="diffTitle">Difficulty</h2>
    <div class="diff-section" id="diffSectionW">
      <div class="diff-label" id="diffLabelW">AI difficulty</div>
      <div class="diff-row" id="diffRowW"></div>
    </div>
    <div class="diff-section" id="diffSectionB" style="display:none">
      <div class="diff-label">Black difficulty</div>
      <div class="diff-row" id="diffRowB"></div>
    </div>
    <button id="diffStart" style="display:none">Start</button>
  </div>

  
  <button class="cbtn" id="btnExit" aria-label="exit" title="Exit to Arcade">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="cbtn" id="btnInfo" aria-label="info" title="Info">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><circle cx="12" cy="8" r="0.9" fill="currentColor" stroke="none"/></svg>
  </button>
  <button class="cbtn" id="btnFs" aria-label="fullscreen" title="Fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><g class="ic-enter"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></g><g class="ic-exit"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></g></svg>
  </button>
  <button class="cbtn" id="btnMute" aria-label="sound" title="Sound">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><g class="ic-on"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></g><g class="ic-off"><path d="M16 9l5 6M21 9l-5 6"/></g></svg>
  </button>
  <button class="cbtn" id="btnBack" aria-label="back" title="Back to menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/></svg>
  </button>
  <button class="cbtn" id="btnPause" aria-label="pause" title="Pause">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><g class="ic-pause"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></g><g class="ic-play"><path d="M8 5l12 7-12 7z"/></g></svg>
  </button>
  <div id="fpsOverlay">FPS: --</div>

  
  <div id="bar" style="display:none">
    <button id="btnFirst" title="Starting position" aria-label="start">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"/></svg>
    </button>
    <button id="btnPrev" title="Previous" aria-label="previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <button id="btnNext" title="Next" aria-label="next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button id="btnLast" title="Current position" aria-label="last">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 6l6 6-6 6M5 6l6 6-6 6"/></svg>
    </button>
    
    <span class="end-sep" aria-hidden="true"></span>
    <button id="btnEndRematch" class="end-btn" title="Rematch: same mode and level (R)" aria-label="rematch">Rematch</button>
    <button id="btnEndMenu" class="end-btn" title="Back to menu (N)" aria-label="back to menu">Menu</button>
  </div>
