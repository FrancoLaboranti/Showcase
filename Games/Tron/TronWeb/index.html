  <script>(function(){let o=0,s=performance.now();const t=document.getElementById("fpsOverlay");function l(){o++;const n=performance.now();if(n-s>=500){const e=Math.round(o*1e3/(n-s));t.style.display!=="none"&&(t.textContent="FPS: "+e),o=0,s=n}requestAnimationFrame(l)}l();const a=document.getElementById("btnInfo");a.addEventListener("pointerdown",n=>{n.preventDefault();const e=t.style.display==="block";t.style.display=e?"none":"block",a.classList.toggle("on",!e)})})();</script>
